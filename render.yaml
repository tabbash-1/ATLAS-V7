services:
  - type: web
    name: atlas-smart-money-collector
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: python3 render_boot_patch.py && python3 cloud_start_web.py
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.4
      - key: ATLAS_DATA_DIR
        value: /var/data
      - key: ATLAS_RELEASE
        value: "V7-QUICK-TRADE-SHADOW-RC4"
      - key: ATLAS_CLOUD_FORWARD_ENABLED
        value: "1"
      - key: ATLAS_CLOUD_FORWARD_INTERVAL_SECONDS
        value: "3000"
      - key: ATLAS_CLOUD_FORWARD_MIN_SCORE
        value: "68"
      - key: ATLAS_CLOUD_FORWARD_MAX_PER_CYCLE
        value: "3"
      - key: ATLAS_ALERT_MIN_SCORE
        value: "82"
      - key: ATLAS_ALERT_MIN_RR
        value: "2.0"
      - key: ATLAS_ALERT_MIN_VOLUME_QUALITY
        value: "58"
      - key: ATLAS_ALERT_COOLDOWN_MINUTES
        value: "240"
    disk:
      name: atlas-data
      mountPath: /var/data
      sizeGB: 1
