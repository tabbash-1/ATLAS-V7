<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ATLAS V7 · Trade Outcomes</title>
<style>:root{color-scheme:dark;--bg:#090c13;--card:#111826;--line:#253047;--text:#ecf1fa;--muted:#8f9db5;--ok:#54d68a;--bad:#ff6f7f;--warn:#f2c75c}*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#141a29,#090c13 38%);color:var(--text);font-family:Inter,system-ui,sans-serif}main{max-width:1100px;margin:auto;padding:28px 16px 60px}h1{font-size:clamp(30px,6vw,48px);margin:4px 0 8px}.sub{color:var(--muted);font-size:13px}.controls{display:flex;gap:10px;flex-wrap:wrap;margin:20px 0}.controls select,.controls button{background:#101725;color:var(--text);border:1px solid var(--line);border-radius:12px;padding:10px 12px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.card{background:rgba(17,24,38,.92);border:1px solid var(--line);border-radius:16px;padding:16px}.label{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}.value{font-size:28px;font-weight:800;margin-top:8px}.ok{color:var(--ok)}.bad{color:var(--bad)}.warn{color:var(--warn)}table{width:100%;border-collapse:collapse;margin-top:18px;background:rgba(17,24,38,.92);border:1px solid var(--line);border-radius:16px;overflow:hidden}th,td{padding:11px 10px;border-bottom:1px solid var(--line);text-align:left;font-size:12px}th{color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:.06em}.pill{font-weight:800}.win{color:var(--ok)}.loss{color:var(--bad)}.open{color:var(--warn)}.flat{color:var(--muted)}@media(max-width:760px){.grid{grid-template-columns:repeat(2,1fr)}table{display:block;overflow-x:auto;white-space:nowrap}}</style></head>
<body><main><div class="sub">ATLAS V7 · READ-ONLY RESEARCH LEDGER</div><h1>Trade Outcomes</h1><div class="sub">WIN / LOSS is computed from the frozen forward return in the signaled direction. This does not change ATLAS decisions and is not TP/SL path settlement.</div>
<div class="controls"><select id="h"><option value="1">1 hour</option><option value="4">4 hours</option><option value="12">12 hours</option><option value="24" selected>24 hours</option></select><select id="scope"><option value="signals" selected>Signal-qualified only</option><option value="all">All observations</option></select><button id="refresh">Refresh</button></div>
<div class="grid"><div class="card"><div class="label">Closed</div><div id="closed" class="value">—</div></div><div class="card"><div class="label">Wins</div><div id="wins" class="value ok">—</div></div><div class="card"><div class="label">Losses</div><div id="losses" class="value bad">—</div></div><div class="card"><div class="label">Win rate</div><div id="rate" class="value">—</div></div></div>
<table><thead><tr><th>Time</th><th>Asset</th><th>Direction</th><th>Score</th><th>Entry</th><th>Return</th><th>Outcome</th><th>Source</th></tr></thead><tbody id="rows"><tr><td colspan="8">Loading…</td></tr></tbody></table>
</main><script>
const $=id=>document.getElementById(id);async function get(p){const r=await fetch(p,{cache:'no-store'});if(!r.ok)throw Error(await r.text());return r.json()}function fmt(n,d=2){return n==null?'—':Number(n).toFixed(d)}async function load(){const h=$('h').value,scope=$('scope').value;try{const [s,l]=await Promise.all([get(`/api/outcomes/summary?horizon=${h}&scope=${scope}`),get(`/api/outcomes/ledger?horizon=${h}&scope=${scope}&limit=300`)]);const o=s.overall||{};$('closed').textContent=o.closed??0;$('wins').textContent=o.wins??0;$('losses').textContent=o.losses??0;$('rate').textContent=o.win_rate_pct==null?'—':o.win_rate_pct+'%';$('rows').innerHTML=(l.rows||[]).map(x=>`<tr><td>${x.captured_at?new Date(x.captured_at).toLocaleString():'—'}</td><td>${x.symbol||'—'}</td><td>${x.direction||'—'}</td><td>${fmt(x.score,1)}</td><td>${fmt(x.entry,4)}</td><td>${x.directional_return_pct==null?'—':fmt(x.directional_return_pct,3)+'%'}</td><td><span class="pill ${(x.outcome||'').toLowerCase()}">${x.outcome}</span></td><td>${x.source||'—'}</td></tr>`).join('')||'<tr><td colspan="8">No matching observations yet.</td></tr>'}catch(e){$('rows').innerHTML=`<tr><td colspan="8">${String(e)}</td></tr>`}}$('refresh').onclick=load;$('h').onchange=load;$('scope').onchange=load;load();
</script></body></html>
