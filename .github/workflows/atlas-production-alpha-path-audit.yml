name: ATLAS Production Alpha Path Audit
on:
  push:
    branches: [main]
    paths:
      - 'production_signal_scoring.py'
      - 'production_alpha_path_audit.py'
      - 'tests/test_production_alpha_path_audit.py'
      - '.github/workflows/atlas-production-alpha-path-audit.yml'
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: atlas-production-alpha-path-audit-${{ github.ref }}
  cancel-in-progress: true
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Verify scorer path and safety
        run: PYTHONPATH=. python3 tests/test_production_alpha_path_audit.py
      - name: Build canonical alpha path evidence
        run: python3 production_alpha_path_audit.py
      - name: Enforce no production mutation
        run: jq -e '.formula_contract_ok == true and .research_only == true and .automatic_promotion == false and .production_mutation_authorized == false' status/production-alpha-path-audit-latest.json >/dev/null
      - name: Commit evidence
        run: |
          git config user.name "atlas-alpha-path-audit"
          git config user.email "atlas-alpha-path-audit@users.noreply.github.com"
          git add status/production-alpha-path-audit-latest.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "research: update canonical alpha path audit [skip ci] [skip render]"
          git pull --rebase origin main
          git push
