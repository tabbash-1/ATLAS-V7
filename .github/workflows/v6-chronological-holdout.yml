name: ATLAS V6 Chronological Holdout

on:
  push:
    branches: [main]
    paths:
      - 'v6_chronological_holdout.py'
      - 'v6_shadow_replay.py'
      - 'status/wait-outcomes.json'
      - '.github/workflows/v6-chronological-holdout.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  holdout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run chronological stress test
        run: python v6_chronological_holdout.py
      - name: Verify guardrails
        run: |
          python - <<'PY'
          import json
          x=json.load(open('status/v6-chronological-holdout.json'))
          g=x['guardrails']
          assert g['research_only'] is True
          assert g['production_threshold_changed'] is False
          assert g['production_score_changed'] is False
          assert g['auto_promotion_enabled'] is False
          print(x['decision'], x['next_step'])
          PY
      - name: Commit report
        run: |
          if [ -z "$(git status --porcelain -- status/v6-chronological-holdout.json)" ]; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add status/v6-chronological-holdout.json
          git commit -m 'data: refresh V6 chronological holdout'
          git push
