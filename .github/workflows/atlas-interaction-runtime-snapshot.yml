name: ATLAS Interaction Validation Snapshot

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/atlas-interaction-runtime-snapshot.yml'
      - 'aligned_frozen_cohort.py'
      - 'edge_evidence_joint_coverage.py'
      - 'edge_evidence_overlap.py'
      - 'interaction_protocol.py'
      - 'interaction_status_api.py'
      - 'interaction_outcome_runtime.py'
      - 'interaction_preflight.py'
      - 'interaction_outcome_validator.py'
      - 'interaction_rule_registry.py'
      - 'interaction_validator_guard.py'
      - 'profit_engine_runtime.py'
      - 'microstructure_runtime.py'
      - 'volatility_runtime.py'
      - 'cloud_start.py'
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: atlas-interaction-validation-snapshot
  cancel-in-progress: true

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Fetch cached interaction validation state
        shell: bash
        env:
          BASE_URL: https://atlas-v7.onrender.com
        run: |
          set -euo pipefail
          mkdir -p status/history
          tmp="status/interaction-validation-latest.json.tmp"
          ok=0
          for attempt in $(seq 1 20); do
            code="$(curl -L --connect-timeout 20 --max-time 60 -sS -w '%{http_code}' -o "$tmp" "${BASE_URL}/api/research/interaction-status" || true)"
            if [[ "$code" =~ ^2 ]] && jq -e . "$tmp" >/dev/null 2>&1 && \
               jq -e '.research_only == true and .live_execution == false and .cached_only == true and .version == "INTERACTION_STATUS_API_V2_GOVERNANCE_DIAGNOSTICS_CACHED_ONLY" and (.runtime.refreshes // 0) >= 1 and (.preflight | type) == "object" and (.governance | type) == "object"' "$tmp" >/dev/null 2>&1; then
              ok=1
              break
            fi
            echo "Waiting for deployed interaction preflight v2 (attempt ${attempt}/20, HTTP ${code:-none})"
            sleep 15
          done
          if [[ "$ok" != "1" ]]; then
            echo "Interaction status endpoint did not reach V2 governance diagnostics with a completed cached preflight within the deployment grace period." >&2
            echo "Last HTTP code: ${code:-none}" >&2
            cat "$tmp" >&2 || true
            exit 1
          fi
          mv "$tmp" status/interaction-validation-latest.json
          python3 - <<'PY'
          import json, pathlib, datetime
          p=pathlib.Path('status/interaction-validation-latest.json')
          row=json.loads(p.read_text())
          row['_snapshot_captured_at']=datetime.datetime.now(datetime.timezone.utc).isoformat()
          h=pathlib.Path('status/history/interaction-validation-snapshots.jsonl')
          with h.open('a') as f:
              f.write(json.dumps(row,separators=(',',':'))+'\n')
          p.write_text(json.dumps(row,indent=2,sort_keys=True))
          PY
      - name: Commit interaction validation snapshot
        shell: bash
        run: |
          git config user.name "atlas-interaction-monitor"
          git config user.email "atlas-interaction-monitor@users.noreply.github.com"
          git add status/interaction-validation-latest.json status/history/interaction-validation-snapshots.jsonl
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore: update interaction validation snapshot [skip ci]"
          git pull --rebase origin main
          git push
