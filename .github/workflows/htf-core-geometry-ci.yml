name: HTF Core Geometry CI

on:
  push:
    branches: [main]
    paths:
      - 'htf_structural_thesis.py'
      - 'htf_price_action.py'
      - 'htf_price_action_overlay.py'
      - 'htf_scenario_engine.py'
      - 'htf_core_geometry_overlay.py'
      - 'product_quality_gate_overlay.py'
      - 'cloud_start_web.py'
      - 'tests/test_htf_structural_thesis.py'
      - 'tests/test_htf_price_action.py'
      - 'tests/test_htf_core_geometry_overlay.py'
      - 'tests/test_product_quality_gate_overlay.py'
      - 'tests/test_render_web_htf_runtime_contract.py'
      - '.github/workflows/htf-core-geometry-ci.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  htf-core-geometry:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile HTF production modules
        run: python -m py_compile htf_structural_thesis.py htf_price_action.py htf_price_action_overlay.py htf_scenario_engine.py htf_core_geometry_overlay.py product_quality_gate_overlay.py cloud_start_web.py
      - name: Run HTF direction and geometry regressions
        run: PYTHONPATH=. python -m pytest -q tests/test_htf_structural_thesis.py tests/test_htf_price_action.py tests/test_htf_core_geometry_overlay.py tests/test_product_quality_gate_overlay.py tests/test_render_web_htf_runtime_contract.py
      - name: Preserve production safety contract
        run: |
          grep -q 'ATLAS_CLOUD_FORWARD_MIN_SCORE.*68' cloud_start_web.py
          grep -q 'score_threshold_unchanged.*True' htf_core_geometry_overlay.py
          grep -q 'live_execution.*False' htf_core_geometry_overlay.py
          grep -q 'one_hour_can_flip_product_direction.*False' product_quality_gate_overlay.py
          grep -q 'geometry_must_not_be_relabelled_to_opposite_product_direction.*True' product_quality_gate_overlay.py
