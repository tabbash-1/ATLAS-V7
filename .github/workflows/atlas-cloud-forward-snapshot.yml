name: ATLAS Cloud Forward Snapshot

on:
  push:
    branches: [main]
    paths:
      - 'render.yaml'
      - 'collector_server.py'
      - 'cloud_start.py'
      - 'forward_microstructure_freeze_runtime.py'
      - '.github/workflows/atlas-cloud-forward-snapshot.yml'
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: atlas-cloud-forward-snapshot
  cancel-in-progress: true

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      BASE_URL: https://atlas-v7.onrender.com
    steps:
      - uses: actions/checkout@v4
      - name: Fetch deployed cloud forward status
        run: |
          set -euo pipefail
          mkdir -p status/history
          tmp="status/cloud-forward-latest.json.tmp"
          ok=0
          for attempt in $(seq 1 28); do
            code="$(curl -L --connect-timeout 20 --max-time 60 -sS -w '%{http_code}' -o "$tmp" "${BASE_URL}/api/cloud-forward/status" || true)"
            if [[ "$code" =~ ^2 ]] && jq -e . "$tmp" >/dev/null 2>&1 && \
               jq -e '.interval_seconds == 1800 and .min_score == 68 and .max_per_cycle == 3 and (.cycles // 0) >= 1 and .research_only == true and .live_execution == false' "$tmp" >/dev/null 2>&1; then
              ok=1
              break
            fi
            echo "Waiting for deployed 30m cloud-forward collector (attempt ${attempt}/28, HTTP ${code:-none})"
            sleep 15
          done
          if [[ "$ok" != "1" ]]; then
            echo "30m Cloud Forward collector did not become live within deployment grace period." >&2
            echo "Last HTTP code: ${code:-none}" >&2
            cat "$tmp" >&2 || true
            exit 1
          fi
          mv "$tmp" status/cloud-forward-latest.json
          python3 - <<'PY'
          import datetime,json,pathlib
          p=pathlib.Path('status/cloud-forward-latest.json')
          row=json.loads(p.read_text())
          row['_snapshot_captured_at']=datetime.datetime.now(datetime.timezone.utc).isoformat()
          p.write_text(json.dumps(row,indent=2,sort_keys=True))
          h=pathlib.Path('status/history/cloud-forward-snapshots.jsonl')
          with h.open('a') as f:f.write(json.dumps(row,separators=(',',':'))+'\n')
          PY
      - name: Commit cloud forward snapshot
        run: |
          git config user.name "atlas-cloud-forward-monitor"
          git config user.email "atlas-cloud-forward-monitor@users.noreply.github.com"
          git add status/cloud-forward-latest.json status/history/cloud-forward-snapshots.jsonl
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore: update cloud forward snapshot [skip ci]"
          git pull --rebase origin main
          git push
