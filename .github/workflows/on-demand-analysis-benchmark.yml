name: ATLAS On-Demand Analysis Benchmark
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/on-demand-analysis-benchmark.yml'
      - 'research/on_demand_analysis_benchmark.py'
      - 'historical_core_4_12h_replay.py'
      - 'tests/test_on_demand_analysis_benchmark.py'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/on-demand-analysis-benchmark.yml'
      - 'research/on_demand_analysis_benchmark.py'
      - 'historical_core_4_12h_replay.py'
      - 'tests/test_on_demand_analysis_benchmark.py'
  workflow_dispatch:
  schedule:
    - cron: '23 3 * * 1'
permissions:
  contents: write
jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependency
        run: python -m pip install pytest
      - name: Regression tests
        run: python -m pytest -q tests/test_on_demand_analysis_benchmark.py
      - name: Run frozen point-in-time benchmark
        if: github.event_name != 'pull_request'
        run: |
          python research/on_demand_analysis_benchmark.py --days 180 > /tmp/bench.txt
          python - <<'PY'
          import json
          from pathlib import Path
          line=next(x for x in Path('/tmp/bench.txt').read_text().splitlines() if x.startswith('ATLAS_ON_DEMAND_BENCHMARK='))
          data=json.loads(line.split('=',1)[1])
          Path('status/on-demand-analysis-benchmark-latest.json').write_text(json.dumps(data,indent=2,sort_keys=True)+'\n')
          PY
      - name: Contract check
        if: github.event_name != 'pull_request'
        run: |
          jq -e '.schema=="ATLAS_ON_DEMAND_ANALYSIS_BENCHMARK_V4_12H_THESIS_4H_PULLBACK" and .research_only==true and .production_effect=="NONE" and .can_override_production==false and (.horizons_h==[4,8,12])' status/on-demand-analysis-benchmark-latest.json
      - name: Print benchmark summary
        if: github.event_name != 'pull_request'
        run: |
          jq '{schema,overall:{legacy_1h:.overall.legacy_1h,htf_consensus:.overall.htf_consensus,analyst_stack_v2:.overall.analyst_stack_v2}}' status/on-demand-analysis-benchmark-latest.json
      - name: Commit evidence
        if: github.event_name != 'pull_request'
        run: |
          git config user.name "atlas-research-bot"
          git config user.email "atlas-research-bot@users.noreply.github.com"
          git add status/on-demand-analysis-benchmark-latest.json
          git diff --cached --quiet || git commit -m "research: refresh on-demand analysis benchmark"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep $((attempt * 2))
          done
          echo "benchmark evidence push failed after retry/rebase loop" >&2
          exit 1
