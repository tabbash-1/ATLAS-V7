name: ATLAS Breakout Decision

on:
  pull_request:
    branches: [main]
    paths:
      - 'production_signal_scoring.py'
      - 'decision_engine_v7.py'
      - 'cloud_start.py'
      - 'tests/test_breakout_decision_engine.py'
      - '.github/workflows/atlas-breakout-decision.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Syntax
        run: python -m py_compile production_signal_scoring.py decision_engine_v7.py cloud_start.py tests/test_breakout_decision_engine.py
      - name: Breakout regression tests
        run: PYTHONPATH=. python tests/test_breakout_decision_engine.py
      - name: Safety invariants
        run: |
          grep -q 'ATLAS_CLOUD_FORWARD_MIN_SCORE.*68' cloud_start.py
          grep -q 'uses_current_candle_as_obstacle.*False' decision_engine_v7.py
          grep -q 'can_execute.*False' decision_engine_v7.py
