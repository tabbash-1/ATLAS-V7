name: ATLAS Production Validation Scorecard

on:
  workflow_run:
    workflows: ['ATLAS $10K Paper Portfolio']
    types: [completed]
  pull_request:
    branches: [main]
    paths:
      - 'production_validation_scorecard.py'
      - 'atlas_product_readiness_gate.py'
      - 'tests/test_production_validation_scorecard.py'
      - 'tests/test_atlas_product_readiness_gate.py'
      - 'tests/test_product_readiness_workflow_chain.py'
      - '.github/workflows/atlas-production-validation-scorecard.yml'
  push:
    branches: [main]
    paths:
      - 'production_validation_scorecard.py'
      - 'atlas_product_readiness_gate.py'
      - 'tests/test_production_validation_scorecard.py'
      - 'tests/test_atlas_product_readiness_gate.py'
      - 'tests/test_product_readiness_workflow_chain.py'
      - 'status/canonical-outcomes-latest.json'
      - 'status/quick-trade-outcomes.json'
      - '.github/workflows/atlas-production-validation-scorecard.yml'
  schedule:
    - cron: '12 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: atlas-production-validation-scorecard
  cancel-in-progress: false

jobs:
  validate:
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout latest main after upstream workflow
        if: github.event_name == 'workflow_run'
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Checkout triggering ref
        if: github.event_name != 'workflow_run'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Regression
        run: |
          python -m py_compile production_validation_scorecard.py atlas_product_readiness_gate.py
          PYTHONPATH=. python - <<'PY'
          import tests.test_production_validation_scorecard as t
          import tests.test_evidence_pipeline_event_chain as e
          import tests.test_atlas_product_readiness_gate as r
          import tests.test_product_readiness_workflow_chain as w
          for module in (t,e,r,w):
              for name in sorted(x for x in dir(module) if x.startswith('test_')):
                  getattr(module,name)()
                  print('PASS', module.__name__, name)
          PY
      - name: Build post-V2 scorecard
        run: python production_validation_scorecard.py
      - name: Build current product readiness
        run: python atlas_product_readiness_gate.py
      - name: Verify isolation and truth contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('status/production-validation-latest.json').read_text())
          assert p['schema']=='ATLAS_PRODUCTION_VALIDATION_SCORECARD_V2_DIAGNOSTICS'
          assert p['decision_source_of_truth']=='FINAL_TRADE_GATE'
          assert p['epoch']['id']=='HTF_SR_V2_2026-09-14'
          assert p['sample_readiness']['formal_min_terminal']==30
          assert p['interpretation']['profitability_claim_allowed'] is False
          assert p['interpretation']['cost_adjusted_profitability_claim_allowed'] is False
          assert p['cost_model']['schema']=='ATLAS_VALIDATION_COST_MODEL_V1'
          assert p['cost_model']['fee_bps_per_side']==5.0
          assert p['cost_model']['slippage_bps_per_side']==3.0
          assert p['cost_model']['funding_bps_per_12h']==1.0
          assert p['cost_model']['production_impact']=='NONE'
          assert p['diagnostic_cohorts']['research_only'] is True
          assert p['diagnostic_cohorts']['production_impact']=='NONE'
          assert p['safety']['production_threshold']==68
          assert p['safety']['can_override_production'] is False
          assert p['safety']['live_execution'] is False
          r=json.loads(Path('status/product-readiness-latest.json').read_text())
          assert r['schema']=='ATLAS_PRODUCT_READINESS_GATE_V2_FINAL_GATE_AUTHORITY'
          assert r['technical_ready'] is True
          assert r['canonical_contract']=='FINAL_TRADE_GATE'
          assert r['decision_source_of_truth']=='FINAL_TRADE_GATE'
          assert r['product_horizon']=='4-12H'
          assert r['analysis_only'] is True and r['live_execution'] is False
          assert r['production_score_threshold_changed'] is False
          assert r['historical_post_v2_excluded_from_current_readiness'] is True
          assert r['observed']['current_geometry_version']=='ATLAS_GEOMETRY_V6_MIN_1_5_ATR_INVALIDATION'
          assert r['observed']['matured_12h_terminal']==p['current_geometry']['summary']['terminal']
          assert r['observed']['cost_adjusted_terminal']==p['current_geometry']['cost_adjusted']['terminal_costed']
          v6=[c for c in r['checks'] if c['name']=='CURRENT_GEOMETRY_V6_EVIDENCE']
          assert len(v6)==1 and v6[0]['passed'] is True
          print('PRODUCTION_VALIDATION_OK', p['post_v2'])
          print('PRODUCT_READINESS_OK', r['state'], r['observed'])
          PY
      - name: Upload scorecard artifact
        uses: actions/upload-artifact@v4
        with:
          name: atlas-production-validation-${{ github.run_id }}
          path: |
            status/production-validation-latest.json
            status/product-readiness-latest.json
          retention-days: 30
      - name: Commit scorecard snapshot
        if: github.event_name != 'pull_request'
        run: |
          bash scripts/commit_status_with_retry.sh \
            'atlas-production-validation' \
            'atlas-validation@users.noreply.github.com' \
            'validation: update current V6 scorecard and product readiness [skip render]' \
            'status/production-validation-latest.json' \
            'status/product-readiness-latest.json'
