name: ATLAS Production Snapshot Schema Probe

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/production-snapshot-schema-probe.yml
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Print compact V6 field sample only
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          p=Path('status/history/production-snapshots.jsonl')
          first_at=last_at=None; snapshots=0; decision_rows=0; sample=None
          with p.open() as f:
              for line in f:
                  line=line.strip()
                  if not line: continue
                  try: snap=json.loads(line)
                  except Exception: continue
                  snapshots+=1
                  at=snap.get('captured_at')
                  first_at=first_at or at; last_at=at
                  for symbol,d in (snap.get('decisions') or {}).items():
                      decision_rows+=1
                      ver=str(d.get('scoring_version') or '')
                      if sample is None and ver.startswith('PROD_SIGNAL_SCORING_V6_BREAKOUT_AWARE') and d.get('score_attribution'):
                          sample=(at,symbol,d)
          print(json.dumps({'snapshots':snapshots,'decision_rows':decision_rows,'first_at':first_at,'last_at':last_at},sort_keys=True))
          if sample:
              at,symbol,d=sample
              indicators=d.get('indicators') or {}
              chosen_ind={k:indicators.get(k) for k in sorted(indicators) if k.lower() in {'close','price','last','last_price','current_price','rsi','ema20','ema50','momentum_24h_pct','momentum_pct','volume'}}
              print('V6_SAMPLE',json.dumps({
                  'captured_at':at,
                  'symbol':symbol,
                  'entry':d.get('entry'),
                  'score':d.get('score'),
                  'signal_qualified':d.get('signal_qualified'),
                  'candidate_direction':d.get('candidate_direction'),
                  'scoring_version':d.get('scoring_version'),
                  'relative_volume':d.get('relative_volume'),
                  'direction_votes':d.get('direction_votes'),
                  'score_attribution':d.get('score_attribution'),
                  'indicator_keys':sorted(indicators.keys()),
                  'selected_indicators':chosen_ind,
              },sort_keys=True))
          PY
