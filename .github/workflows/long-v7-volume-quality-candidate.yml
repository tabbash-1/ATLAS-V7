name: ATLAS LONG V7 Volume Quality Candidate

on:
  workflow_dispatch:
  push:
    paths:
      - 'long_v7_volume_quality_candidate.py'
      - 'tests/test_long_v7_volume_quality_candidate.py'
      - '.github/workflows/long-v7-volume-quality-candidate.yml'
      - 'status/**'

permissions:
  contents: write

jobs:
  candidate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Syntax and regression test
        run: |
          python -m py_compile long_v7_volume_quality_candidate.py tests/test_long_v7_volume_quality_candidate.py
          PYTHONPATH=. python tests/test_long_v7_volume_quality_candidate.py
      - name: Run equal-coverage LONG V7 candidate
        run: python long_v7_volume_quality_candidate.py
      - name: Persist report
        run: |
          if [ -n "$(git status --porcelain -- status/long-v7-volume-quality-candidate.json)" ]; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add status/long-v7-volume-quality-candidate.json
            git commit -m 'data: refresh long v7 volume quality candidate'
            git push
          else
            echo 'No report change to persist.'
          fi
