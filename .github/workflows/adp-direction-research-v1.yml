name: ADP Direction Research V1
on:
  pull_request:
    paths:
      - 'research/adp/**'
      - '.github/workflows/adp-direction-research-v1.yml'
  workflow_dispatch:
jobs:
  adp-direction:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run frozen ADP V1
        run: python research/adp/ohlcv_direction_experiment_v1.py --days 365 | tee /tmp/adp.log
      - name: Extract result
        run: grep '^ADP_RESULT=' /tmp/adp.log | sed 's/^ADP_RESULT=//' > research/adp/ohlcv_direction_experiment_v1_result.json
      - uses: actions/upload-artifact@v4
        with:
          name: adp-direction-v1-result
          path: research/adp/ohlcv_direction_experiment_v1_result.json
