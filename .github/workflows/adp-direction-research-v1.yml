name: ADP Direction Research V1
on:
  pull_request:
    paths:
      - 'research/adp/**'
      - 'tests/test_adp_v8_forward_provenance.py'
      - '.github/workflows/adp-direction-research-v1.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  adp-direction:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install regression test runner
        run: python -m pip install pytest
      - name: Test ADP V8 forward capture integrity
        run: python -m pytest -q tests/test_adp_v8_forward_provenance.py
      - name: Run frozen ADP V1
        shell: bash
        run: |
          set -o pipefail
          python research/adp/ohlcv_direction_experiment_v1.py --days 365 | tee /tmp/adp.log
      - name: Extract result
        shell: bash
        run: |
          grep '^ADP_RESULT=' /tmp/adp.log | sed 's/^ADP_RESULT=//' > research/adp/ohlcv_direction_experiment_v1_result.json
          test -s research/adp/ohlcv_direction_experiment_v1_result.json
      - uses: actions/upload-artifact@v4
        with:
          name: adp-direction-v1-result
          path: research/adp/ohlcv_direction_experiment_v1_result.json
