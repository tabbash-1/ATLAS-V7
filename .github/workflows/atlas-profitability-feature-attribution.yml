name: ATLAS Profitability Feature Attribution
on:
  push:
    branches: [main]
    paths: ['profitability_feature_attribution.py','tests/test_profitability_feature_attribution.py','status/analyst-forward-attribution-latest.json','.github/workflows/atlas-profitability-feature-attribution.yml']
  schedule:
    - cron: '52 * * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  attribution:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: PYTHONPATH=. python3 tests/test_profitability_feature_attribution.py
      - run: python3 profitability_feature_attribution.py
      - run: jq -e '.research_only == true and .automatic_promotion == false and .production_mutation_authorized == false' status/profitability-feature-attribution-latest.json >/dev/null
      - run: |
          git config user.name atlas-feature-attribution
          git config user.email atlas-feature-attribution@users.noreply.github.com
          git add status/profitability-feature-attribution-latest.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "research: update numeric feature attribution [skip ci] [skip render]"
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin main
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Concurrent main update detected; retrying push (${attempt}/5)" >&2
            sleep $((attempt * 2))
          done
          echo "Failed to publish attribution artifact after 5 concurrent-update retries" >&2
          exit 1
