name: ATLAS Historical Evaluation Protocol CI

on:
  push:
    branches: [main]
    paths:
      - 'historical_evaluation_protocol.py'
      - 'historical_source_runtime.py'
      - 'tests/test_historical_evaluation_protocol.py'
      - '.github/workflows/atlas-historical-evaluation-protocol-ci.yml'
  workflow_dispatch:

jobs:
  preregistration-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Syntax and immutable preregistration tests
        run: |
          set -euo pipefail
          python3 -m py_compile historical_evaluation_protocol.py historical_source_runtime.py tests/test_historical_evaluation_protocol.py
          PYTHONPATH=. python3 tests/test_historical_evaluation_protocol.py
      - name: No-outcome preregistration contract
        run: |
          set -euo pipefail
          grep -q "primary_horizon_hours.*12" historical_evaluation_protocol.py
          grep -q "NO_GRID_SEARCH_NO_BEST_HORIZON_NO_POST_OUTCOME_RULE_CHANGES" historical_evaluation_protocol.py
          grep -q "outcomes_read_before_registration.*False" historical_evaluation_protocol.py
          grep -q "RETROSPECTIVE_EVIDENCE_CANNOT_PROMOTE_PRODUCTION_OR_LIVE_EXECUTION" historical_evaluation_protocol.py
          grep -q "HISTORICAL_EVALUATION_PROTOCOL_STATE" historical_source_runtime.py
          ! grep -q "forward_return_pct" historical_evaluation_protocol.py
          ! grep -q "trade_path_settlement" historical_evaluation_protocol.py
          ! grep -q "canonical_outcome" historical_evaluation_protocol.py
