name: ATLAS $10K Paper Portfolio

on:
  push:
    branches: [main]
    paths:
      - 'canonical_decision_contract.py'
      - 'paper_portfolio_10k.py'
      - 'paper_portfolio_10k_final.py'
      - 'final_trade_ready_guard.py'
      - 'offline_production_path_settlement.py'
      - 'status/paper-portfolio-10k-manifest.json'
      - 'tests/test_paper_portfolio_10k.py'
      - 'tests/test_final_trade_ready_guard.py'
      - '.github/workflows/atlas-paper-portfolio-10k.yml'
      - 'status/history/production-snapshots.jsonl'
  schedule:
    - cron: '12,32,52 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: atlas-paper-portfolio-10k
  cancel-in-progress: false

jobs:
  portfolio:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Contract tests
        run: |
          set -euo pipefail
          PYTHONPATH=. python tests/test_paper_portfolio_10k.py
          PYTHONPATH=. python tests/test_final_trade_ready_guard.py
          python -m py_compile canonical_decision_contract.py paper_portfolio_10k.py paper_portfolio_10k_final.py final_trade_ready_guard.py cloud_web_only_final.py
      - name: Run prospective paper portfolio
        run: |
          set -euo pipefail
          python paper_portfolio_10k_final.py | tee /tmp/atlas-paper-10k.log
          jq -e '.schema == "ATLAS_PAPER_PORTFOLIO_10K_V3_CANONICAL_TRUTH"' status/paper-portfolio-10k-latest.json >/dev/null
          jq -e '.decision_source_of_truth == "FINAL_TRADE_GATE"' status/paper-portfolio-10k-latest.json >/dev/null
          jq -e '.evaluation_horizons == ["4h","8h","12h"]' status/paper-portfolio-10k-latest.json >/dev/null
          jq -e '.paper_only == true and .live_execution == false and .can_override_production == false and .production_threshold_unchanged == 68' status/paper-portfolio-10k-latest.json >/dev/null
          jq -e '.portfolio.starting_equity_usd == 10000 and .portfolio.equity_usd >= 0' status/paper-portfolio-10k-latest.json >/dev/null
          jq -e '.append_only_verified == true and .decision_source_of_truth == "FINAL_TRADE_GATE" and .paper_only == true and .live_execution == false' status/paper-portfolio-10k-integrity.json >/dev/null
      - name: Verify no retrospective backfill
        run: |
          set -euo pipefail
          START=$(jq -r '.cohort_start_at' status/paper-portfolio-10k-manifest.json)
          if [ -s status/history/paper-portfolio-10k-cohort.jsonl ]; then
            python - "$START" <<'PY'
          import json,sys,datetime,pathlib
          start=datetime.datetime.fromisoformat(sys.argv[1].replace('Z','+00:00'))
          for line in pathlib.Path('status/history/paper-portfolio-10k-cohort.jsonl').read_text().splitlines():
              if not line.strip(): continue
              r=json.loads(line); t=datetime.datetime.fromisoformat(r['captured_at'].replace('Z','+00:00'))
              assert t>=start, (t,start)
              assert r['decision_action']=='TRADE_READY'
              assert r['decision_source']=='FINAL_TRADE_GATE'
              assert r.get('decision_id')
              assert r['evaluation_horizons']==['4h','8h','12h']
              assert r['outcome_known_at_entry'] is False
              assert r['paper_only'] is True and r['live_execution'] is False
          print('prospective canonical cohort contract: ok')
          PY
          fi
      - name: Commit paper evidence
        run: |
          set -euo pipefail
          git config user.name "atlas-paper-portfolio"
          git config user.email "atlas-paper@users.noreply.github.com"
          git add status/history/paper-portfolio-10k-cohort.jsonl status/paper-portfolio-10k-latest.json status/paper-portfolio-10k-integrity.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "paper: update prospective 10k portfolio [skip ci]"
          git pull --rebase origin main
          git push
