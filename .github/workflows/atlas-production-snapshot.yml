name: ATLAS Production Snapshot

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/atlas-production-snapshot.yml'
      - 'production_signal_scoring.py'
      - 'production_decision_api.py'
      - 'cloud_start.py'
      - 'atlas_runtime_server.py'
      - 'atlas_research_runtime_server.py'
  schedule:
    - cron: '7 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: atlas-production-snapshot
  cancel-in-progress: true

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Collect Production state
        shell: bash
        env:
          BASE_URL: https://atlas-v7.onrender.com
        run: |
          set -u
          mkdir -p status/raw

          fetch_json() {
            name="$1"
            path="$2"
            url="${BASE_URL}${path}"
            out="status/raw/${name}.json"
            code="$(curl -L --retry 3 --retry-all-errors --connect-timeout 20 --max-time 90 -sS -w '%{http_code}' -o "${out}.tmp" "$url" || true)"
            if [[ "$code" =~ ^2 ]]; then
              if jq -e . "${out}.tmp" >/dev/null 2>&1; then
                mv "${out}.tmp" "$out"
                return 0
              fi
            fi
            python3 - "$url" "$code" "${out}.tmp" "$out" <<'PY'
          import json, pathlib, sys
          url, code, tmp, out = sys.argv[1:]
          body = ''
          p = pathlib.Path(tmp)
          if p.exists():
              body = p.read_text(errors='replace')[:2000]
              p.unlink(missing_ok=True)
          pathlib.Path(out).write_text(json.dumps({
              'ok': False,
              'url': url,
              'http_code': code,
              'error': 'fetch_failed_or_non_json',
              'body_preview': body,
          }, indent=2))
          PY
            return 1
          }

          fetch_json runtime /api/runtime/status || true
          fetch_json readiness /api/production/readiness || true
          fetch_json outcomes /api/outcomes/summary || true
          fetch_json geometry /api/outcomes/geometry-status || true

          for s in BTCUSDT ETHUSDT SOLUSDT XRPUSDT BNBUSDT DOGEUSDT ZECUSDT; do
            fetch_json "decision_${s}" "/api/decision/current?symbol=${s}" || true
          done

          python3 - <<'PY'
          import json, pathlib, datetime

          root = pathlib.Path('status/raw')
          def load(name):
              p = root / f'{name}.json'
              if not p.exists(): return {'ok':False,'error':'missing_snapshot'}
              try: return json.loads(p.read_text())
              except Exception as e: return {'ok':False,'error':f'invalid_json:{e}'}

          symbols=['BTCUSDT','ETHUSDT','SOLUSDT','XRPUSDT','BNBUSDT','DOGEUSDT','ZECUSDT']
          decisions={s:load('decision_'+s) for s in symbols}
          qualified=[]
          waits=[]
          failures=[]
          for s,d in decisions.items():
              if not d.get('ok'):
                  failures.append({'symbol':s,'error':d.get('error'),'http_code':d.get('http_code')})
              elif d.get('signal_qualified'):
                  qualified.append({
                      'symbol':s,'decision':d.get('decision'),'score':d.get('score'),
                      'threshold':d.get('signal_threshold'),'rr':d.get('risk_reward'),
                      'playbook':d.get('playbook'),'generated_at':d.get('generated_at')
                  })
              else:
                  waits.append({
                      'symbol':s,'candidate':d.get('candidate_direction'),'score':d.get('score'),
                      'threshold':d.get('signal_threshold'),'reason':d.get('wait_reason'),
                      'score_gap_to_signal':d.get('score_gap_to_signal'),
                      'score_attribution':d.get('score_attribution')
                  })

          runtime=load('runtime')
          readiness=load('readiness')
          outcomes=load('outcomes')
          geometry=load('geometry')
          now=datetime.datetime.now(datetime.timezone.utc).isoformat()
          summary={
              'schema':'ATLAS_PRODUCTION_SNAPSHOT_V1',
              'captured_at':now,
              'source':'https://atlas-v7.onrender.com',
              'runtime':runtime,
              'readiness':readiness,
              'outcomes':outcomes,
              'geometry_status':geometry,
              'decisions':decisions,
              'decision_summary':{
                  'supported_assets':symbols,
                  'qualified_count':len(qualified),
                  'qualified':qualified,
                  'wait_count':len(waits),
                  'waits':waits,
                  'failed_count':len(failures),
                  'failures':failures,
              }
          }
          pathlib.Path('status/atlas-production-latest.json').write_text(json.dumps(summary,indent=2,sort_keys=True))
          PY

      - name: Commit latest snapshot
        shell: bash
        run: |
          git config user.name "atlas-production-monitor"
          git config user.email "atlas-monitor@users.noreply.github.com"
          git add status/atlas-production-latest.json status/raw/*.json
          if git diff --cached --quiet; then
            echo "No snapshot changes"
            exit 0
          fi
          git commit -m "chore: update ATLAS production snapshot [skip ci]"
          git push
