name: ATLAS Smart Existing Results Analysis
on:
  push:
    branches: [main]
    paths:
      - 'smart_existing_results_analysis.py'
      - 'status/wait-outcomes.json'
      - '.github/workflows/smart-existing-results-analysis.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Analyze existing independent outcomes
        run: python smart_existing_results_analysis.py
      - name: Guard against accidental Production mutation
        run: |
          python - <<'PY'
          import json
          p=json.load(open('status/smart-existing-results-analysis.json'))
          g=p['guardrails']
          assert g['research_only'] is True
          assert g['production_threshold_changed'] is False
          assert g['production_score_adjustment']==0
          assert g['auto_promotion_enabled'] is False
          print('guardrails: ok')
          PY
      - name: Commit refreshed research reports
        run: |
          if [ -z "$(git status --porcelain -- status/smart-existing-results-analysis.json status/v6-attribution-summary.json)" ]; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add status/smart-existing-results-analysis.json status/v6-attribution-summary.json
          git commit -m 'data: refresh smart existing results analysis'
          git push
