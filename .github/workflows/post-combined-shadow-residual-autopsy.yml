name: ATLAS Post Combined Shadow Residual Autopsy

on:
  workflow_dispatch:
  push:
    paths:
      - 'post_combined_shadow_residual_autopsy.py'
      - 'tests/test_post_combined_shadow_residual_autopsy.py'
      - '.github/workflows/post-combined-shadow-residual-autopsy.yml'
      - 'status/**'

permissions:
  contents: write

jobs:
  autopsy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Syntax and regression test
        run: |
          python -m py_compile post_combined_shadow_residual_autopsy.py tests/test_post_combined_shadow_residual_autopsy.py
          PYTHONPATH=. python tests/test_post_combined_shadow_residual_autopsy.py
      - name: Run combined residual autopsy
        run: python post_combined_shadow_residual_autopsy.py
      - name: Persist report
        run: |
          if [ -n "$(git status --porcelain -- status/post-combined-shadow-residual-autopsy.json)" ]; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add status/post-combined-shadow-residual-autopsy.json
            git commit -m 'data: refresh post combined shadow residual autopsy'
            git push
          else
            echo 'No report change to persist.'
          fi
