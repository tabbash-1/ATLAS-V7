name: ATLAS Prospective Microstructure Snapshot

on:
  push:
    branches: [main]
    paths:
      - 'prospective_microstructure_cohort.py'
      - 'prospective_microstructure_evaluator.py'
      - 'prospective_microstructure_validation_runtime.py'
      - 'forward_microstructure_freeze_runtime.py'
      - 'cloud_forward_diagnostics_runtime.py'
      - 'cloud_web_only.py'
      - '.github/workflows/atlas-prospective-microstructure-snapshot.yml'
  schedule:
    - cron: '53 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: atlas-prospective-microstructure-snapshot
  cancel-in-progress: true

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BASE_URL: https://atlas-v7.onrender.com
    steps:
      - name: Verify deployed prospective validation cache
        run: |
          set -euo pipefail
          tmp="$(mktemp)"
          ok=0
          for attempt in $(seq 1 24); do
            code="$(curl -L --connect-timeout 20 --max-time 60 -sS -w '%{http_code}' -o "$tmp" "${BASE_URL}/api/research/prospective-microstructure-validation" || true)"
            if [[ "$code" =~ ^2 ]] && jq -e . "$tmp" >/dev/null 2>&1 && \
               jq -e '.version == "ATLAS_PROSPECTIVE_MICROSTRUCTURE_VALIDATION_RUNTIME_V1" and .cached_only == true and .background_refresh_triggered == false and .archive_read_triggered_by_request == false and .outcome_read_triggered_by_request == false and .research_only == true and .live_execution == false and .can_override_production == false and .served_from == "COMMITTED_GITHUB_ACTIONS_SNAPSHOT" and .evaluation.forward_proof_cohort == true and .evaluation.historical_rows_allowed == false' "$tmp" >/dev/null 2>&1; then
              ok=1
              break
            fi
            echo "Waiting for prospective cache endpoint (attempt ${attempt}/24, HTTP ${code:-none})"
            sleep 15
          done
          if [[ "$ok" != "1" ]]; then
            echo "Prospective cached endpoint unavailable." >&2
            cat "$tmp" >&2 || true
            exit 1
          fi
          jq '{version,snapshot_captured_at,snapshot_age_hours,snapshot_stale,current_for_research,served_from,evaluation_status:.evaluation.status}' "$tmp"
          echo "MONITOR_ONLY: this workflow never rewrites snapshot timestamps or research results."
