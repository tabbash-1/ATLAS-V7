name: ATLAS Historical Evaluation Snapshot

on:
  push:
    branches: [main]
    paths:
      - 'historical_evaluation_runtime.py'
      - 'historical_microstructure_evaluator.py'
      - 'historical_evaluation_protocol.py'
      - 'historical_replay_registry.py'
      - 'historical_source_runtime.py'
      - 'cloud_web_only.py'
      - '.github/workflows/atlas-historical-evaluation-snapshot.yml'
  schedule:
    - cron: '37 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: atlas-historical-evaluation-snapshot
  cancel-in-progress: true

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BASE_URL: https://atlas-v7.onrender.com
    steps:
      - name: Verify deployed cached historical evaluation
        run: |
          set -euo pipefail
          tmp="$(mktemp)"
          ok=0
          for attempt in $(seq 1 24); do
            code="$(curl -L --connect-timeout 20 --max-time 60 -sS -w '%{http_code}' -o "$tmp" "${BASE_URL}/api/research/historical-evaluation" || true)"
            if [[ "$code" =~ ^2 ]] && jq -e . "$tmp" >/dev/null 2>&1 && \
               jq -e '.version == "ATLAS_HISTORICAL_EVALUATION_RUNTIME_V1_BACKGROUND_ONLY" and .cached_only == true and .background_refresh_triggered == false and .research_only == true and .live_execution == false and .can_override_production == false and .outcome_read_triggered_by_request == false and .served_from == "COMMITTED_GITHUB_ACTIONS_SNAPSHOT" and (.evaluation | type) == "object"' "$tmp" >/dev/null 2>&1; then
              ok=1
              break
            fi
            echo "Waiting for cached historical endpoint (attempt ${attempt}/24, HTTP ${code:-none})"
            sleep 15
          done
          if [[ "$ok" != "1" ]]; then
            echo "Historical cached endpoint unavailable." >&2
            cat "$tmp" >&2 || true
            exit 1
          fi
          jq '{version,snapshot_captured_at,snapshot_age_hours,snapshot_stale,current_for_research,served_from}' "$tmp"
          echo "MONITOR_ONLY: this workflow never rewrites snapshot timestamps or research results."
