name: ATLAS Production Reliability

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  reliability:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Syntax
        run: python -m py_compile production_reliability.py production_signal_scoring.py production_decision_api.py consensus_tiebreak_shadow.py consensus_tiebreak_shadow_tracker.py tests/test_production_reliability.py tests/test_partial_hour_volume_progress.py tests/test_consensus_tiebreak_shadow.py tests/test_consensus_tiebreak_shadow_tracker.py cloud_start.py cloud_web_only.py
      - name: Reliability regressions
        run: PYTHONPATH=. python tests/test_production_reliability.py
      - name: Partial-hour volume regressions
        run: PYTHONPATH=. python tests/test_partial_hour_volume_progress.py
      - name: Consensus tie-break shadow regressions
        run: |
          PYTHONPATH=. python tests/test_consensus_tiebreak_shadow.py
          PYTHONPATH=. python tests/test_consensus_tiebreak_shadow_tracker.py
      - name: Preserve Production safety contract
        run: |
          grep -q "ATLAS_CLOUD_FORWARD_MIN_SCORE','68" cloud_web_only.py
          grep -q 'production_unchanged' production_reliability.py
          grep -q 'requires_requalification' production_reliability.py
          grep -q 'futures_evidence_validated.*False' production_reliability.py
          grep -q 'cloud_web_only.py' cloud_start.py
          python - <<'PY'
          import ast
          from pathlib import Path

          tree = ast.parse(Path('cloud_web_only.py').read_text())
          bad = []
          for node in ast.walk(tree):
              if isinstance(node, ast.Import):
                  bad.extend(a.name for a in node.names if a.name == 'production_reliability')
              elif isinstance(node, ast.ImportFrom) and node.module == 'production_reliability':
                  bad.append(node.module)
          assert not bad, f'web-only runtime imports production_reliability: {bad}'
          print('web-only reliability import guard: ok')
          PY
          grep -q 'PARTIAL_VOLUME_TIME_FIX_V1' production_signal_scoring.py
          grep -q "r.get('open_time') or r.get('time')" production_signal_scoring.py
          grep -q 'PACED_VOLUME_V1' production_decision_api.py
          grep -q 'from production_signal_scoring import candle_progress, paced_relative_volume' production_decision_api.py
          grep -q 'rv=paced_relative_volume(raw_rv,progress)' production_decision_api.py
          grep -q "'volume_pacing':" production_decision_api.py
          grep -q 'CONSENSUS_TIEBREAK_SHADOW_V1_MOMENTUM_1H_3H' consensus_tiebreak_shadow.py
          grep -q 'can_override_production.*False' consensus_tiebreak_shadow.py
          grep -q 'can_execute.*False' consensus_tiebreak_shadow.py
          grep -q 'production_threshold_changed.*False' consensus_tiebreak_shadow.py
          grep -q 'production_changed.*False' consensus_tiebreak_shadow_tracker.py
          grep -q 'auto_promotion.*False' consensus_tiebreak_shadow_tracker.py