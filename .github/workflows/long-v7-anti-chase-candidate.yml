name: ATLAS LONG V7 Anti-Chase Candidate

on:
  workflow_dispatch:
  push:
    paths:
      - 'long_v7_anti_chase_candidate.py'
      - 'tests/test_long_v7_anti_chase_candidate.py'
      - '.github/workflows/long-v7-anti-chase-candidate.yml'
      - 'status/history/production-snapshots.jsonl'

permissions:
  contents: write

jobs:
  candidate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Syntax and regression test
        run: |
          python -m py_compile long_v7_anti_chase_candidate.py tests/test_long_v7_anti_chase_candidate.py
          PYTHONPATH=. python tests/test_long_v7_anti_chase_candidate.py
      - name: Run anti-chase candidate
        run: python long_v7_anti_chase_candidate.py
      - name: Persist report
        run: |
          if [ -n "$(git status --porcelain -- status/long-v7-anti-chase-candidate.json)" ]; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add status/long-v7-anti-chase-candidate.json
            git commit -m 'data: refresh long v7 anti-chase candidate'
            git push
          fi
