name: ATLAS Prospective Fourth Vote Evaluation

on:
  push:
    branches: [main]
    paths:
      - prospective_fourth_vote_evaluator.py
      - fourth_vote_demotion_shadow.py
      - qualified_false_confidence_audit.py
      - tests/test_prospective_fourth_vote_evaluator.py
      - .github/workflows/prospective-fourth-vote-evaluation.yml
      - status/history/production-snapshots.jsonl
  workflow_dispatch:

permissions:
  contents: write

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Syntax and regression test
        run: |
          python -m py_compile prospective_fourth_vote_evaluator.py tests/test_prospective_fourth_vote_evaluator.py
          PYTHONPATH=. python tests/test_prospective_fourth_vote_evaluator.py
      - name: Evaluate post-freeze cohort only
        run: python prospective_fourth_vote_evaluator.py
      - name: Persist report
        run: |
          if [ -n "$(git status --porcelain -- status/prospective-fourth-vote-evaluation.json)" ]; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add status/prospective-fourth-vote-evaluation.json
            git commit -m 'data: refresh prospective fourth vote evaluation'
            git push
          else
            echo 'No report change to persist.'
          fi
