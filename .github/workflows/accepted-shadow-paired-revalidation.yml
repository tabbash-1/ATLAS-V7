name: ATLAS Accepted Shadow Paired Revalidation

on:
  workflow_dispatch:
  push:
    paths:
      - 'counterfactual_episode_evaluation.py'
      - 'accepted_shadow_paired_revalidation.py'
      - 'tests/test_accepted_shadow_paired_revalidation.py'
      - '.github/workflows/accepted-shadow-paired-revalidation.yml'
      - 'status/**'

permissions:
  contents: write

jobs:
  revalidate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Syntax and regression test
        run: |
          python -m py_compile counterfactual_episode_evaluation.py accepted_shadow_paired_revalidation.py tests/test_accepted_shadow_paired_revalidation.py
          PYTHONPATH=. python tests/test_accepted_shadow_paired_revalidation.py
      - name: Run paired revalidation
        run: python accepted_shadow_paired_revalidation.py
      - name: Persist report
        run: |
          if [ -n "$(git status --porcelain -- status/accepted-shadow-paired-revalidation.json)" ]; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add status/accepted-shadow-paired-revalidation.json
            git commit -m 'data: refresh accepted shadow paired revalidation'
            git push
          else
            echo 'No report change to persist.'
          fi
