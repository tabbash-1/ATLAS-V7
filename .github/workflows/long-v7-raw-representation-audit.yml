name: ATLAS LONG V7 Raw Representation Audit

on:
  workflow_dispatch:
  push:
    paths:
      - 'long_v7_raw_representation_audit.py'
      - 'tests/test_long_v7_raw_representation_audit.py'
      - '.github/workflows/long-v7-raw-representation-audit.yml'
      - 'status/history/production-snapshots.jsonl'

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Syntax and regression test
        run: |
          python -m py_compile long_v7_raw_representation_audit.py tests/test_long_v7_raw_representation_audit.py
          PYTHONPATH=. python tests/test_long_v7_raw_representation_audit.py
      - name: Run raw representation audit
        run: python long_v7_raw_representation_audit.py
      - name: Persist report
        run: |
          if [ -n "$(git status --porcelain -- status/long-v7-raw-representation-audit.json)" ]; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add status/long-v7-raw-representation-audit.json
            git commit -m 'data: refresh long v7 raw representation audit'
            git push
          fi
