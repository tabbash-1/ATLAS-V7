name: ATLAS Render Memory-Safe Smoke

on:
  push:
    branches: [main]
    paths:
      - 'render.yaml'
      - 'Dockerfile'
      - 'cloud_start_web.py'
      - 'render_boot_patch.py'
      - 'atlas_runtime_server.py'
      - 'collector_server.py'
      - '.github/workflows/render-memory-safe-smoke.yml'
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Wait for Render deploy
        run: sleep 100
      - name: Verify memory-safe web runtime
        shell: bash
        run: |
          set -euo pipefail
          base='https://atlas-v7.onrender.com'
          curl -fsSL --retry 8 --retry-delay 10 --retry-all-errors --connect-timeout 10 --max-time 35 "$base/health" -o /tmp/health.json
          curl -fsSL --retry 8 --retry-delay 10 --retry-all-errors --connect-timeout 10 --max-time 35 "$base/api/runtime/status" -o /tmp/runtime.json
          curl -fsSL --retry 8 --retry-delay 10 --retry-all-errors --connect-timeout 10 --max-time 35 "$base/api/cloud-forward/status" -o /tmp/cloud.json
          python3 - <<'PY'
          import json
          h=json.load(open('/tmp/health.json'))
          r=json.load(open('/tmp/runtime.json'))
          c=json.load(open('/tmp/cloud.json'))
          assert h.get('status') == 'ok', h
          # Render intentionally runs the memory-safe web-only process. Heavy
          # research workers are isolated to scheduled GitHub workflows and must
          # not be required by this smoke test.
          workers=r.get('workers') or {}
          assert isinstance(workers, dict), workers
          assert r.get('web_only') is True or r.get('memory_safe') is True or workers == {}, r
          assert c.get('live_execution') is False, c
          print('BOOT', r.get('boot_id'))
          print('UPTIME', r.get('uptime_seconds'))
          print('WORKERS', json.dumps(workers, sort_keys=True))
          print('CLOUD', json.dumps({k:c.get(k) for k in ('enabled','running','cycles','stored','errors','last_success_at','last_error','research_only','live_execution')}, sort_keys=True))
          PY
      - name: Verify research-only HYPE is excluded from Production
        shell: bash
        run: |
          set -euo pipefail
          base='https://atlas-v7.onrender.com'
          code=$(curl -sS -o /tmp/hype.json -w '%{http_code}' --retry 5 --retry-delay 10 --retry-all-errors --connect-timeout 10 --max-time 45 "$base/api/decision/current?symbol=HYPEUSDT")
          python3 - "$code" <<'PY'
          import json,sys
          x=json.load(open('/tmp/hype.json'))
          assert sys.argv[1] == '400', (sys.argv[1],x)
          assert x.get('ok') is False, x
          assert x.get('error') == 'unsupported symbol', x
          print('HYPE correctly excluded from Production')
          PY
