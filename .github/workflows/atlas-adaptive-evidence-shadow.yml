name: ATLAS Adaptive Evidence Shadow
on:
  pull_request:
    paths:
      - 'adaptive_evidence_engine.py'
      - 'tests/test_adaptive_evidence_engine.py'
      - '.github/workflows/atlas-adaptive-evidence-shadow.yml'
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Syntax
        run: python3 -m py_compile adaptive_evidence_engine.py tests/test_adaptive_evidence_engine.py
      - name: Contract tests
        run: |
          python3 - <<'PY'
          import tests.test_adaptive_evidence_engine as t
          for name in sorted(n for n in dir(t) if n.startswith('test_')):
              getattr(t, name)()
              print('PASS', name)
          PY
