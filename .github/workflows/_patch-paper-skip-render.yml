name: Patch paper snapshot skip-render

on:
  push:
    branches: [fix/skip-render-on-data-snapshots]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/skip-render-on-data-snapshots
      - name: Add Render skip directive to paper evidence snapshot commits
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/atlas-paper-analyst-forward.yml')
          s=p.read_text()
          old=s
          s=s.replace("chore: update canonical analyst forward evidence [skip ci]", "chore: update canonical analyst forward evidence [skip ci] [skip render]")
          s=s.replace("chore: update isolated threshold-64 net evidence [skip ci]", "chore: update isolated threshold-64 net evidence [skip ci] [skip render]")
          assert s != old
          assert s.count('[skip render]') >= 2
          p.write_text(s)
          PY
          git config user.name atlas-maintenance-bot
          git config user.email atlas-maintenance-bot@users.noreply.github.com
          git add .github/workflows/atlas-paper-analyst-forward.yml
          git commit -m 'fix: skip Render for analyst evidence snapshot commits'
          git push origin HEAD:fix/skip-render-on-data-snapshots
