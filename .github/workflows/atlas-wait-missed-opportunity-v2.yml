name: ATLAS WAIT Missed Opportunity V2

on:
  pull_request:
    paths:
      - 'wait_missed_opportunity_settlement.py'
      - 'test_wait_missed_opportunity_settlement.py'
      - '.github/workflows/atlas-wait-missed-opportunity-v2.yml'
  push:
    branches: [main]
    paths:
      - 'wait_missed_opportunity_settlement.py'
      - 'test_wait_missed_opportunity_settlement.py'
      - '.github/workflows/atlas-wait-missed-opportunity-v2.yml'
      - 'status/history/production-snapshots.jsonl'
  schedule:
    - cron: '19 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: atlas-wait-missed-opportunity-v2
  cancel-in-progress: true

jobs:
  settle:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || 'main' }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Regression contract
        run: |
          python -m pip install --upgrade pip pytest
          pytest -q test_wait_missed_opportunity_settlement.py
          python -m py_compile wait_missed_opportunity_settlement.py
      - name: Settle canonical WAIT outcomes
        run: |
          python wait_missed_opportunity_settlement.py
          python - <<'PY'
          import json
          p=json.load(open('status/wait-missed-opportunity-latest.json'))
          assert p['schema']=='ATLAS_WAIT_MISSED_OPPORTUNITY_V3_EXECUTABILITY_AWARE'
          assert p['decision_source_of_truth']=='FINAL_TRADE_GATE'
          assert p['evaluation_horizons_h']==[1,2,4,8,12]
          assert p['classification_is_research_only'] is True
          assert p['production_threshold_unchanged']==68
          assert p['can_change_threshold'] is False
          assert p['can_override_production'] is False
          assert p['live_execution'] is False
          PY
      - name: Publish research-only report
        if: github.event_name != 'pull_request'
        run: |
          git config user.name 'atlas-wait-observatory'
          git config user.email 'atlas-wait-observatory@users.noreply.github.com'
          git add status/wait-missed-opportunity-latest.json status/history/wait-missed-opportunity.jsonl
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'chore: update WAIT missed-opportunity evidence [skip ci] [skip render]'
          git pull --rebase origin main
          git push origin HEAD:main
