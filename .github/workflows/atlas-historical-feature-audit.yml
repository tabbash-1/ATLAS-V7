name: ATLAS Historical Feature Audit

on:
  push:
    branches: [main]
    paths:
      - 'historical_feature_audit.py'
      - '.github/workflows/atlas-historical-feature-audit.yml'
      - 'status/history/production-snapshots.jsonl'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: atlas-historical-feature-audit
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Run no-lookahead historical feature audit
        run: |
          set -euo pipefail
          python3 -m py_compile historical_feature_audit.py
          python3 historical_feature_audit.py
          jq -e '.research_only == true and .outcomes_read == false and .backfill_performed == false and .snapshot_count > 0 and .decision_rows > 0' status/historical-feature-audit.json >/dev/null
      - name: Commit audit report
        run: |
          git config user.name "atlas-historical-audit"
          git config user.email "atlas-historical-audit@users.noreply.github.com"
          git add status/historical-feature-audit.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore: update historical feature audit [skip ci]"
          git pull --rebase origin main
          git push
