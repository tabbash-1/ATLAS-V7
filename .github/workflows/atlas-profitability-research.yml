name: ATLAS Profitability Research

on:
  push:
    branches: [main]
    paths:
      - 'profitability_research_engine.py'
      - 'analyst_forward_attribution.py'
      - 'status/history/analyst-output-snapshots.jsonl'
      - 'status/history/paper-portfolio-10k-analyst-cohort.jsonl'
      - 'status/paper-portfolio-10k-analyst-latest.json'
      - 'status/analyst-forward-attribution-latest.json'
      - 'tests/test_analyst_forward_attribution.py'
      - 'tests/test_profitability_research_engine.py'
      - '.github/workflows/atlas-profitability-research.yml'
  schedule:
    - cron: '47 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: atlas-profitability-research-${{ github.ref }}
  cancel-in-progress: true

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Attribution safety regression
        run: PYTHONPATH=. pytest -q tests/test_analyst_forward_attribution.py
      - name: Rebuild fresh canonical forward attribution
        run: python3 analyst_forward_attribution.py
      - name: Profitability safety regression
        run: PYTHONPATH=. python3 tests/test_profitability_research_engine.py
      - name: Build profitability research evidence
        run: python3 profitability_research_engine.py
      - name: Verify synchronized research-only boundary
        run: |
          python3 - <<'PY'
          import json, pathlib
          a=json.loads(pathlib.Path('status/analyst-forward-attribution-latest.json').read_text())
          p=json.loads(pathlib.Path('status/profitability-research-latest.json').read_text())
          assert a['product_horizon']=='4-12H'
          assert a['analysis_only'] is True and a['live_execution'] is False
          assert a['can_override_production'] is False and a['can_change_score'] is False and a['can_change_threshold'] is False
          assert p['schema']=='ATLAS_PROFITABILITY_RESEARCH_V2'
          assert p['product_horizon']=='4-12H'
          assert p['baseline']['n']==a['matured_12h_metrics']['n']
          assert p['chronological_split']['holdout_used_for_candidate_selection'] is False
          assert p['validation_contract']['chronological_holdout_required'] is True
          assert p['validation_contract']['walk_forward_required'] is True
          assert p['validation_contract']['costs_required_before_promotion'] is True
          assert p['validation_contract']['multiple_testing_control_required'] is True
          assert p['validation_contract']['automatic_promotion'] is False
          assert p['stage_status']['7_production_promotion']=='BLOCKED_PENDING_PROSPECTIVE_VALIDATION'
          assert p['safety']['research_only'] is True and p['safety']['paper_only'] is True
          assert p['safety']['live_execution'] is False and p['safety']['can_override_production'] is False
          print({'fresh_matured_n':a['matured_12h_metrics']['n'],'candidate_count':p['candidate_count'],'holdout_eligible_count':p['holdout_eligible_count']})
          PY
      - name: Commit synchronized evidence reports
        run: |
          git config user.name "atlas-profitability-research"
          git config user.email "atlas-profitability-research@users.noreply.github.com"
          git add status/analyst-forward-attribution-latest.json status/profitability-research-latest.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "research: sync forward attribution and profitability evidence [skip ci] [skip render]"
          git pull --rebase origin main
          git push
