name: ATLAS Profitability Research

on:
  push:
    branches: [main]
    paths:
      - 'profitability_research_engine.py'
      - 'analyst_forward_attribution.py'
      - 'status/analyst-forward-attribution-latest.json'
      - 'tests/test_profitability_research_engine.py'
      - '.github/workflows/atlas-profitability-research.yml'
  schedule:
    - cron: '47 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: atlas-profitability-research-${{ github.ref }}
  cancel-in-progress: true

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Safety regression
        run: PYTHONPATH=. python3 tests/test_profitability_research_engine.py
      - name: Build profitability research evidence
        run: python3 profitability_research_engine.py
      - name: Verify research-only boundary
        run: |
          jq -e '.schema == "ATLAS_PROFITABILITY_RESEARCH_V1" and .product_horizon == "4-12H" and .validation_contract.chronological_holdout_required == true and .validation_contract.walk_forward_required == true and .validation_contract.costs_required_before_promotion == true and .validation_contract.automatic_promotion == false and .safety.research_only == true and .safety.paper_only == true and .safety.live_execution == false and .safety.can_override_production == false' status/profitability-research-latest.json >/dev/null
      - name: Commit evidence report
        run: |
          git config user.name "atlas-profitability-research"
          git config user.email "atlas-profitability-research@users.noreply.github.com"
          git add status/profitability-research-latest.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "research: update profitability edge candidates [skip ci] [skip render]"
          git pull --rebase origin main
          git push
