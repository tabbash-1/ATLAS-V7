name: ATLAS Continuation Scoring

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Syntax
        run: python -m py_compile production_continuation_scoring.py decision_engine_v7.py tests/test_production_continuation_scoring.py cloud_start.py
      - name: Continuation regression tests
        run: PYTHONPATH=. python tests/test_production_continuation_scoring.py
      - name: Safety invariants
        run: |
          grep -q 'ATLAS_CLOUD_FORWARD_MIN_SCORE.*68' cloud_start.py
          grep -q '_install_production_continuation_scoring' cloud_start.py
          grep -q 'threshold_unchanged.*True' production_continuation_scoring.py
          grep -q 'min_risk_reward.*1.0' decision_engine_v7.py
          grep -q 'live_execution.*False' collector_server.py
