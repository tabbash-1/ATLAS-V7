name: ATLAS Challenger Shadow

on:
  pull_request:
    branches: [main]
    paths:
      - 'atlas_challenger_shadow.py'
      - 'test_atlas_challenger_shadow.py'
      - '.github/workflows/atlas-challenger-shadow.yml'
  push:
    branches: [main]
    paths:
      - 'status/wait-missed-opportunity-latest.json'
      - 'atlas_challenger_shadow.py'
      - '.github/workflows/atlas-challenger-shadow.yml'
  schedule:
    - cron: '17 */4 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-and-measure:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Syntax
        run: python -m py_compile atlas_challenger_shadow.py test_atlas_challenger_shadow.py
      - name: Shadow regression
        run: |
          PYTHONPATH=. python - <<'PY'
          import test_atlas_challenger_shadow as t
          tests=[getattr(t,n) for n in dir(t) if n.startswith('test_') and callable(getattr(t,n))]
          if not tests:
              raise SystemExit('no Challenger Shadow tests discovered')
          for fn in tests:
              fn()
          print(f'Challenger Shadow tests: {len(tests)} ok')
          PY
      - name: Production isolation guard
        run: |
          grep -q "production_impact':'NONE" atlas_challenger_shadow.py
          grep -q "can_override_production':False" atlas_challenger_shadow.py
          grep -q "can_change_threshold':False" atlas_challenger_shadow.py
          grep -q "live_execution':False" atlas_challenger_shadow.py
          grep -q "promotion_decision':'NOT_AUTHORIZED" atlas_challenger_shadow.py
      - name: Build current forward-evidence report
        run: python atlas_challenger_shadow.py
      - name: Verify paired-evidence report contract
        run: |
          python - <<'PY'
          import json
          p='status/challenger-shadow-latest.json'
          d=json.load(open(p))
          assert d['schema']=='ATLAS_CHALLENGER_SHADOW_V2_PAIRED_EVIDENCE'
          assert d['research_only'] is True
          assert d['can_override_production'] is False
          assert d['can_change_threshold'] is False
          assert d['live_execution'] is False
          assert d['promotion_decision']=='NOT_AUTHORIZED'
          assert d['production_impact']=='NONE'
          pairs=d.get('paired_evidence', d.get('records', []))
          for row in pairs:
              assert row.get('canonical_action') == 'WAIT'
              assert row.get('shadow_action') in ('LONG','SHORT')
          print(json.dumps(d['summary'], indent=2))
          PY
      - name: Upload Challenger evidence
        uses: actions/upload-artifact@v4
        with:
          name: atlas-challenger-shadow-${{ github.run_id }}
          path: status/challenger-shadow-latest.json
          retention-days: 30
