name: ATLAS Forward Microstructure Freeze Integrity

on:
  push:
    branches: [main]
    paths:
      - 'status/forward-microstructure-freeze-latest.json'
      - 'forward_microstructure_freeze_runtime.py'
      - 'historical_evaluation_protocol.py'
      - '.github/workflows/atlas-forward-microstructure-freeze-snapshot.yml'
  schedule:
    - cron: '47 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: atlas-forward-microstructure-freeze-integrity
  cancel-in-progress: true

jobs:
  integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify frozen prior-only contract
        run: |
          set -euo pipefail
          p='status/forward-microstructure-freeze-latest.json'
          test -s "$p"
          jq -e '
            .version == "ATLAS_FORWARD_MICROSTRUCTURE_FREEZE_V1_PRIOR_ONLY" and
            .cached_only == true and
            .background_refresh_triggered == false and
            .archive_read_triggered_by_request == false and
            .outcome_read_triggered_by_request == false and
            .research_only == true and
            .live_execution == false and
            .can_override_production == false and
            .state.installed == true and
            .prospective_cohort.registration_locked == true and
            .prospective_cohort.status == "PREREGISTERED"
          ' "$p" >/dev/null
          python3 - <<'PY'
          import datetime,json,pathlib
          p=pathlib.Path('status/forward-microstructure-freeze-latest.json')
          row=json.loads(p.read_text())
          raw=row.get('state',{}).get('last_frozen_at') or row.get('_snapshot_captured_at')
          if not raw: raise SystemExit('missing frozen timestamp')
          t=datetime.datetime.fromisoformat(raw.replace('Z','+00:00'))
          age=(datetime.datetime.now(datetime.timezone.utc)-t).total_seconds()/3600
          print(f'FROZEN_STATE_OK age_hours={age:.2f} stale={age>6}')
          print('NOTE: stale frozen evidence is preserved as historical research and is not refreshed by web runtime.')
          PY
