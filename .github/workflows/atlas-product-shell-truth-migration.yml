name: ATLAS Product Shell Truth Migration

on:
  push:
    branches: [main]
    paths:
      - 'tests/test_ui_canonical_contract.py'
      - 'final_trade_ready_guard.py'
      - '.github/workflows/atlas-product-shell-truth-migration.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate-product-shell:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependency
        run: python -m pip install -q pytest
      - name: Bind visible geometry to canonical analyst output
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('atlas-product-shell.js')
          lines=p.read_text(encoding='utf-8').splitlines()
          out=[]
          seen={'version':0,'truth':0,'render':0,'identity':0}
          for line in lines:
              if "const VERSION='ATLAS_PRODUCT_SHELL_V6_CANONICAL_FINAL_TRUTH';" in line:
                  line=line.replace("ATLAS_PRODUCT_SHELL_V6_CANONICAL_FINAL_TRUTH","ATLAS_PRODUCT_SHELL_V7_BOUND_ANALYST_GEOMETRY")
                  seen['version']+=1
              elif line.startswith('  function truth()'):
                  line="  function truth(){const d=production(),c=d?.canonical_decision,a=d?.analyst_output;if(!d||d.canonical_product_contract!=='analyst_output'||c?.schema!=='ATLAS_CANONICAL_DECISION_TRUTH_V1'||c?.canonical_source_present!==true||c?.source_of_truth!=='FINAL_TRADE_GATE'||c?.product_horizon!=='4-12H'||!Array.isArray(c?.evaluation_horizons_h)||c.evaluation_horizons_h.join(',')!=='4,8,12'||!a||a?.horizon!=='4-12H'||a?.analysis_only!==true||a?.live_execution!==false||a?.canonical_decision_id!==c.decision_id||a?.decision_source_of_truth!=='FINAL_TRADE_GATE'||a?.canonical_decision_schema!==c.schema||a?.geometry_bound_to_canonical_decision!==true||norm(a.decision||'WAIT')!==norm(c.decision||'WAIT'))return null;return {d,c,a};}"
                  seen['truth']+=1
              elif line.startswith('  function render()'):
                  line="  function render(){syncTimeframe();set('apsAsset',$('activeTitle')?.textContent||'Current asset');const x=truth();if(!x){failClosed();return;}const {d,c,a}=x,decision=norm(c.decision)||'WAIT',ready=c.trade_ready===true&&a.analysis_ready===true&&norm(a.decision)===decision&&['LONG','SHORT'].includes(decision),score=finite(a.confidence)?Math.round(Number(a.confidence)):(finite(c.score)?Math.round(Number(c.score)):null),threshold=finite(a.signal_threshold)?Math.round(Number(a.signal_threshold)):(finite(c.threshold)?Math.round(Number(c.threshold)):68),profile=a.evidence_profile||{},g=a.geometry_readiness||{},geometryBlockers=(g.blocker_codes||[]).map(human),geometryReason=geometryBlockers.length?`Geometry blocker: ${geometryBlockers.join(', ')}`:human(g.reason||''),di=a.decision_intelligence||d.decision_intelligence||{};set('apsDecision',ready?decision:'WAIT');const de=$('apsDecision');if(de)de.className='aps-value '+(ready?decision.toLowerCase():'wait');set('apsConfidence',`${score===null?'—':score}/${threshold}`);set('apsEntry',ready?fmt(a.entry):'—');set('apsStop',ready?fmt(a.stop_loss):'—');set('apsTarget',ready?`${fmt(a.take_profit)}${finite(a.risk_reward)?` · R:R ${fmt(a.risk_reward,2)}`:''}`:'—');set('apsRegime',a.regime||d.regime||'MIXED');set('apsTrend',ready?decision:(d.product_direction||d.candidate_direction||'NONE'));set('apsMomentum',`Votes L${d.direction_votes_long??'—'}/S${d.direction_votes_short??'—'}`);set('apsVolume',d.relative_volume==null?'—':`RV ${fmt(d.relative_volume,2)}`);set('apsStructure',human(ready?(a.primary_reason||'Final Gate approved'):c.wait_reason||c.raw_wait_reason||geometryReason||a.primary_reason||'WAIT'));set('apsLiquidity',profile.quality||'NORMAL');set('apsStatus',ready?`${decision} · TRADE READY · FINAL TRADE GATE`:`WAIT · FINAL TRADE GATE · ${human(c.wait_reason||c.raw_wait_reason||geometryReason||'blocked')}`);set('apsAiProd',`${ready?decision:'WAIT'}${score===null?'':` · ${score}/${threshold}`}`);set('apsAiJudge',human(di.stage||'SHADOW VERIFYING'));set('apsAiEvidence',finite(di.evidence_strength)?`${fmt(di.evidence_strength,1)}/100`:'—');set('apsAiTactical',finite(di.uncertainty)?`${fmt(di.uncertainty,1)}/100`:'—');set('apsAiBest',ready?decision:'WAIT');set('apsAiGeometry',ready?`Entry ${fmt(a.entry)} · Stop ${fmt(a.stop_loss)} · Target ${fmt(a.take_profit)} · R:R ${fmt(a.risk_reward,2)} · Final Gate bound`:(geometryReason||'No user-facing trade geometry while canonical decision is WAIT'));set('apsAiTrigger',human(di.next_requirement||(a.what_changes_status||[])[0]||c.raw_wait_reason||c.wait_reason||a.invalidation||'New verified evidence required.'));set('apsAiState',ready?'FINAL TRADE GATE · TRADE READY':'FINAL TRADE GATE · WAIT · analysis remains context only');const blockers=(di.hard_blockers||[]).map(human),pressures=(di.soft_pressures||[]).map(x=>human(x.code)),positives=(di.positive_evidence||[]).map(human);set('apsAiReason',[blockers.length?`Hard blockers: ${blockers.join(', ')}`:'',pressures.length?`Pressures: ${pressures.join(', ')}`:'',positives.length?`Positive evidence: ${positives.join(', ')}`:''].filter(Boolean).join(' · ')||'Decision Intelligence is explanatory only; Final Trade Gate remains authoritative.');set('apsWhy',ready?((a.reasons||[]).map(human).join(' · ')||'Final Trade Gate approved the setup'):human(c.wait_reason||c.raw_wait_reason||geometryReason||'WAIT'));const warnings=(profile.warnings||[]).map(w=>human(w.code)),confirmations=(profile.confirmations||[]).map(human);set('apsRisks',[geometryBlockers.length?`Geometry blocker: ${geometryBlockers.join(', ')}`:'',warnings.length?`Warnings: ${warnings.join(', ')}`:'',confirmations.length?`Confirmations: ${confirmations.join(', ')}`:''].filter(Boolean).join(' · ')||'No additional analysis-layer warning.');set('apsChanges',(a.what_changes_status||[]).map(human).join(' · ')||human(c.raw_wait_reason||'Wait for Final Trade Gate to change.'));}"
                  seen['render']+=1
              elif line.startswith('  window.ATLAS_PRODUCT_SHELL='):
                  line="  window.ATLAS_PRODUCT_SHELL={version:VERSION,canonicalContract:'FINAL_TRADE_GATE+BOUND_ANALYST_OUTPUT',sourceOfTruth:'FINAL_TRADE_GATE',geometrySource:'analyst_output',productHorizon:'4-12H',evaluationHorizons:[4,8,12],analysisOnly:true,liveExecution:false,failClosed:true,geometryReasonCodes:true,decisionIntelligence:true,decisionIntelligenceShadowOnly:true,render,verify};"
                  seen['identity']+=1
              out.append(line)
          if seen != {'version':1,'truth':1,'render':1,'identity':1}:
              raise SystemExit(f'unexpected product shell shape: {seen}')
          p.write_text('\n'.join(out)+'\n',encoding='utf-8')
          PY
      - name: Contract regression tests
        run: |
          node --check atlas-product-shell.js
          python -m py_compile final_trade_ready_guard.py canonical_decision_contract.py
          PYTHONPATH=. python -m pytest -q tests/test_ui_canonical_contract.py
          PYTHONPATH=. python tests/test_final_trade_ready_guard.py
      - name: Reject legacy product geometry authority
        run: |
          if grep -q 'trade_plan||{}' atlas-product-shell.js; then exit 1; fi
          if grep -q 'execution_ready' atlas-product-shell.js; then exit 1; fi
          grep -q 'ATLAS_PRODUCT_SHELL_V7_BOUND_ANALYST_GEOMETRY' atlas-product-shell.js
          grep -q 'geometry_bound_to_canonical_decision' atlas-product-shell.js
      - name: Commit Product Shell migration
        run: |
          if git diff --quiet -- atlas-product-shell.js; then
            echo 'product shell already migrated'
            exit 0
          fi
          git config user.name 'atlas-canonical-migrator'
          git config user.email 'atlas-migrator@users.noreply.github.com'
          git add atlas-product-shell.js
          git commit -m 'refactor: bind product geometry to final-gate analyst output'
          git push origin HEAD:main
