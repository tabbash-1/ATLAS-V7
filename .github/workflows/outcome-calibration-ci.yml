name: ATLAS Outcome Calibration CI

on:
  push:
    branches: [main]
    paths:
      - 'outcome_calibration.py'
      - 'outcome_calibration_runtime.py'
      - 'outcome-calibration-ui.js'
      - 'tests/test_outcome_calibration.py'
      - 'cloud_start.py'
      - '.github/workflows/outcome-calibration-ci.yml'
  pull_request:
    branches: [main]

jobs:
  calibration:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Python syntax
        run: python -m py_compile outcome_calibration.py outcome_calibration_runtime.py tests/test_outcome_calibration.py cloud_start.py
      - name: JavaScript syntax
        run: node --check outcome-calibration-ui.js
      - name: Calibration tests
        run: PYTHONPATH=. python -m pytest -q tests/test_outcome_calibration.py
      - name: Safety invariants
        run: |
          grep -q "auto_apply.*False" outcome_calibration.py
          grep -q "threshold_changed.*False" outcome_calibration.py
          grep -q "ATLAS_CLOUD_FORWARD_MIN_SCORE.*68" cloud_start.py
          grep -q "_install_outcome_calibration_runtime" cloud_start.py
