name: ATLAS Alpha Core V2 Forward Shadow
on:
  pull_request:
    branches: [main]
    paths:
      - 'research/alpha_core_v2.py'
      - 'research/alpha_core_v2_forward_shadow.py'
      - 'tests/test_alpha_core_v2.py'
      - 'tests/test_alpha_core_v2_forward_shadow.py'
      - '.github/workflows/alpha-core-v2-forward-shadow.yml'
  push:
    branches: [main]
    paths:
      - 'research/alpha_core_v2.py'
      - 'research/alpha_core_v2_forward_shadow.py'
      - 'tests/test_alpha_core_v2.py'
      - 'tests/test_alpha_core_v2_forward_shadow.py'
      - '.github/workflows/alpha-core-v2-forward-shadow.yml'
  workflow_dispatch:
  schedule:
    - cron: '29 */4 * * *'

permissions:
  contents: write

concurrency:
  group: alpha-core-v2-forward-shadow
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependency
        run: python -m pip install pytest
      - name: Alpha Core regressions
        run: python -m pytest -q tests/test_alpha_core_v2.py tests/test_alpha_core_v2_forward_shadow.py
      - name: Research-only invariants
        run: |
          grep -Fq 'ATLAS_ALPHA_CORE_V2_REGIME_ADAPTIVE' research/alpha_core_v2.py
          grep -Fq '"can_override_production": False' research/alpha_core_v2.py
          grep -Fq '"live_execution": False' research/alpha_core_v2.py
          grep -Fq 'ATLAS_ALPHA_CORE_V2_FORWARD_SHADOW_V1' research/alpha_core_v2_forward_shadow.py
          grep -Fq '"can_override_production":False' research/alpha_core_v2_forward_shadow.py
          grep -Fq '"can_create_trade":False' research/alpha_core_v2_forward_shadow.py

  forward-shadow:
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Capture and settle prospective evidence
        run: python research/alpha_core_v2_forward_shadow.py
      - name: Contract check
        run: |
          jq -e '.schema=="ATLAS_ALPHA_CORE_V2_FORWARD_SHADOW_V1_LATEST" and .alpha_version=="ATLAS_ALPHA_CORE_V2_REGIME_ADAPTIVE" and .research_only==true and .shadow_only==true and .live_execution==false and .production_effect=="NONE" and .can_override_production==false and .can_override_final_gate==false and .can_change_threshold==false and .can_create_trade==false' status/alpha-core-v2-forward-shadow-latest.json
      - name: Commit research evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "atlas-alpha-v2-shadow"
          git config user.email "atlas-alpha-v2-shadow@users.noreply.github.com"
          git add status/alpha-core-v2-forward-ledger.json status/alpha-core-v2-forward-shadow-latest.json
          if git diff --cached --quiet; then
            echo "No Alpha Core V2 forward evidence changes."
            exit 0
          fi
          git commit -m "research: update Alpha Core V2 forward shadow [skip ci] [skip render]"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep $((attempt * 2))
          done
          echo "Alpha Core V2 forward evidence push failed after retry/rebase loop" >&2
          exit 1
