name: ATLAS V6 Candidate C Failure Diagnosis
on:
  push:
    branches: [main]
    paths:
      - 'v6_candidate_c_failure_diagnosis.py'
      - 'v6_shadow_replay.py'
      - 'status/wait-outcomes.json'
      - '.github/workflows/v6-candidate-c-failure-diagnosis.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Diagnose frozen Candidate C
        run: python v6_candidate_c_failure_diagnosis.py
      - name: Guard Production
        run: |
          python - <<'PY'
          import json
          p=json.load(open('status/v6-candidate-c-failure-diagnosis.json'))
          g=p['guardrails']
          assert g['research_only'] is True
          assert g['production_threshold_changed'] is False
          assert g['production_score_changed'] is False
          assert g['auto_promotion_enabled'] is False
          assert g['candidate_c_promoted'] is False
          print('guardrails: ok')
          PY
      - name: Commit report
        run: |
          if [ -z "$(git status --porcelain -- status/v6-candidate-c-failure-diagnosis.json)" ]; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add status/v6-candidate-c-failure-diagnosis.json
          git commit -m 'data: refresh Candidate C failure diagnosis'
          git push
