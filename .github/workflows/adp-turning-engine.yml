name: ADP Turning Engine Research
on:
  workflow_dispatch:
  push:
    branches: [research/adp-v8-historical-backtest]
    paths:
      - 'research/adp/turning_engine_*.py'
      - '.github/workflows/adp-turning-engine.yml'
permissions:
  contents: write
concurrency:
  group: adp-turning-engine
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/adp-v8-historical-backtest
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate V2
        run: python research/adp/turning_engine_v2.py --days 730 --end-ms 1790796000000
      - name: Persist result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add status/adp-turning-engine-v2.json
          git diff --cached --quiet && exit 0
          git commit -m "research: refresh ADP turning V2 [skip ci] [skip render]"
          for i in 1 2 3 4 5; do
            git pull --rebase origin research/adp-v8-historical-backtest && git push origin HEAD:research/adp-v8-historical-backtest && exit 0
            sleep $((i*2))
          done
          exit 1
