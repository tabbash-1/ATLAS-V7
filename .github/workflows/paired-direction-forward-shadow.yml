name: ATLAS Paired Direction Forward Shadow
on:
  pull_request:
    branches: [main]
    paths:
      - 'research/paired_direction_forward_shadow.py'
      - 'tests/test_paired_direction_forward_shadow.py'
      - '.github/workflows/paired-direction-forward-shadow.yml'
  push:
    branches: [main]
    paths:
      - 'research/paired_direction_forward_shadow.py'
      - 'tests/test_paired_direction_forward_shadow.py'
      - '.github/workflows/paired-direction-forward-shadow.yml'
  workflow_dispatch:
  schedule:
    - cron: '41 * * * *'

permissions:
  contents: write

concurrency:
  group: paired-direction-forward-shadow
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependency
        run: python -m pip install pytest
      - name: Paired shadow regressions
        run: python -m pytest -q tests/test_paired_direction_forward_shadow.py
      - name: Research-only invariants
        run: |
          grep -Fq 'ATLAS_PAIRED_DIRECTION_FORWARD_SHADOW_V1' research/paired_direction_forward_shadow.py
          grep -Fq '"can_override_production":False' research/paired_direction_forward_shadow.py
          grep -Fq '"can_create_trade":False' research/paired_direction_forward_shadow.py

  forward-shadow:
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Capture and settle paired prospective evidence
        run: python research/paired_direction_forward_shadow.py
      - name: Contract check
        run: |
          jq -e '.schema=="ATLAS_PAIRED_DIRECTION_FORWARD_SHADOW_V1_LATEST" and .research_only==true and .shadow_only==true and .live_execution==false and .production_effect=="NONE" and .can_override_production==false and .can_override_final_gate==false and .can_change_threshold==false and .can_create_trade==false' status/paired-direction-forward-shadow-latest.json
      - name: Commit paired research evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "atlas-paired-direction-shadow"
          git config user.email "atlas-paired-direction-shadow@users.noreply.github.com"
          git add status/paired-direction-forward-ledger.json status/paired-direction-forward-shadow-latest.json
          if git diff --cached --quiet; then
            echo "No paired direction evidence changes."
            exit 0
          fi
          git commit -m "research: update paired direction forward shadow [skip ci] [skip render]"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep $((attempt * 2))
          done
          echo "paired direction evidence push failed after retry/rebase loop" >&2
          exit 1
