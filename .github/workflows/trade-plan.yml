name: ATLAS Production Trade Plan
on:
  pull_request:
  push:
    branches: [main]
jobs:
  trade-plan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -q pytest
      - run: python -m pytest -q tests/test_production_trade_plan.py
      - run: python -m py_compile production_trade_plan.py decision_engine_v7.py
