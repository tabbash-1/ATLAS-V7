name: ATLAS Profitability Regime Router Research
on:
  push:
    branches: [main]
    paths:
      - 'profitability_regime_router_research.py'
      - 'tests/test_profitability_regime_router_research.py'
      - 'status/analyst-forward-attribution-latest.json'
      - '.github/workflows/atlas-profitability-regime-router.yml'
  schedule:
    - cron: '53 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: atlas-profitability-regime-router-${{ github.ref }}
  cancel-in-progress: true
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Safety regression
        run: PYTHONPATH=. python3 tests/test_profitability_regime_router_research.py
      - name: Build regime and path-quality evidence
        run: python3 profitability_regime_router_research.py
      - name: Enforce research-only boundary
        run: jq -e '.decision == "RESEARCH_ONLY_NO_ROUTING_CHANGE" and .production_mutation_authorized == false and .automatic_promotion == false and .causal_claim == false' status/profitability-regime-router-latest.json >/dev/null
      - name: Commit evidence
        run: |
          git config user.name "atlas-regime-router-research"
          git config user.email "atlas-regime-router-research@users.noreply.github.com"
          git add status/profitability-regime-router-latest.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "research: update regime-router evidence [skip ci] [skip render]"
          git pull --rebase origin main
          git push
