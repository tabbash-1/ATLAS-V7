name: ATLAS Final Trade Gate Live Smoke

# Canonical live verification for the final 4-12H trade-ready authority.
on:
  push:
    branches: [main]
    paths:
      - 'canonical_decision_contract.py'
      - 'final_trade_ready_guard.py'
      - 'cloud_web_only_final.py'
      - 'cloud_start.py'
      - 'render.yaml'
      - '.github/workflows/atlas-final-trade-gate-live-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: atlas-final-trade-gate-live-smoke
  cancel-in-progress: true

jobs:
  verify-live:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Verify Production runtime and canonical final decision contract
        shell: bash
        run: |
          set -euo pipefail
          base='https://atlas-v7.onrender.com'
          ok=0
          for i in $(seq 1 36); do
            if curl -fsSL --connect-timeout 10 --max-time 40 "$base/api/runtime/status" -o /tmp/runtime.json \
              && jq -e '.ok == true and .runtime == "WEB_ONLY_FINAL" and .final_trade_ready_guard.version == "FINAL_TRADE_READY_GUARD_V1_HTF_FAIL_CLOSED" and .product_horizon == "4-12H" and .live_execution == false' /tmp/runtime.json >/dev/null; then
              ok=1; break
            fi
            sleep 10
          done
          test "$ok" = 1

          curl -fsSL --retry 6 --retry-delay 8 --retry-all-errors --connect-timeout 10 --max-time 60 \
            "$base/api/decision/current?symbol=BNBUSDT" -o /tmp/decision.json

          jq -e '
            .ok == true
            and (.trade_ready|type) == "boolean"
            and .final_trade_gate.version == "FINAL_TRADE_READY_GUARD_V1_HTF_FAIL_CLOSED"
            and .canonical_decision.schema == "ATLAS_CANONICAL_DECISION_TRUTH_V1"
            and .canonical_decision.canonical_source_present == true
            and .canonical_decision.source_of_truth == "FINAL_TRADE_GATE"
            and .canonical_decision.product_horizon == "4-12H"
            and .canonical_decision.evaluation_horizons_h == [4,8,12]
            and (.canonical_decision_id|type) == "string"
            and (.canonical_decision_id|length) > 0
            and .canonical_decision_id == .canonical_decision.decision_id
          ' /tmp/decision.json >/dev/null

          jq -e '
            if .final_trade_gate.trade_ready == true then
              .trade_ready == true
              and .canonical_decision.trade_ready == true
              and .canonical_decision.decision == .final_trade_gate.direction
              and .canonical_decision.direction == .final_trade_gate.direction
              and (.canonical_decision.decision == "LONG" or .canonical_decision.decision == "SHORT")
              and .actionable_decision == .final_trade_gate.direction
              and .final_trade_gate.direction_alignment == "ALIGNED"
              and .final_trade_gate.production_signal_qualified == true
              and .final_trade_gate.canonical_geometry_ready == true
            else
              .trade_ready == false
              and .canonical_decision.trade_ready == false
              and .canonical_decision.decision == "WAIT"
              and .actionable_decision == "WAIT"
              and .analysis_ready == false
              and .can_execute == false
              and (.trade_plan.analysis_ready == false)
              and (.trade_plan.can_execute == false)
              and (.canonical_wait_reason == .canonical_decision.wait_reason)
            end
          ' /tmp/decision.json >/dev/null

          echo 'LIVE_CANONICAL_DECISION_TRUTH_OK'
          jq '{symbol,actionable_decision,trade_ready,canonical_decision_id,canonical_wait_reason,canonical_decision,final_trade_gate}' /tmp/decision.json
