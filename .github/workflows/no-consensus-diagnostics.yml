name: ATLAS NO Consensus Diagnostics

on:
  push:
    branches: [main]
    paths:
      - 'no_consensus_diagnostics.py'
      - 'tests/test_no_consensus_diagnostics.py'
      - '.github/workflows/no-consensus-diagnostics.yml'
  schedule:
    - cron: '37 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: atlas-no-consensus-diagnostics
  cancel-in-progress: true

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate diagnostics
        run: python3 tests/test_no_consensus_diagnostics.py
      - name: Build report
        run: |
          python3 - <<'PY'
          import json,pathlib
          import no_consensus_diagnostics as n
          p=pathlib.Path('status/wait-outcomes.json')
          payload=json.loads(p.read_text()) if p.exists() else {'records':[]}
          report=n.diagnose(payload)
          pathlib.Path('status').mkdir(parents=True,exist_ok=True)
          pathlib.Path('status/no-consensus-diagnostics.json').write_text(json.dumps(report,indent=2,sort_keys=True))
          PY
      - name: Commit report
        run: |
          git config user.name "atlas-no-consensus"
          git config user.email "atlas-no-consensus@users.noreply.github.com"
          git add status/no-consensus-diagnostics.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore: update NO_CONSENSUS diagnostics [skip ci]"
          git pull --rebase origin main
          git push
