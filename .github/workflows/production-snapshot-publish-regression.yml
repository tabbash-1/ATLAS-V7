name: Production Snapshot Publish Regression

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/atlas-production-snapshot.yml'
      - '.github/workflows/production-snapshot-publish-regression.yml'
      - 'tests/test_production_snapshot_publish_race.py'
  push:
    branches: [main]
    paths:
      - '.github/workflows/atlas-production-snapshot.yml'
      - '.github/workflows/production-snapshot-publish-regression.yml'
      - 'tests/test_production_snapshot_publish_race.py'

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate snapshot publish race guard
        run: PYTHONPATH=. python tests/test_production_snapshot_publish_race.py
