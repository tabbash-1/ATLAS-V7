name: ATLAS Render Web-Only Smoke
on:
  push:
    branches: [main]
    paths:
      - 'render.yaml'
      - 'Dockerfile'
      - 'cloud_start.py'
      - 'cloud_web_only.py'
      - 'render_boot_patch.py'
      - 'production_signal_scoring.py'
      - 'production_decision_api.py'
      - 'consensus_tiebreak_shadow.py'
      - 'tests/test_partial_hour_volume_progress.py'
      - 'tests/test_consensus_tiebreak_shadow.py'
      - 'production-web-autoload.js'
      - 'atlas-production-decision.js'
      - '.github/workflows/render-web-only-smoke.yml'
  workflow_dispatch:
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Wait for Render deploy
        run: sleep 90
      - name: Verify web-safe runtime, Production UI, live volume pacing, and shadow isolation
        shell: bash
        run: |
          set -euo pipefail
          base='https://atlas-v7.onrender.com'
          curl -fsSL --retry 10 --retry-delay 10 --retry-all-errors --connect-timeout 10 --max-time 30 "$base/health" | tee /tmp/health.json
          curl -fsSL --retry 8 --retry-delay 10 --retry-all-errors --connect-timeout 10 --max-time 30 "$base/api/web-mode" | tee /tmp/web.json
          curl -fsSL --retry 5 --retry-delay 8 --retry-all-errors --connect-timeout 10 --max-time 45 "$base/api/cloud-forward/status" | tee /tmp/cloud.json
          curl -fsSL --retry 5 --retry-delay 8 --retry-all-errors --connect-timeout 10 --max-time 60 "$base/api/decision/current?symbol=BTCUSDT" | tee /tmp/btc.json
          curl -fsSL --retry 5 --retry-delay 8 --retry-all-errors --connect-timeout 10 --max-time 60 "$base/api/decision/current?symbol=HYPEUSDT" | tee /tmp/hype.json
          curl -fsSL --retry 5 --retry-delay 8 --retry-all-errors --connect-timeout 10 --max-time 60 "$base/api/research/consensus-tiebreak-shadow?symbol=BTCUSDT" | tee /tmp/shadow.json
          curl -fsSL --retry 5 --retry-delay 8 --retry-all-errors --connect-timeout 10 --max-time 45 "$base/api/web/volume-diagnostic?symbol=BTCUSDT" | tee /tmp/vol.json
          curl -fsSL --retry 5 --retry-delay 8 --retry-all-errors --connect-timeout 10 --max-time 30 "$base/" | tee /tmp/index.html >/dev/null
          grep -q 'atlas-production-decision.js' /tmp/index.html
          grep -q 'production-web-autoload.js' /tmp/index.html
          curl -fsSL --retry 3 --retry-delay 5 --retry-all-errors --connect-timeout 10 --max-time 30 "$base/atlas-production-decision.js" >/tmp/prod-ui.js
          curl -fsSL --retry 3 --retry-delay 5 --retry-all-errors --connect-timeout 10 --max-time 30 "$base/production-web-autoload.js" >/tmp/prod-autoload.js
          test -s /tmp/prod-ui.js
          test -s /tmp/prod-autoload.js
          python3 - <<'PY'
          import json, math
          h=json.load(open('/tmp/health.json'))
          w=json.load(open('/tmp/web.json'))
          c=json.load(open('/tmp/cloud.json'))
          btc=json.load(open('/tmp/btc.json'))
          hype=json.load(open('/tmp/hype.json'))
          shadow=json.load(open('/tmp/shadow.json'))
          vol=json.load(open('/tmp/vol.json'))
          assert h.get('status')=='ok', h
          assert w.get('ok') is True and w.get('enabled') is True, w
          assert w.get('background_workers') is False, w
          assert w.get('cloud_forward_in_web_process') is False, w
          assert float(w.get('production_threshold')) == 68.0, w
          shadow_mode=w.get('consensus_tiebreak_shadow') or {}
          assert shadow_mode.get('shadow_only') is True, w
          assert shadow_mode.get('can_override_production') is False, w
          assert shadow_mode.get('production_threshold_changed') is False, w
          assert c.get('enabled') is False, c
          for d in (btc,hype):
              assert d.get('ok') is True, d
              assert float(d.get('signal_threshold')) == 68.0, d
              assert 'PACED_VOLUME_V1' in str(d.get('source')), d
              vp=d.get('volume_pacing') or {}
              dprogress=float(vp['candle_progress'])
              draw=float(vp['raw_relative_volume'])
              dpaced=float(vp['paced_relative_volume'])
              assert 0.10 <= dprogress <= 1.0, d
              assert draw >= 0 and dpaced >= 0, d
              dexpected=min(4.0, draw/dprogress)
              assert math.isclose(dpaced, dexpected, rel_tol=2e-5, abs_tol=2e-5), (d, dexpected)
              indicators=d.get('indicators') or {}
              assert math.isclose(float(indicators['volume_ratio']), dpaced, rel_tol=2e-5, abs_tol=2e-5), d
              assert math.isclose(float(indicators['raw_volume_ratio']), draw, rel_tol=2e-5, abs_tol=2e-5), d
              assert math.isclose(float(indicators['candle_progress']), dprogress, rel_tol=2e-5, abs_tol=2e-5), d
              assert math.isclose(float(d['relative_volume']), dpaced, rel_tol=0, abs_tol=0.0015), d
              direction=d.get('candidate_direction')
              score=d.get('score')
              if direction in ('LONG','SHORT'):
                  assert score is not None, d
                  assert d.get('scoring_version'), d
              else:
                  assert score is None, d
                  assert d.get('wait_reason') in ('NO_DIRECTIONAL_CONSENSUS','SCORER_RETURNED_NO_CANDIDATE'), d
                  assert isinstance(d.get('direction_votes_long'), int), d
                  assert isinstance(d.get('direction_votes_short'), int), d
          assert shadow.get('ok') is True, shadow
          assert 'CONSENSUS_TIEBREAK_SHADOW_V1' in str(shadow.get('source')), shadow
          assert shadow.get('shadow_only') is True, shadow
          assert shadow.get('can_override_production') is False, shadow
          assert shadow.get('can_execute') is False, shadow
          assert shadow.get('research_only') is True and shadow.get('live_execution') is False, shadow
          assert float(shadow.get('production_threshold')) == 68.0, shadow
          assert shadow.get('horizons_hours') == [1,3], shadow
          assert shadow.get('rule') == 'EXACT_2_2_FOLLOW_24H_MOMENTUM_SIGN', shadow
          if shadow.get('status') == 'SHADOW_SIGNAL':
              assert shadow.get('production_decision') == 'WAIT', shadow
              assert shadow.get('production_wait_reason') == 'NO_DIRECTIONAL_CONSENSUS', shadow
              assert shadow.get('direction_votes_long') == 2 and shadow.get('direction_votes_short') == 2, shadow
              mom=float(shadow.get('momentum_24h_pct'))
              assert shadow.get('direction') == ('LONG' if mom >= 0 else 'SHORT'), shadow
          else:
              assert shadow.get('status') == 'INACTIVE', shadow
          assert vol.get('ok') is True, vol
          assert vol.get('symbol') == 'BTCUSDT', vol
          progress=float(vol['candle_progress'])
          raw=float(vol['raw_relative_volume'])
          paced=float(vol['paced_relative_volume'])
          assert 0.10 <= progress <= 1.0, vol
          assert raw >= 0 and paced >= 0, vol
          expected=min(4.0, raw/progress)
          assert math.isclose(paced, expected, rel_tol=2e-5, abs_tol=2e-5), (vol, expected)
          assert 'PARTIAL_VOLUME_TIME_FIX_V1' in str(vol.get('scoring_version')), vol
          assert float(vol.get('production_threshold')) == 68.0, vol
          assert vol.get('research_only') is True and vol.get('live_execution') is False, vol
          # Decision and diagnostic are separate live requests; values may move,
          # but both must be using the same paced-volume formula and same hour.
          bvp=btc['volume_pacing']
          assert abs(float(bvp['candle_progress'])-progress) <= 0.05, (btc,vol)
          print('RENDER_WEB_ONLY_PRODUCTION_UI_OK')
          print('LIVE_CONSENSUS_TIEBREAK_SHADOW', shadow)
          print('LIVE_DECISION_VOLUME_PACING', bvp)
          print('LIVE_VOLUME_DIAGNOSTIC', vol)
          PY