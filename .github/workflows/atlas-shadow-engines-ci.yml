name: ATLAS Shadow Engines CI

on:
  push:
    branches: [main]
    paths:
      - 'microstructure_memory.py'
      - 'microstructure_walkforward.py'
      - 'microstructure_runtime.py'
      - 'volatility_forecast_engine.py'
      - 'volatility_walkforward.py'
      - 'volatility_runtime.py'
      - 'volatility_walkforward_runtime.py'
      - 'edge_evidence_overlap.py'
      - 'edge_evidence_redundancy.py'
      - 'edge_evidence_joint_coverage.py'
      - 'edge_evidence_interaction_protocol.py'
      - 'edge_evidence_interaction_validator_guard.py'
      - 'edge_evidence_report.py'
      - 'tests/test_microstructure_memory.py'
      - 'tests/test_microstructure_walkforward.py'
      - 'tests/test_microstructure_runtime.py'
      - 'tests/test_volatility_forecast_engine.py'
      - 'tests/test_volatility_walkforward.py'
      - 'tests/test_volatility_runtime.py'
      - 'tests/test_volatility_walkforward_runtime.py'
      - 'tests/test_edge_evidence_overlap.py'
      - 'tests/test_edge_evidence_redundancy.py'
      - 'tests/test_edge_evidence_joint_coverage.py'
      - 'tests/test_edge_evidence_joint_governance.py'
      - 'tests/test_edge_evidence_interaction_protocol.py'
      - 'tests/test_edge_evidence_interaction_validator_guard.py'
      - 'tests/test_edge_evidence_report.py'
      - '.github/workflows/atlas-shadow-engines-ci.yml'
      - '.github/workflows/atlas-interaction-protocol-ci.yml'
      - 'cloud_start.py'
  pull_request:
    branches: [main]
    paths:
      - 'microstructure_memory.py'
      - 'microstructure_walkforward.py'
      - 'microstructure_runtime.py'
      - 'volatility_forecast_engine.py'
      - 'volatility_walkforward.py'
      - 'volatility_runtime.py'
      - 'volatility_walkforward_runtime.py'
      - 'edge_evidence_overlap.py'
      - 'edge_evidence_redundancy.py'
      - 'edge_evidence_joint_coverage.py'
      - 'edge_evidence_interaction_protocol.py'
      - 'edge_evidence_interaction_validator_guard.py'
      - 'edge_evidence_report.py'
      - 'tests/test_microstructure_memory.py'
      - 'tests/test_microstructure_walkforward.py'
      - 'tests/test_microstructure_runtime.py'
      - 'tests/test_volatility_forecast_engine.py'
      - 'tests/test_volatility_walkforward.py'
      - 'tests/test_volatility_runtime.py'
      - 'tests/test_volatility_walkforward_runtime.py'
      - 'tests/test_edge_evidence_overlap.py'
      - 'tests/test_edge_evidence_redundancy.py'
      - 'tests/test_edge_evidence_joint_coverage.py'
      - 'tests/test_edge_evidence_joint_governance.py'
      - 'tests/test_edge_evidence_interaction_protocol.py'
      - 'tests/test_edge_evidence_interaction_validator_guard.py'
      - 'tests/test_edge_evidence_report.py'
      - '.github/workflows/atlas-shadow-engines-ci.yml'
      - '.github/workflows/atlas-interaction-protocol-ci.yml'
      - 'cloud_start.py'

jobs:
  shadow-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test runner
        run: python -m pip install --disable-pip-version-check pytest
      - name: Syntax
        run: |
          python -m py_compile microstructure_memory.py microstructure_walkforward.py microstructure_runtime.py volatility_forecast_engine.py volatility_walkforward.py volatility_runtime.py volatility_walkforward_runtime.py edge_evidence_overlap.py edge_evidence_redundancy.py edge_evidence_joint_coverage.py edge_evidence_interaction_protocol.py edge_evidence_interaction_validator_guard.py edge_evidence_report.py
      - name: Shadow engine regression tests
        run: |
          PYTHONPATH=. python -m pytest -q \
            tests/test_microstructure_memory.py \
            tests/test_microstructure_walkforward.py \
            tests/test_microstructure_runtime.py \
            tests/test_volatility_forecast_engine.py \
            tests/test_volatility_walkforward.py \
            tests/test_volatility_runtime.py \
            tests/test_volatility_walkforward_runtime.py \
            tests/test_edge_evidence_overlap.py \
            tests/test_edge_evidence_redundancy.py \
            tests/test_edge_evidence_joint_coverage.py \
            tests/test_edge_evidence_joint_governance.py \
            tests/test_edge_evidence_interaction_protocol.py \
            tests/test_edge_evidence_interaction_validator_guard.py \
            tests/test_edge_evidence_report.py
      - name: Preserve shadow-only contract
        run: |
          grep -q "can_override_production.*False" microstructure_runtime.py
          grep -q "gate_mode.*OBSERVE_ONLY" microstructure_runtime.py
          grep -q "probability_calibrated.*False" volatility_forecast_engine.py
          grep -q "can_override_production.*False" volatility_forecast_engine.py
          grep -q "can_override_production.*False" volatility_walkforward.py
          grep -q "gate_promoted.*False" volatility_walkforward.py
          grep -q "can_override_production.*False" volatility_runtime.py
          grep -q "network_calls_in_decision_path.*False" volatility_runtime.py
          grep -q "background_only.*True" volatility_walkforward_runtime.py
          grep -q "wraps_production_decision.*False" volatility_walkforward_runtime.py
          grep -q "wraps_forward_observe.*False" volatility_walkforward_runtime.py
          grep -q "can_override_production.*False" volatility_walkforward_runtime.py
          grep -q "outcomes_read.*False" edge_evidence_overlap.py
          grep -q "historical_features_recomputed.*False" edge_evidence_overlap.py
          grep -q "weights_assigned.*False" edge_evidence_overlap.py
          grep -q "composite_trade_score_created.*False" edge_evidence_overlap.py
          grep -q "cross_layer_interaction_filtering_enabled.*False" edge_evidence_overlap.py
          grep -q "gate_promoted.*False" edge_evidence_overlap.py
          grep -q "can_override_production.*False" edge_evidence_overlap.py
          grep -q "production_ready_claimed.*False" edge_evidence_overlap.py
          grep -q "live_trading_ready_claimed.*False" edge_evidence_overlap.py
          grep -q "wraps_production_decision.*False" edge_evidence_overlap.py
          grep -q "wraps_forward_observe.*False" edge_evidence_overlap.py
          grep -q "outcomes_read.*False" edge_evidence_redundancy.py
          grep -q "historical_features_recomputed.*False" edge_evidence_redundancy.py
          grep -q "weights_assigned.*False" edge_evidence_redundancy.py
          grep -q "composite_trade_score_created.*False" edge_evidence_redundancy.py
          grep -q "cross_layer_interaction_filtering_enabled.*False" edge_evidence_redundancy.py
          grep -q "gate_promoted.*False" edge_evidence_redundancy.py
          grep -q "can_override_production.*False" edge_evidence_redundancy.py
          grep -q "production_ready_claimed.*False" edge_evidence_redundancy.py
          grep -q "live_trading_ready_claimed.*False" edge_evidence_redundancy.py
          grep -q "statistical_independence_claimed.*False" edge_evidence_redundancy.py
          grep -q "chosen_trade_horizon_assumed.*False" edge_evidence_redundancy.py
          grep -q "wraps_production_decision.*False" edge_evidence_redundancy.py
          grep -q "wraps_forward_observe.*False" edge_evidence_redundancy.py
          grep -q "outcomes_read.*False" edge_evidence_joint_coverage.py
          grep -q "performance_metrics_computed.*False" edge_evidence_joint_coverage.py
          grep -q "rules_searched.*False" edge_evidence_joint_coverage.py
          grep -q "grid_search_performed.*False" edge_evidence_joint_coverage.py
          grep -q "weights_assigned.*False" edge_evidence_joint_coverage.py
          grep -q "composite_trade_score_created.*False" edge_evidence_joint_coverage.py
          grep -q "cross_layer_interaction_filtering_enabled.*False" edge_evidence_joint_coverage.py
          grep -q "interaction_rule_selection_allowed.*False" edge_evidence_joint_coverage.py
          grep -q "interaction_outcome_testing_performed.*False" edge_evidence_joint_coverage.py
          grep -q "gate_promoted.*False" edge_evidence_joint_coverage.py
          grep -q "can_override_production.*False" edge_evidence_joint_coverage.py
          grep -q "production_ready_claimed.*False" edge_evidence_joint_coverage.py
          grep -q "live_trading_ready_claimed.*False" edge_evidence_joint_coverage.py
          grep -q "chosen_trade_horizon_assumed.*False" edge_evidence_joint_coverage.py
          grep -q "wraps_production_decision.*False" edge_evidence_joint_coverage.py
          grep -q "wraps_forward_observe.*False" edge_evidence_joint_coverage.py
          grep -q "outcomes_read.*False" edge_evidence_interaction_protocol.py
          grep -q "interaction_outcome_testing_performed.*False" edge_evidence_interaction_protocol.py
          grep -q "grid_search_performed.*False" edge_evidence_interaction_protocol.py
          grep -q "cross_layer_interaction_filtering_enabled.*False" edge_evidence_interaction_protocol.py
          grep -q "interaction_filter_activation_allowed.*False" edge_evidence_interaction_protocol.py
          grep -q "gate_promoted.*False" edge_evidence_interaction_protocol.py
          grep -q "can_override_production.*False" edge_evidence_interaction_protocol.py
          grep -q "protocol_hash_required.*True" edge_evidence_interaction_validator_guard.py
          grep -q "outcomes_read.*False" edge_evidence_interaction_validator_guard.py
          grep -q "validator_execution_started.*False" edge_evidence_interaction_validator_guard.py
          grep -q "interaction_outcome_testing_performed.*False" edge_evidence_interaction_validator_guard.py
          grep -q "grid_search_allowed.*False" edge_evidence_interaction_validator_guard.py
          grep -q "cross_layer_interaction_filtering_enabled.*False" edge_evidence_interaction_validator_guard.py
          grep -q "interaction_filter_activation_allowed.*False" edge_evidence_interaction_validator_guard.py
          grep -q "gate_promoted.*False" edge_evidence_interaction_validator_guard.py
          grep -q "can_override_production.*False" edge_evidence_interaction_validator_guard.py
          grep -q "weights_assigned.*False" edge_evidence_report.py
          grep -q "composite_trade_score_created.*False" edge_evidence_report.py
          grep -q "cross_layer_interaction_filtering_enabled.*False" edge_evidence_report.py
          grep -q "production_ready_claimed.*False" edge_evidence_report.py
          grep -q "live_trading_ready_claimed.*False" edge_evidence_report.py
          grep -q "wraps_production_decision.*False" edge_evidence_report.py
          grep -q "wraps_forward_observe.*False" edge_evidence_report.py
          grep -q "can_override_production.*False" edge_evidence_report.py
          grep -q "edge_evidence_overlap.install(collector)" edge_evidence_report.py
          grep -q "edge_evidence_redundancy.install(collector)" edge_evidence_report.py
          grep -q "edge_evidence_joint_coverage.install(collector)" edge_evidence_report.py
          grep -q "frozen_signal_cohorts_comparable" edge_evidence_report.py
          grep -q "redundancy_diagnostic_affects_status.*False" edge_evidence_report.py
          grep -q "joint_coverage_diagnostic_affects_status.*False" edge_evidence_report.py
          grep -q "interaction_validation_started.*False" edge_evidence_report.py
          grep -q 'edge_evidence_report.install(collector)' volatility_walkforward_runtime.py
          grep -q 'edge_evidence_interaction_protocol.install(collector)' volatility_walkforward_runtime.py
          grep -q 'edge_evidence_interaction_validator_guard.install(collector)' volatility_walkforward_runtime.py
          grep -q '_install_profit_engine_runtime' cloud_start.py
          grep -q '_install_microstructure_runtime' cloud_start.py
          grep -q '_install_volatility_runtime' cloud_start.py
          grep -q '_install_volatility_walkforward_runtime' cloud_start.py
          profit_line=$(grep -n '_install_profit_engine_runtime(_collector)' cloud_start.py | head -1 | cut -d: -f1)
          micro_line=$(grep -n '_install_microstructure_runtime(_collector)' cloud_start.py | head -1 | cut -d: -f1)
          volatility_line=$(grep -n '_install_volatility_runtime(_collector)' cloud_start.py | head -1 | cut -d: -f1)
          volatility_wf_line=$(grep -n '_install_volatility_walkforward_runtime(_collector)' cloud_start.py | head -1 | cut -d: -f1)
          test "$micro_line" -gt "$profit_line"
          test "$volatility_line" -gt "$micro_line"
          test "$volatility_wf_line" -gt "$volatility_line"
