name: RC10.1 Live Site Smoke

on:
  push:
    branches: [main]
    paths:
      - 'cloud_start_web.py'
      - 'cloud_web_only.py'
      - 'render_boot_patch.py'
      - 'rc10_1_deep_analysis_overlay.py'
      - 'atlas-deep-analysis-ui.js'
      - 'atlas-product-shell.js'
      - '.github/workflows/rc10-site-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Verify Render RC10.1 endpoint and primary 4-12H UI
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://atlas-v7.onrender.com'
          ok=0
          for i in $(seq 1 30); do
            code=$(curl -L -sS --connect-timeout 10 --max-time 45 -o /tmp/deep.json -w '%{http_code}' "$BASE/api/deep-analysis/current?symbol=BTCUSDT" || true)
            ui=$(curl -L -sS --connect-timeout 10 --max-time 45 -o /tmp/deep-ui.js -w '%{http_code}' "$BASE/atlas-deep-analysis-ui.js" || true)
            index=$(curl -L -sS --connect-timeout 10 --max-time 45 -o /tmp/index.html -w '%{http_code}' "$BASE/" || true)
            if [ "$code" = "200" ] && [ "$ui" = "200" ] && [ "$index" = "200" ] \
              && grep -q 'RC10_1_SITE_DEEP_ANALYSIS_V1' /tmp/deep.json \
              && grep -q 'ATLAS_RC10_1_DEEP_UI_V2_PRIMARY_4_12H' /tmp/deep-ui.js \
              && grep -q "'apsAnalyze'" /tmp/deep-ui.js \
              && grep -q "primaryHorizon:'4-12H'" /tmp/deep-ui.js \
              && grep -q 'rc10-1-deep-v2-primary-4-12h' /tmp/index.html; then
              python3 - <<'PY'
          import json
          d=json.load(open('/tmp/deep.json'))
          assert d.get('ok') is True, d
          assert d.get('version')=='RC10_1_SITE_DEEP_ANALYSIS_V1', d.get('version')
          assert d.get('live_execution') is False
          assert 'decision_audit' in d
          assert 'entry_plan' in d
          assert 'mtf_states' in d
          print('RC10.1 LIVE V2 OK', d.get('symbol'), d.get('decision'), d.get('technical_score'), d.get('scenario',{}).get('name'))
          PY
              ok=1
              break
            fi
            sleep 10
          done
          if [ "$ok" != "1" ]; then
            echo 'RC10.1 V2 primary 4-12H UI did not become live'
            echo '--- deep endpoint ---'; cat /tmp/deep.json 2>/dev/null || true
            echo '--- ui markers ---'; grep -E 'ATLAS_RC10_1|apsAnalyze|primaryHorizon' /tmp/deep-ui.js 2>/dev/null | head -20 || true
            echo '--- index marker ---'; grep -o 'atlas-deep-analysis-ui.js[^"<]*' /tmp/index.html 2>/dev/null || true
            exit 1
          fi
