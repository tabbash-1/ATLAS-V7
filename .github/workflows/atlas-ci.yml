name: ATLAS CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Python syntax
        run: |
          python -m py_compile collector_server.py cloud_start.py cloud_start_web.py cloud_web_only.py atlas_runtime_server.py atlas_research_runtime_server.py atlas_ai_server.py research_memory_bridge.py research_coverage.py storage_hardening.py trade_outcome_ledger.py trade_outcome_runtime.py trade_path_settlement.py execution_outcome_scope.py execution_risk_management.py prospective_fourth_vote_shadow.py tests/test_ai_validation.py tests/test_research_memory_bridge.py tests/test_research_coverage.py tests/test_storage_hardening.py tests/test_trade_outcome_ledger.py tests/test_trade_path_settlement.py tests/test_execution_outcome_scope.py tests/test_execution_risk_management.py tests/test_prospective_fourth_vote_shadow.py tests/test_production_single_snapshot_authority.py
      - name: JavaScript syntax
        run: |
          set -e
          for f in *.js; do
            node --check "$f"
          done
      - name: ATLAS regression tests
        run: |
          node tests/atlas-ai-trade-geometry.test.js
          python tests/test_ai_validation.py
          PYTHONPATH=. python tests/test_research_memory_bridge.py
          PYTHONPATH=. python tests/test_research_coverage.py
          PYTHONPATH=. python tests/test_storage_hardening.py
          PYTHONPATH=. python tests/test_trade_outcome_ledger.py
          PYTHONPATH=. python tests/test_trade_path_settlement.py
          PYTHONPATH=. python tests/test_execution_outcome_scope.py
          PYTHONPATH=. python tests/test_execution_risk_management.py
          PYTHONPATH=. python tests/test_prospective_fourth_vote_shadow.py
          PYTHONPATH=. python tests/test_production_single_snapshot_authority.py
      - name: Verify delegated production entrypoints
        run: |
          set -euo pipefail
          grep -q 'cloud_start_web.py' Procfile
          grep -q 'cloud_web_only.py' render.yaml
          grep -q 'cloud_web_only.py' Dockerfile
          grep -q 'mountPath: /var/data' render.yaml
          ! grep -q 'OPENAI_API_KEY' render.yaml
          grep -q 'cloud_web_only.py' cloud_start.py
          grep -q 'cloud_start_web.py' cloud_start.py
          grep -q 'ATLAS_CLOUD_FORWARD_ENABLED.*0' cloud_start.py
          grep -q 'ATLAS_WEB_ONLY.*1' cloud_start.py
          grep -q '_install_storage_hardening' cloud_start_web.py
          grep -q '_install_execution_risk_management' cloud_start_web.py
          grep -q '_install_trade_geometry_freezer' cloud_start_web.py
          grep -q '_install_trade_outcome_runtime' cloud_start_web.py
          grep -q 'trade_geometry.jsonl' cloud_start_web.py
          grep -q 'install_scoring(atlas)' cloud_web_only.py
          grep -q 'install_continuation(atlas)' cloud_web_only.py
          grep -q 'install_decision_api(atlas)' cloud_web_only.py
          grep -q 'install_decision_engine(atlas)' cloud_web_only.py
          grep -q 'install_execution_risk(atlas)' cloud_web_only.py
          grep -q 'install_consensus_tiebreak_shadow(atlas)' cloud_web_only.py
          grep -q 'install_fourth_vote_shadow(atlas)' cloud_web_only.py
          grep -q "ATLAS_CLOUD_FORWARD_MIN_SCORE','68'" cloud_web_only.py
          grep -q 'can_override_production.*False' cloud_web_only.py
          grep -q 'live_execution.*False' cloud_web_only.py
          grep -q '/api/research/fourth-vote-shadow' prospective_fourth_vote_shadow.py
          grep -q 'can_override_production.*False' prospective_fourth_vote_shadow.py
          grep -q 'production_threshold_changed.*False' prospective_fourth_vote_shadow.py
      - name: Verify resilient provider chain and safety invariants
        run: |
          grep -q 'KRAKEN_FUTURES_PUBLIC' atlas_runtime_server.py
          grep -q 'futures.kraken.com' atlas_runtime_server.py
          grep -q 'Binance USD-M -> Bybit -> Kraken Futures' atlas_runtime_server.py
          grep -q '/api/runtime/status' atlas_runtime_server.py
          grep -q '/api/production/readiness' atlas_runtime_server.py
          grep -q 'ready_for_live_execution.*False' atlas_runtime_server.py
          grep -q 'request_queue_size=128' atlas_runtime_server.py
          grep -q 'research_memory_bridge.install(atlas)' atlas_runtime_server.py
          grep -q "'research_memory_bridge':RESEARCH_MEMORY_BRIDGE_STATE" atlas_runtime_server.py
          grep -q "'storage_hardening':getattr" atlas_runtime_server.py
          grep -q 'forward_observation_id' research_memory_bridge.py
          grep -q 'EXACT_ID' research_memory_bridge.py
          grep -q 'mirror_deduped' research_memory_bridge.py
          grep -q 'CLOUD_FORWARD_RESEARCH_SAMPLE' atlas_research_runtime_server.py
          grep -q 'CLOUD_FORWARD_SHADOW_DIRECTION_RESEARCH' atlas_research_runtime_server.py
          grep -q 'SHADOW_DIRECTIONAL_PROXY' atlas_research_runtime_server.py
          grep -q "'champion_take': False" atlas_research_runtime_server.py
          grep -q "sample\['champion_take'\] = False" atlas_research_runtime_server.py
          grep -q 'RESEARCH_OBSERVATION_ONLY' atlas_research_runtime_server.py
          grep -q 'CLOUD_FORWARD_MIN_SCORE' atlas_research_runtime_server.py
          grep -q 'min(59.0' atlas_research_runtime_server.py
          grep -q 'choose_research_samples' atlas_research_runtime_server.py
          grep -q 'LEAST_COVERED_OLDEST_FIRST' atlas_research_runtime_server.py
          grep -q 'ATLAS_RESEARCH_COVERAGE_STALE_HOURS' atlas_research_runtime_server.py
          grep -q 'ATLAS_CLOUD_FORWARD_MIN_SCORE.*68' cloud_start_web.py
          grep -q 'ATLAS_ALERT_MIN_SCORE.*82' cloud_start_web.py
          grep -q 'live_execution.*False' collector_server.py
          grep -q 'ATLAS_AI_ANALYSIS_PACKET_V1' atlas-ai-analysis-layer.js
          grep -q 'atlasApplyDecisionGate' atlas-decision-quality.js
          grep -q 'UNAVAILABLE_WITHOUT_FROZEN_STOP_DISTANCE' trade_outcome_ledger.py
          grep -q "default_scope': 'signals'" trade_outcome_runtime.py
          grep -q "scope == 'execution'" trade_outcome_runtime.py
          grep -q '/api/outcomes/path-ledger' trade_outcome_runtime.py
          grep -q 'STRUCTURAL_TP2_PLUS_FROZEN_RR' trade_path_settlement.py
          grep -q '5M_PATH_WITH_1M_SAME_CANDLE_RESOLUTION' trade_path_settlement.py
          grep -q 'MIN_EXECUTION_RR = 1.0' execution_outcome_scope.py
          grep -q 'STRUCTURAL_SUPPORT_RESISTANCE_ACTUAL_RR' execution_risk_management.py
          grep -q 'ATLAS_EXECUTION_RISK_V1_STRUCTURAL_TP1_PROTECT' execution_risk_management.py
          grep -q 'BREAKEVEN_ENTRY' execution_risk_management.py
      - name: Verify product shell single-authority invariants
        run: |
          set -euo pipefail
          grep -q 'atlasProductShell' atlas-product-shell.js
          grep -q "\$('analyzeBtn')?.click" atlas-product-shell.js
          ! grep -q '/api/decision/current' atlas-product-shell.js
          grep -q '/api/ai/council' atlas-product-shell.js
          grep -q 'ATLAS_PRODUCTION_SNAPSHOT_GUARD' atlas-product-shell.js
          grep -q 'acceptedSnapshotOnly:true' atlas-product-shell.js
          grep -q 'staleResponseGuard:true' atlas-production-decision.js
          grep -q 'accept:acceptSnapshot' production-web-autoload.js
          grep -q 'atlas-product-shell.js' theme-toggle.js
          ! grep -q '\.remove(' atlas-product-shell.js
          ! grep -q 'CLOUD_FORWARD_MIN_SCORE' atlas-product-shell.js
          ! grep -q 'ATLAS_ALERT_MIN_SCORE' atlas-product-shell.js
      - name: Free core production runtime, migration and persistence smoke test
        env:
          PORT: '18080'
          ATLAS_DATA_DIR: /tmp/atlas-ci-data
          ATLAS_CLOUD_FORWARD_ENABLED: '0'
        run: |
          # Do not use pipefail here: grep -q may intentionally close a successful
          # curl response early, which makes curl report SIGPIPE/write error 23.
          set -eu
          rm -rf "$ATLAS_DATA_DIR"
          legacy_file=champion_challenger_forward.jsonl
          printf '%s\n' '{"schema":"ATLAS_FORWARD_V1","id":"ci-legacy-seed","captured_at":"2026-01-01T00:00:00+00:00","captured_at_ms":1767225600000,"symbol":"BTCUSDT","direction":"LONG","entry":99,"champion_score":70,"champion_take":true,"challenger_score":70,"challenger_take":true,"challenger_threshold":60,"playbook_all":[],"auto_source":"CI_LEGACY_MIGRATION_TEST","forward_return_pct":{}}' > "$legacy_file"
          start_server() {
            python3 cloud_start.py > /tmp/atlas-server.log 2>&1 &
            pid=$!
            for i in $(seq 1 24); do
              if curl --fail --silent http://127.0.0.1:18080/health >/tmp/atlas-health.json; then
                return 0
              fi
              sleep 0.25
            done
            cat /tmp/atlas-server.log
            return 1
          }
          stop_server() {
            if [ -n "${pid:-}" ]; then
              kill "$pid" 2>/dev/null || true
              wait "$pid" 2>/dev/null || true
              pid=''
            fi
          }
          cleanup() {
            stop_server
            rm -f "$legacy_file"
            cat /tmp/atlas-server.log 2>/dev/null || true
          }
          pid=''
          trap cleanup EXIT

          start_server
          curl --fail --silent http://127.0.0.1:18080/health | grep -q '"status": "ok"'
          curl --fail --silent http://127.0.0.1:18080/api/runtime/status | grep -q '"ok": true'
          curl --fail --silent http://127.0.0.1:18080/api/runtime/status | grep -q '"research_memory_bridge"'
          curl --fail --silent http://127.0.0.1:18080/api/runtime/status | grep -q '"storage_hardening"'
          curl --fail --silent http://127.0.0.1:18080/production-status.html | grep -q 'Research Progress'
          curl --fail --silent http://127.0.0.1:18080/trade-outcomes.html | grep -q 'Trade Outcomes'
          curl --fail --silent 'http://127.0.0.1:18080/api/outcomes/summary?horizon=24&scope=signals' | grep -q 'ATLAS_TRADE_OUTCOME_SUMMARY_V1'
          curl --fail --silent 'http://127.0.0.1:18080/api/outcomes/geometry-status' | grep -q 'ATLAS_TRADE_GEOMETRY_STATUS_V2_EXECUTION_SCOPE'
          curl --fail --silent http://127.0.0.1:18080/api/system/readiness | grep -q '"persistent_data_dir": "/tmp/atlas-ci-data"'
          curl --fail --silent http://127.0.0.1:18080/api/production/readiness | grep -q '"ready_for_live_execution": false'
          test -f "$ATLAS_DATA_DIR/$legacy_file"
          curl --fail --silent http://127.0.0.1:18080/api/data-quality | grep -q '"forward_rows": 1'

          curl --fail --silent \
            -H 'Origin: http://127.0.0.1:18080' \
            -H 'Content-Type: application/json' \
            --data '{"symbol":"BTCUSDT","direction":"LONG","entry":100,"champion_score":56,"final_score":56,"execution_decision":"RESEARCH_OBSERVATION_ONLY","research_sampling_lane":true,"playbook_primary":"SHADOW_DIRECTIONAL_PROXY","auto_source":"CLOUD_FORWARD_CI_BRIDGE_TEST","rr_tp2":2.0,"support_distance_pct":1.0,"resistance_distance_pct":4.0}' \
            http://127.0.0.1:18080/api/forward/observe | grep -q '"schema": "ATLAS_FORWARD_V1"'
          curl --fail --silent http://127.0.0.1:18080/api/data-quality | grep -q '"forward_rows": 2'
          curl --fail --silent 'http://127.0.0.1:18080/api/confluence/memory-stats?symbol=BTCUSDT' | grep -q '"observations": 1'
          curl --fail --silent http://127.0.0.1:18080/api/runtime/status | grep -q '"mirrored": 1'
          grep -q '"forward_observation_id"' "$ATLAS_DATA_DIR/confluence_memory.jsonl"
          test -f "$ATLAS_DATA_DIR/trade_geometry.jsonl"
          grep -q '"stop_loss":99.0' "$ATLAS_DATA_DIR/trade_geometry.jsonl"
          grep -q '"rr_tp2":4.0' "$ATLAS_DATA_DIR/trade_geometry.jsonl"
          grep -q 'STRUCTURAL_SUPPORT_RESISTANCE_ACTUAL_RR' "$ATLAS_DATA_DIR/trade_geometry.jsonl"
          grep -q 'ATLAS_EXECUTION_RISK_V1_STRUCTURAL_TP1_PROTECT' "$ATLAS_DATA_DIR/trade_geometry.jsonl"
          curl --fail --silent 'http://127.0.0.1:18080/api/outcomes/geometry-status' | grep -q '"archive_rows": 1'

          stop_server
          start_server
          curl --fail --silent http://127.0.0.1:18080/api/runtime/status | grep -q '"ok": true'
          curl --fail --silent http://127.0.0.1:18080/api/data-quality | grep -q '"forward_rows": 2'
          curl --fail --silent 'http://127.0.0.1:18080/api/confluence/memory-stats?symbol=BTCUSDT' | grep -q '"observations": 1'
          grep -q '"forward_observation_id"' "$ATLAS_DATA_DIR/confluence_memory.jsonl"
          test -f "$ATLAS_DATA_DIR/trade_geometry.jsonl"
          curl --fail --silent 'http://127.0.0.1:18080/api/outcomes/geometry-status' | grep -q '"archive_rows": 1'