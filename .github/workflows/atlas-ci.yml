name: ATLAS CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Python syntax
        run: |
          python -m py_compile collector_server.py cloud_start.py atlas_ai_server.py tests/test_ai_validation.py
      - name: JavaScript syntax
        run: |
          set -e
          for f in *.js; do
            node --check "$f"
          done
      - name: ATLAS AI regression tests
        run: |
          node tests/atlas-ai-trade-geometry.test.js
          python tests/test_ai_validation.py
      - name: Verify AI deployment entrypoints
        run: |
          grep -q 'cloud_start.py' Procfile
          grep -q 'cloud_start.py' render.yaml
          grep -q 'cloud_start.py' Dockerfile
          grep -q 'OPENAI_API_KEY' render.yaml
          grep -q 'sync: false' render.yaml
      - name: Verify ATLAS AI safety invariants
        run: |
          grep -q '/api/ai/analyze' atlas_ai_server.py
          grep -q '/api/ai/status' atlas_ai_server.py
          grep -q '/api/ai/validation' atlas_ai_server.py
          grep -q '/api/ai/attribution' atlas_ai_server.py
          grep -q 'live_execution.*False' atlas_ai_server.py
          grep -q 'ATLAS_AI_ANALYSIS_PACKET_V1' atlas-ai-analysis-layer.js
          grep -q 'atlasApplyDecisionGate' atlas-decision-quality.js
      - name: Production runtime, migration and persistence smoke test
        env:
          PORT: '18080'
          ATLAS_DATA_DIR: /tmp/atlas-ci-data
          ATLAS_CLOUD_FORWARD_ENABLED: '0'
        run: |
          set -euo pipefail
          rm -rf "$ATLAS_DATA_DIR"
          legacy_file=champion_challenger_forward.jsonl
          printf '%s\n' '{"schema":"ATLAS_FORWARD_V1","id":"ci-legacy-seed","captured_at":"2026-01-01T00:00:00+00:00","captured_at_ms":1767225600000,"symbol":"BTCUSDT","direction":"LONG","entry":99,"champion_score":70,"champion_take":true,"challenger_score":70,"challenger_take":true,"challenger_threshold":60,"playbook_all":[],"auto_source":"CI_LEGACY_MIGRATION_TEST","forward_return_pct":{}}' > "$legacy_file"
          start_server() {
            python3 cloud_start.py > /tmp/atlas-server.log 2>&1 &
            pid=$!
            for i in $(seq 1 20); do
              if curl --fail --silent http://127.0.0.1:18080/health >/tmp/atlas-health.json; then
                return 0
              fi
              sleep 0.25
            done
            cat /tmp/atlas-server.log
            return 1
          }
          stop_server() {
            kill "$pid" 2>/dev/null || true
            wait "$pid" 2>/dev/null || true
          }
          cleanup() {
            stop_server
            rm -f "$legacy_file"
            cat /tmp/atlas-server.log 2>/dev/null || true
          }
          pid=''
          trap cleanup EXIT

          start_server
          curl --fail --silent http://127.0.0.1:18080/health | grep -q '"status": "ok"'
          curl --fail --silent http://127.0.0.1:18080/api/ai/status | grep -q '"provider": "OpenAI Responses API"'
          curl --fail --silent http://127.0.0.1:18080/api/ai/validation | grep -q '"research_only": true'
          curl --fail --silent http://127.0.0.1:18080/api/ai/attribution | grep -q '"live_execution": false'
          curl --fail --silent http://127.0.0.1:18080/api/system/readiness | grep -q '"persistent_data_dir": "/tmp/atlas-ci-data"'
          test -f "$ATLAS_DATA_DIR/$legacy_file"
          curl --fail --silent http://127.0.0.1:18080/api/data-quality | grep -q '"forward_rows": 1'

          curl --fail --silent \
            -H 'Origin: http://127.0.0.1:18080' \
            -H 'Content-Type: application/json' \
            --data '{"symbol":"BTCUSDT","direction":"LONG","entry":100,"champion_score":70,"auto_source":"CI_PERSISTENCE_TEST"}' \
            http://127.0.0.1:18080/api/forward/observe | grep -q '"schema": "ATLAS_FORWARD_V1"'
          curl --fail --silent http://127.0.0.1:18080/api/data-quality | grep -q '"forward_rows": 2'

          stop_server
          start_server
          curl --fail --silent http://127.0.0.1:18080/api/data-quality | grep -q '"forward_rows": 2'
