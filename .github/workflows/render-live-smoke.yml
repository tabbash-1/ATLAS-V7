name: ATLAS Render Live Smoke

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/render-live-smoke.yml'
      - 'cloud_start.py'
      - 'cloud_web_only_final.py'
      - 'final_trade_ready_guard.py'
      - 'production_decision_api.py'
      - 'product_quality_gate_overlay.py'
  workflow_dispatch:

jobs:
  live-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Wait for Render deploy
        run: sleep 90
      - name: Verify health and final runtime authority
        shell: bash
        run: |
          set -euo pipefail
          base='https://atlas-v7.onrender.com'
          curl -fsSL --retry 8 --retry-delay 10 --retry-all-errors --connect-timeout 10 --max-time 30 "$base/health" -o /tmp/health.json
          jq -e '.status == "ok" and .service == "ATLAS_V7" and .live_execution == false' /tmp/health.json >/dev/null
          curl -fsSL --retry 8 --retry-delay 10 --retry-all-errors --connect-timeout 10 --max-time 30 "$base/api/runtime/status" -o /tmp/runtime.json
          jq -e '.ok == true and .runtime == "WEB_ONLY_FINAL" and .product_horizon == "4-12H" and .production_threshold == 68 and .live_execution == false' /tmp/runtime.json >/dev/null
          jq -e '.final_trade_ready_guard.version == "FINAL_TRADE_READY_GUARD_V1_HTF_FAIL_CLOSED" and .final_trade_ready_guard.fail_closed == true and .final_trade_ready_guard.paper_portfolio_authority == "trade_ready"' /tmp/runtime.json >/dev/null
          echo RUNTIME_FINAL_GUARD_OK
      - name: Verify live final decision is fail-closed
        shell: bash
        run: |
          set -euo pipefail
          base='https://atlas-v7.onrender.com'
          for symbol in BTCUSDT BNBUSDT; do
            curl -fsSL --retry 6 --retry-delay 8 --retry-all-errors --connect-timeout 10 --max-time 60 "$base/api/decision/current?symbol=$symbol" -o "/tmp/$symbol.json"
            jq -e '.ok == true and (.trade_ready|type) == "boolean" and .final_trade_gate.version == "FINAL_TRADE_READY_GUARD_V1_HTF_FAIL_CLOSED"' "/tmp/$symbol.json" >/dev/null
            jq -e '
              if .trade_ready == true then
                (.actionable_decision == "LONG" or .actionable_decision == "SHORT")
                and .actionable_decision == .final_trade_gate.direction
                and .final_trade_gate.status == "TRADE_READY"
                and .final_trade_gate.direction_alignment == "ALIGNED"
                and .final_trade_gate.production_signal_qualified == true
                and .final_trade_gate.canonical_geometry_ready == true
              else
                .actionable_decision == "WAIT"
                and .analysis_ready == false
                and .can_execute == false
                and .final_trade_gate.status == "WAIT"
                and (.final_trade_gate.blockers|length) > 0
                and (.trade_plan.analysis_ready == false)
                and (.trade_plan.can_execute == false)
              end
            ' "/tmp/$symbol.json" >/dev/null
            jq '{symbol,actionable_decision,trade_ready,product_direction,direction_alignment,final_trade_gate}' "/tmp/$symbol.json"
          done
          echo LIVE_FINAL_DECISION_FAIL_CLOSED_OK
