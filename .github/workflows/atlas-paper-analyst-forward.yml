name: ATLAS Analyst Forward Evaluation

on:
  push:
    branches: [main]
    paths:
      - 'analyst_output_forward_capture.py'
      - 'paper_portfolio_10k_analyst_output.py'
      - 'analyst_forward_attribution.py'
      - 'atlas_product_readiness_gate.py'
      - 'execution_cost_model.py'
      - 'final_trade_ready_guard.py'
      - 'tests/test_execution_cost_model.py'
      - 'tests/test_final_trade_ready_guard.py'
      - 'status/paper-portfolio-10k-analyst-manifest.json'
      - 'status/paper-portfolio-10k-analyst-t64-manifest.json'
      - '.github/workflows/atlas-paper-analyst-forward.yml'
  schedule:
    - cron: '25 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: atlas-paper-analyst-forward
  cancel-in-progress: true

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Validate unchanged canonical lane and cost model
        run: |
          set -euo pipefail
          python3 -m py_compile analyst_output_forward_capture.py paper_portfolio_10k_analyst_output.py analyst_forward_attribution.py atlas_product_readiness_gate.py execution_cost_model.py final_trade_ready_guard.py
          python3 tests/test_final_trade_ready_guard.py
          python3 - <<'PY'
          import os, runpy
          import paper_portfolio_10k_analyst_output as p
          good={'analyst_output':{'decision':'LONG','analysis_ready':True,'analysis_only':True,'live_execution':False,'entry':100,'stop_loss':98,'take_profit':104,'risk_reward':2,'contract_version':'TEST'}}
          wait={'analyst_output':{'decision':'WAIT','analysis_ready':False,'analysis_only':True,'live_execution':False,'entry':None,'stop_loss':None,'take_profit':None}}
          assert p.eligible(good) and not p.eligible(wait)
          m=p.load_manifest(); assert m['production_threshold']==68 and m['can_change_threshold'] is False
          ns=runpy.run_path('tests/test_execution_cost_model.py')
          class MP:
              def delenv(self,k,raising=True):
                  if k in os.environ: del os.environ[k]
                  elif raising: raise KeyError(k)
          ns['test_unconfigured_fee_fails_closed'](MP())
          for n in ['test_complete_live_cost_contract_can_validate','test_wrong_venue_cannot_validate','test_insufficient_depth_is_not_extrapolated','test_round_trip_cost_to_net_r_uses_frozen_geometry','test_missing_cost_component_fails_closed_for_net_r']:
              ns[n]()
          print('CANONICAL_AND_COST_SELF_TEST_OK')
          PY
      - name: Capture and evaluate official T68 cohort
        env:
          ATLAS_ANALYST_HISTORY: status/history/analyst-output-snapshots.jsonl
        run: |
          set -euo pipefail
          test -z "${ATLAS_EXPERIMENTAL_FINAL_EVIDENCE_PROMOTION:-}"
          test -z "${ATLAS_ANALYST_CAPTURE_FREEZE_CANDIDATE_COSTS:-}"
          python3 analyst_output_forward_capture.py
          python3 paper_portfolio_10k_analyst_output.py
          python3 analyst_forward_attribution.py
          python3 atlas_product_readiness_gate.py
          python3 - <<'PY'
          import json
          x=json.load(open('status/paper-portfolio-10k-analyst-latest.json'))
          r=json.load(open('status/product-readiness-latest.json'))
          assert x['production_threshold_unchanged']==68
          assert x['paper_only'] is True and x['live_execution'] is False and x['can_override_production'] is False
          assert r['production_score_threshold_changed'] is False
          assert r['claim_policy']['may_claim_profitable'] is False
          print('T68_UNCHANGED',x['portfolio'])
          PY
      - name: Commit official evidence
        run: |
          set -euo pipefail
          git config user.name atlas-forward-evidence-bot
          git config user.email atlas-forward-evidence-bot@users.noreply.github.com
          git add status/history/analyst-output-snapshots.jsonl status/history/paper-portfolio-10k-analyst-cohort.jsonl status/paper-portfolio-10k-analyst-latest.json status/paper-portfolio-10k-analyst-integrity.json status/analyst-forward-attribution-latest.json status/product-readiness-latest.json
          git diff --cached --quiet && exit 0
          git commit -m 'chore: update canonical analyst forward evidence [skip ci]'
          git reset --hard HEAD
          git clean -fd
          git pull --rebase origin main
          git push

  collect_threshold_64:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Start isolated canonical T64 runtime
        run: |
          set -euo pipefail
          rm -rf /tmp/atlas-t64 && mkdir -p /tmp/atlas-t64
          env PORT=8765 ATLAS_DATA_DIR=/tmp/atlas-t64 ATLAS_CLOUD_FORWARD_MIN_SCORE=64 ATLAS_CLOUD_FORWARD_ENABLED=0 ATLAS_EXPERIMENTAL_FINAL_EVIDENCE_PROMOTION=1 python3 cloud_web_only_final.py >/tmp/atlas-t64-server.log 2>&1 &
          echo $! >/tmp/atlas-t64-server.pid
          for i in $(seq 1 45); do
            curl -fsS --max-time 10 'http://127.0.0.1:8765/api/decision/current?symbol=BTCUSDT' >/tmp/atlas-t64-probe.json && break
            sleep 2
          done
          test -s /tmp/atlas-t64-probe.json || { cat /tmp/atlas-t64-server.log; exit 1; }
          python3 - <<'PY'
          import json
          x=json.load(open('/tmp/atlas-t64-probe.json')); a=x['analyst_output']; g=x['final_trade_gate']
          assert x['ok'] is True and x['canonical_product_contract']=='analyst_output'
          assert a['horizon']=='4-12H' and float(a['signal_threshold'])==64.0
          assert a['analysis_only'] is True and a['live_execution'] is False
          assert g['experimental_final_evidence_promotion'] is True
          assert g['score_changed'] is False and g['threshold_changed'] is False
          print('T64_CANONICAL_PATH_OK')
          PY
      - name: Capture and evaluate isolated T64 cohort
        env:
          ATLAS_ANALYST_CAPTURE_BASE: http://127.0.0.1:8765
          ATLAS_ANALYST_CAPTURE_OUT: status/history/analyst-output-snapshots-t64.jsonl
          ATLAS_ANALYST_CAPTURE_SCHEMA: ATLAS_ANALYST_OUTPUT_FORWARD_CAPTURE_V2_T64
          ATLAS_ANALYST_CAPTURE_COHORT_LABEL: EVIDENCE_T64
          ATLAS_ANALYST_CAPTURE_FREEZE_CANDIDATE_COSTS: '1'
          ATLAS_EXECUTION_VENUE: OKX_USDT_SWAP
          ATLAS_EXECUTION_TAKER_FEE_BPS: '5'
          ATLAS_EXECUTION_RESEARCH_NOTIONAL_USDT: '1000'
          ATLAS_ANALYST_MANIFEST: status/paper-portfolio-10k-analyst-t64-manifest.json
          ATLAS_ANALYST_HISTORY: status/history/analyst-output-snapshots-t64.jsonl
          ATLAS_ANALYST_COHORT: status/history/paper-portfolio-10k-analyst-t64-cohort.jsonl
          ATLAS_ANALYST_LATEST: status/paper-portfolio-10k-analyst-t64-latest.json
          ATLAS_ANALYST_INTEGRITY: status/paper-portfolio-10k-analyst-t64-integrity.json
          ATLAS_ANALYST_PORTFOLIO_SCHEMA: ATLAS_PAPER_10K_ANALYST_OUTPUT_V2_T64
          ATLAS_ANALYST_ENTRY_SCHEMA: ATLAS_PAPER_10K_ANALYST_ENTRY_V2_T64
          ATLAS_ANALYST_INTEGRITY_SCHEMA: ATLAS_PAPER_10K_ANALYST_INTEGRITY_V2_T64
          ATLAS_ANALYST_COHORT_LABEL: EVIDENCE_T64
        run: |
          set -euo pipefail
          python3 analyst_output_forward_capture.py
          python3 paper_portfolio_10k_analyst_output.py
          python3 - <<'PY'
          import collections, datetime as dt, json, math, time
          from execution_cost_model import cost_bps_to_r
          from offline_production_path_settlement import market_klines, event_from
          history='status/history/analyst-output-snapshots-t64.jsonl'
          latest='status/paper-portfolio-10k-analyst-t64-latest.json'
          rows=[]
          with open(history,encoding='utf-8') as f:
              for line in f:
                  if line.strip(): rows.append(json.loads(line))
          counts=collections.Counter(); blockers=collections.Counter(); candidates=collections.Counter(); scores=[]; recent=[]
          for row in rows:
              for sym,d in (row.get('decisions') or {}).items():
                  a=(d or {}).get('analyst_output') or {}; gate=(d or {}).get('final_trade_gate') or a.get('final_trade_gate') or {}
                  dec=str(a.get('decision') or 'MISSING').upper(); counts[dec]+=1
                  cand=str((d or {}).get('candidate_direction') or gate.get('candidate_direction') or 'NONE').upper(); candidates[cand]+=1
                  sc=(d or {}).get('score')
                  try: sc=float(sc); scores.append((sc,sym,cand,row.get('captured_at'),gate.get('primary_blocker')))
                  except Exception: pass
                  for b in (gate.get('blockers') or []): blockers[str(b)]+=1
                  recent.append({'captured_at':row.get('captured_at'),'symbol':sym,'analyst_decision':dec,'candidate_direction':cand,'score':sc if isinstance(sc,(int,float)) else (d or {}).get('score'),'threshold':(d or {}).get('signal_threshold'),'final_gate_primary_blocker':gate.get('primary_blocker'),'final_gate_blockers':gate.get('blockers') or [],'product_direction':gate.get('product_direction'),'entry_confirmation_direction':gate.get('entry_confirmation_direction'),'direction_alignment':gate.get('direction_alignment'),'production_signal_qualified':gate.get('production_signal_qualified'),'canonical_geometry_ready':gate.get('canonical_geometry_ready'),'stale_pre_final_wait_bypassed':gate.get('stale_pre_final_wait_bypassed'),'candidate_cost_validated':((d or {}).get('candidate_execution_cost_snapshot') or {}).get('validated')})

          def n(v):
              try:
                  x=float(v); return x if math.isfinite(x) else None
              except Exception:return None
          def candidate_short_geometry(d):
              a=(d or {}).get('analyst_output') or {}; p=a.get('candidate_plan') or {}
              direction=str(p.get('direction') or '').upper(); entry=n(p.get('entry')); stop=n(p.get('stop_loss')); tp=n(p.get('take_profit') or p.get('tp2'))
              if direction!='SHORT' or None in (entry,stop,tp) or not (stop>entry>tp): return None
              risk=stop-entry
              if risk<=0:return None
              return {'direction':'SHORT','entry':entry,'stop_loss':stop,'tp1':n(p.get('tp1')) or entry-risk,'tp2':tp,'rr_tp2':n(p.get('risk_reward')) or (entry-tp)/risk,'risk_abs':risk}
          def direction_state(gate):
              pd=str(gate.get('product_direction') or '').upper(); align=str(gate.get('direction_alignment') or '').upper(); bs=set(gate.get('blockers') or [])
              if pd=='SHORT' and align=='ALIGNED': return 'ALIGNED'
              if pd=='LONG' or align=='OPPOSED' or 'SCORE_DIRECTION_NOT_HTF_DIRECTION' in bs: return 'OPPOSED'
              if not pd or 'HTF_PRODUCT_DIRECTION_UNRESOLVED' in bs: return 'UNRESOLVED'
              return 'OTHER'
          def build_episodes(qualified_only):
              eps=[]; active={}
              for row in rows:
                  ts=row.get('captured_at')
                  try:t=dt.datetime.fromisoformat(str(ts).replace('Z','+00:00'))
                  except Exception:continue
                  if t.tzinfo is None:t=t.replace(tzinfo=dt.timezone.utc)
                  for sym,d in (row.get('decisions') or {}).items():
                      a=(d or {}).get('analyst_output') or {}; gate=(d or {}).get('final_trade_gate') or a.get('final_trade_gate') or {}
                      cand=str((d or {}).get('candidate_direction') or gate.get('candidate_direction') or 'NONE').upper(); g=candidate_short_geometry(d); sc=n((d or {}).get('score') or a.get('confidence'))
                      is_short=(cand=='SHORT' and g is not None)
                      if qualified_only: is_short=is_short and sc is not None and sc>=64 and gate.get('production_signal_qualified') is True
                      if not is_short:
                          active.pop(sym,None); continue
                      ep=active.get(sym)
                      if ep is None:
                          frozen_cost=(d or {}).get('candidate_execution_cost_snapshot') or None
                          ep={'symbol':sym,'started_at':t.isoformat(),'started_at_ms':int(t.timestamp()*1000),'geometry':g,'initial_decision':str(a.get('decision') or 'WAIT').upper(),'initial_blockers':list(gate.get('blockers') or []),'initial_primary_blocker':gate.get('primary_blocker'),'initial_score':sc,'initial_direction_state':direction_state(gate),'initial_product_direction':gate.get('product_direction'),'initial_direction_alignment':gate.get('direction_alignment'),'initial_entry_confirmation_direction':gate.get('entry_confirmation_direction'),'entry_cost_snapshot':frozen_cost,'observations':0,'accepted_at':None,'accepted_delay_minutes':None,'max_score':None}
                          eps.append(ep); active[sym]=ep
                      ep['observations']+=1
                      if sc is not None: ep['max_score']=sc if ep['max_score'] is None else max(ep['max_score'],sc)
                      if ep['accepted_at'] is None and str(a.get('decision') or '').upper()=='SHORT' and not (gate.get('blockers') or []):
                          ep['accepted_at']=t.isoformat(); ep['accepted_delay_minutes']=round((t-dt.datetime.fromisoformat(ep['started_at'])).total_seconds()/60,1)
              return eps
          def attach_outcomes(eps):
              now_ms=int(time.time()*1000)
              for ep in eps:
                  ep['ever_accepted']=ep['accepted_at'] is not None; ep['outcomes']={}
                  for h in (4,8,12):
                      end=ep['started_at_ms']+h*3600_000
                      if now_ms<end:
                          ep['outcomes'][f'{h}h']={'matured':False,'r_multiple':None,'status':'NOT_MATURED'}; continue
                      try:
                          candles,provider=market_klines(ep['symbol'],'5',ep['started_at_ms'],end)
                          if not candles: raise RuntimeError('no_5m_candles')
                          ev,c,_=event_from(candles,ep['geometry'])
                          if ev=='SL':r=-1.0; status='SL'
                          elif ev=='TP2':r=float(ep['geometry']['rr_tp2']); status='TP2'
                          elif ev=='AMBIGUOUS':r=None; status='AMBIGUOUS'
                          else:
                              last=float(candles[-1]['close']); r=(ep['geometry']['entry']-last)/ep['geometry']['risk_abs']; status='MARK_TO_MARKET'
                          ep['outcomes'][f'{h}h']={'matured':True,'r_multiple':None if r is None else round(r,4),'status':status,'positive':None if r is None else r>0,'market_source':provider}
                      except Exception as exc:
                          ep['outcomes'][f'{h}h']={'matured':True,'r_multiple':None,'status':'MARKET_DATA_ERROR','error':str(exc)[:300]}
          def summarize(items,h):
              vals=[e['outcomes'][f'{h}h']['r_multiple'] for e in items if e['outcomes'][f'{h}h'].get('matured') and e['outcomes'][f'{h}h'].get('r_multiple') is not None]
              return {'episodes':len(items),'matured':len(vals),'avg_r':round(sum(vals)/len(vals),4) if vals else None,'positive_pct':round(sum(v>0 for v in vals)/len(vals)*100,1) if vals else None,'tp2_hits':sum(e['outcomes'][f'{h}h'].get('status')=='TP2' for e in items if e['outcomes'][f'{h}h'].get('matured')),'sl_hits':sum(e['outcomes'][f'{h}h'].get('status')=='SL' for e in items if e['outcomes'][f'{h}h'].get('matured'))}
          def cost_summary(items,h):
              matured=[e for e in items if e['outcomes'][f'{h}h'].get('matured') and e['outcomes'][f'{h}h'].get('r_multiple') is not None]
              exact=[]
              for e in matured:
                  snap=e.get('entry_cost_snapshot') or {}; rt=n(snap.get('round_trip_cost_bps'))
                  if snap.get('validated') is True and rt is not None:
                      cr=cost_bps_to_r(rt,entry=e['geometry']['entry'],risk_abs=e['geometry']['risk_abs'])
                      exact.append(e['outcomes'][f'{h}h']['r_multiple']-cr)
              sensitivity={}
              for bps in (10,12,16,20):
                  vals=[]
                  for e in matured:
                      cr=cost_bps_to_r(bps,entry=e['geometry']['entry'],risk_abs=e['geometry']['risk_abs'])
                      vals.append(e['outcomes'][f'{h}h']['r_multiple']-cr)
                  sensitivity[f'{bps}bps_round_trip']={'n':len(vals),'avg_net_r':round(sum(vals)/len(vals),4) if vals else None,'positive_pct':round(sum(v>0 for v in vals)/len(vals)*100,1) if vals else None}
              all_valid=bool(matured) and len(exact)==len(matured)
              minimum_sample_met=len(matured)>=30
              return {'matured':len(matured),'exact_cost_validated':len(exact),'all_matured_have_frozen_validated_cost':all_valid,'exact_avg_net_r':round(sum(exact)/len(exact),4) if exact else None,'minimum_matured_sample_required':30,'minimum_sample_met':minimum_sample_met,'exact_net_edge_evaluable':bool(all_valid and minimum_sample_met),'missing_frozen_cost_fail_closed':len(exact)!=len(matured),'sensitivity_only_not_validated_net':sensitivity}
          def score_band(score):
              if score is None:return 'UNKNOWN'
              if score<=67:return '64_67'
              if score<69:return '68'
              if score<=71:return '69_71'
              return '72_PLUS'
          def evidence_bundle(items):
              return {f'{h}h':{'gross':summarize(items,h),'cost':cost_summary(items,h)} for h in (4,8,12)}

          episodes=build_episodes(False); attach_outcomes(episodes)
          accepted=[e for e in episodes if e['ever_accepted']]; rejected=[e for e in episodes if not e['ever_accepted']]
          blocker_groups={}
          for b in sorted({b for e in rejected for b in e['initial_blockers']}):
              group=[e for e in rejected if b in e['initial_blockers']]
              blocker_groups[b]={f'{h}h':summarize(group,h) for h in (4,8,12)}
          episode_report={'schema':'ATLAS_T64_SHORT_EPISODE_EVIDENCE_V1','observational_only':True,'included_in_paper_pnl':False,'independence_rule':'ONE_CONTINUOUS_CANDIDATE_SHORT_RUN_PER_SYMBOL_IS_ONE_EPISODE','candidate_short_observations':candidates.get('SHORT',0),'independent_short_episodes':len(episodes),'ever_accepted_episodes':len(accepted),'never_accepted_episodes':len(rejected),'accepted':{f'{h}h':summarize(accepted,h) for h in (4,8,12)},'rejected':{f'{h}h':summarize(rejected,h) for h in (4,8,12)},'rejected_by_initial_blocker_nonexclusive':blocker_groups,'episodes':episodes}

          qualified=build_episodes(True); attach_outcomes(qualified)
          qgroups={state:[e for e in qualified if e['initial_direction_state']==state] for state in ('ALIGNED','UNRESOLVED','OPPOSED','OTHER')}
          unresolved=qgroups['UNRESOLVED']
          bands={b:[e for e in unresolved if score_band(e.get('initial_score'))==b] for b in ('64_67','68','69_71','72_PLUS')}
          sweeps={f'GTE_{cut}':[e for e in unresolved if (e.get('initial_score') or -1)>=cut] for cut in (68,69,70,72)}
          qreport={'schema':'ATLAS_T64_QUALIFIED_SHORT_TRANSITION_EVIDENCE_V2_SCORE_NET','observational_only':True,'included_in_paper_pnl':False,'can_override_production':False,'qualification_rule':'CANDIDATE_SHORT_AND_SCORE_GTE_64_AND_PRODUCTION_SIGNAL_QUALIFIED_AND_VALID_CANDIDATE_GEOMETRY','independence_rule':'ONE_CONTINUOUS_QUALIFIED_SHORT_RUN_PER_SYMBOL_IS_ONE_EPISODE','qualified_short_episodes':len(qualified),'by_initial_htf_state':{state:{f'{h}h':summarize(group,h) for h in (4,8,12)} for state,group in qgroups.items()},'unresolved_score_bands':{b:evidence_bundle(group) for b,group in bands.items()},'unresolved_threshold_sweep':{k:evidence_bundle(group) for k,group in sweeps.items()},'net_cost_policy':{'exact_net_requires_entry_time_frozen_validated_l2_cost':True,'retroactive_missing_cost':'FAIL_CLOSED_NO_EXACT_NET_CLAIM','sensitivity_round_trip_bps':[10,12,16,20],'sensitivity_role':'ROBUSTNESS_ONLY_NOT_VALIDATED_NET','minimum_matured_sample_required':30},'episodes':qualified}

          x=json.load(open(latest))
          x['decision_diagnostics']={'snapshot_rows':len(rows),'symbol_observations':sum(counts.values()),'analyst_decisions':dict(counts),'candidate_directions':dict(candidates),'final_gate_blockers':dict(blockers),'score_max':max((s[0] for s in scores),default=None),'score_ge_64':sum(s[0]>=64 for s in scores),'top_scores':[{'score':s,'symbol':sym,'candidate_direction':cand,'captured_at':ts,'primary_blocker':pb} for s,sym,cand,ts,pb in sorted(scores,reverse=True)[:20]],'recent_observations':recent[-32:]}
          x['candidate_short_episode_evidence']=episode_report
          x['qualified_short_transition_evidence']=qreport
          with open(latest,'w',encoding='utf-8') as f: json.dump(x,f,indent=2,sort_keys=True)
          m=json.load(open('status/paper-portfolio-10k-analyst-t64-manifest.json'))
          assert m['manifest_hash']=='2d31a2147e6ff87426cd2b5ea7725ec57fbfa12314e5d32e24599d318ce529e1'
          assert m['production_threshold']==68 and m['experimental_threshold']==64 and m['production_eligible'] is False
          assert x['manifest_hash']==m['manifest_hash'] and x['experimental_threshold']==64
          assert x['production_threshold_unchanged']==68 and x['production_eligible'] is False
          assert x['cost_adjusted']['minimum_matured_sample_required']==30
          assert x['candidate_short_episode_evidence']['included_in_paper_pnl'] is False
          assert x['qualified_short_transition_evidence']['included_in_paper_pnl'] is False
          assert x['qualified_short_transition_evidence']['can_override_production'] is False
          assert x['qualified_short_transition_evidence']['net_cost_policy']['retroactive_missing_cost']=='FAIL_CLOSED_NO_EXACT_NET_CLAIM'
          assert all(not v[f'{h}h']['cost']['exact_net_edge_evaluable'] for v in x['qualified_short_transition_evidence']['unresolved_score_bands'].values() for h in (4,8,12) if v[f'{h}h']['cost']['matured']<30)
          for t in x['trades']:
              assert t['manifest_hash']==m['manifest_hash']
              assert 'execution_cost_snapshot' in t
          print('T64_DIAGNOSTICS',json.dumps(x['decision_diagnostics'],sort_keys=True))
          print('T64_SHORT_EPISODES',json.dumps(episode_report,sort_keys=True))
          print('T64_QUALIFIED_SHORT_TRANSITIONS',json.dumps(qreport,sort_keys=True))
          print('T64_EVIDENCE',{'portfolio':x['portfolio'],'cost_adjusted':x['cost_adjusted']})
          PY
      - name: Commit isolated T64 evidence
        run: |
          set -euo pipefail
          kill "$(cat /tmp/atlas-t64-server.pid)" 2>/dev/null || true
          git config user.name atlas-forward-evidence-bot
          git config user.email atlas-forward-evidence-bot@users.noreply.github.com
          git add status/history/analyst-output-snapshots-t64.jsonl status/history/paper-portfolio-10k-analyst-t64-cohort.jsonl status/paper-portfolio-10k-analyst-t64-latest.json status/paper-portfolio-10k-analyst-t64-integrity.json
          git diff --cached --quiet && exit 0
          git commit -m 'chore: update isolated threshold-64 net evidence [skip ci]'
          git reset --hard HEAD
          git clean -fd
          git pull --rebase origin main
          git push
