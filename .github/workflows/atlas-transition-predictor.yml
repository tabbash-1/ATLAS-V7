name: ATLAS Transition Predictor Exam
on:
  pull_request:
    paths: ['profitability_transition_predictor.py','profitability_transition_predictor_eval.py','tests/test_profitability_transition_predictor.py','.github/workflows/atlas-transition-predictor.yml']
  workflow_dispatch:
jobs:
  exam:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m py_compile profitability_transition_predictor.py profitability_transition_predictor_eval.py
      - run: PYTHONPATH=. python -c "import tests.test_profitability_transition_predictor as t; t.test_probability_and_safety(); print('TRANSITION_CONTRACT_OK')"
      - run: python profitability_transition_predictor_eval.py
