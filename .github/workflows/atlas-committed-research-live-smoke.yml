name: ATLAS Committed Research Live Smoke

on:
  push:
    branches: [main]
    paths:
      - 'cloud_web_only.py'
      - 'committed_research_api.py'
      - 'render_boot_patch.py'
      - 'atlas-research-validation-ui.js'
      - 'atlas-paper-portfolio-ui.js'
      - 'status/offline-forward-evaluation-latest.json'
      - 'status/forward-robustness-guardrails-latest.json'
      - 'status/prospective-direction-guardrail-latest.json'
      - 'status/paper-portfolio-10k-analyst-latest.json'
      - '.github/workflows/atlas-committed-research-live-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: atlas-committed-research-live-smoke
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BASE_URL: https://atlas-v7.onrender.com
    steps:
      - uses: actions/checkout@v4
      - name: Wait for Render and verify cached research endpoints and UI isolation
        run: |
          set -euo pipefail
          declare -A expected
          expected[/api/research/offline-forward-evaluation]='ATLAS_OFFLINE_FORWARD_EVALUATION_V3_ROBUSTNESS'
          expected[/api/research/forward-robustness-guardrails]='ATLAS_FORWARD_ROBUSTNESS_GUARDRAILS_V1_SHADOW_ONLY'
          expected[/api/research/prospective-direction-guardrail]='ATLAS_PROSPECTIVE_DIRECTION_GUARDRAIL_V1_4H'
          for path in "${!expected[@]}"; do
            schema="${expected[$path]}"
            tmp="$(mktemp)"; ok=0
            for attempt in $(seq 1 30); do
              code="$(curl -L --connect-timeout 20 --max-time 60 -sS -w '%{http_code}' -o "$tmp" "${BASE_URL}${path}" || true)"
              if [[ "$code" =~ ^2 ]] && jq -e --arg s "$schema" '
                .ok == true and .schema == $s and .cached_only == true and
                .served_from == "COMMITTED_GITHUB_ACTIONS_REPORT" and
                .web_process_refresh_triggered == false and .request_time_outcome_read == false and
                .request_time_market_fetch == false and .web_process_background_worker == false and
                .research_only == true and .live_execution == false and .can_override_production == false
              ' "$tmp" >/dev/null 2>&1; then
                echo "PASS ${path} schema=${schema}"; ok=1; break
              fi
              echo "Waiting for ${path} attempt ${attempt}/30 HTTP=${code:-none}"; sleep 12
            done
            if [[ "$ok" != "1" ]]; then echo "FAILED ${path}" >&2; cat "$tmp" >&2 || true; exit 1; fi
          done

          paper="$(mktemp)"; paper_ok=0
          for attempt in $(seq 1 30); do
            code="$(curl -L --connect-timeout 20 --max-time 60 -sS -w '%{http_code}' -o "$paper" "${BASE_URL}/api/research/paper-portfolio-10k?t=$(date +%s)" || true)"
            if [[ "$code" =~ ^2 ]] && jq -e '
              .ok == true and .schema == "ATLAS_PAPER_10K_ANALYST_OUTPUT_V1" and
              .canonical_contract == "analyst_output" and .product_horizon == "4-12H" and
              .paper_only == true and .live_execution == false and .can_override_production == false and
              .portfolio.starting_equity_usd == 10000 and
              (.portfolio.entries|numbers) and (.portfolio.closed|numbers) and
              .portfolio.entries >= .portfolio.closed
            ' "$paper" >/dev/null 2>&1; then paper_ok=1; break; fi
            echo "Waiting for canonical paper portfolio attempt ${attempt}/30 HTTP=${code:-none}"; sleep 12
          done
          if [[ "$paper_ok" != "1" ]]; then echo 'FAILED canonical analyst paper portfolio' >&2; cat "$paper" >&2 || true; exit 1; fi
          echo 'PASS canonical analyst_output $10K paper portfolio'

          mode="$(mktemp)"
          curl -L --connect-timeout 20 --max-time 60 -fsS "${BASE_URL}/api/web-mode" -o "$mode"
          jq -e '.ok == true and .background_workers == false and .cloud_forward_in_web_process == false and .production_threshold == 68 and .committed_research_api.cached_only == true and .committed_research_api.background_workers == false' "$mode" >/dev/null
          echo 'PASS web safe-mode contract'

          page="$(mktemp)"; ui="$(mktemp)"; ui_ok=0
          for attempt in $(seq 1 30); do
            page_code="$(curl -L --connect-timeout 20 --max-time 60 -sS -w '%{http_code}' -o "$page" "${BASE_URL}/" || true)"
            ui_code="$(curl -L --connect-timeout 20 --max-time 60 -sS -w '%{http_code}' -o "$ui" "${BASE_URL}/atlas-research-validation-ui.js?v=research-validation-v1" || true)"
            if [[ "$page_code" =~ ^2 ]] && [[ "$ui_code" =~ ^2 ]] && \
               grep -q 'atlas-research-validation-ui.js?v=research-validation-v1' "$page" && \
               grep -q "ATLAS_RESEARCH_VALIDATION_UI_V1" "$ui" && \
               grep -q "can_override_production:false" "$ui" && \
               grep -q "can_change_threshold:false" "$ui"; then
              ui_ok=1; break
            fi
            echo "Waiting for live research UI attempt ${attempt}/30 root=${page_code:-none} js=${ui_code:-none}"; sleep 12
          done
          if [[ "$ui_ok" != "1" ]]; then
            echo 'FAILED live research validation UI contract' >&2
            grep -o 'atlas-research-validation-ui[^<]*' "$page" >&2 || true
            exit 1
          fi
          echo 'PASS live Research Validation UI isolation contract'