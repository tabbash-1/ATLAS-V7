name: ATLAS Cloud Forward Diagnostics Snapshot

on:
  push:
    branches: [main]
    paths:
      - 'cloud_forward_diagnostics_runtime.py'
      - 'forward_microstructure_freeze_runtime.py'
      - 'render.yaml'
      - '.github/workflows/atlas-cloud-forward-diagnostics-snapshot.yml'
  schedule:
    - cron: '12,57 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: atlas-cloud-forward-diagnostics-snapshot
  cancel-in-progress: true

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      BASE_URL: https://atlas-v7.onrender.com
    steps:
      - uses: actions/checkout@v4
      - name: Fetch deployed cloud forward diagnostics
        run: |
          set -euo pipefail
          mkdir -p status/history
          webmode="$(mktemp)"
          webcode="$(curl -L --connect-timeout 20 --max-time 60 -sS -w '%{http_code}' -o "$webmode" "${BASE_URL}/api/web-mode" || true)"
          if [[ "$webcode" =~ ^2 ]] && jq -e '.ok == true and .background_workers == false and .cloud_forward_in_web_process == false and .research_execution_location == "GITHUB_ACTIONS"' "$webmode" >/dev/null 2>&1; then
            echo "Render is intentionally WEB-ONLY; Cloud Forward scheduled research runs in GitHub Actions. No Render cloud-forward snapshot is expected."
            exit 0
          fi
          tmp="status/cloud-forward-diagnostics-latest.json.tmp"
          ok=0
          for attempt in $(seq 1 28); do
            code="$(curl -L --connect-timeout 20 --max-time 60 -sS -w '%{http_code}' -o "$tmp" "${BASE_URL}/api/research/cloud-forward-diagnostics" || true)"
            if [[ "$code" =~ ^2 ]] && jq -e . "$tmp" >/dev/null 2>&1 && \
               jq -e '.version == "ATLAS_CLOUD_FORWARD_DIAGNOSTICS_V1_OBSERVATIONAL_ONLY" and .cached_only == true and .market_call_triggered_by_request == false and .archive_read_triggered_by_request == false and .outcome_read_triggered_by_request == false and .research_only == true and .live_execution == false and .can_override_production == false and .diagnostics.extra_market_calls == false and .diagnostics.threshold_changes == false and (.diagnostics.cycles_observed // 0) >= 1 and .cloud_forward.interval_seconds == 3000 and .cloud_forward.min_score == 68 and .cloud_forward.max_per_cycle == 3' "$tmp" >/dev/null 2>&1; then
              ok=1
              break
            fi
            echo "Waiting for cloud-forward diagnostics cycle (attempt ${attempt}/28, HTTP ${code:-none})"
            sleep 15
          done
          if [[ "$ok" != "1" ]]; then
            echo "Cloud Forward diagnostics did not become live within deployment grace period." >&2
            echo "Last HTTP code: ${code:-none}" >&2
            cat "$tmp" >&2 || true
            exit 1
          fi
          mv "$tmp" status/cloud-forward-diagnostics-latest.json
          python3 - <<'PY'
          import datetime,json,pathlib
          p=pathlib.Path('status/cloud-forward-diagnostics-latest.json')
          row=json.loads(p.read_text())
          row['_snapshot_captured_at']=datetime.datetime.now(datetime.timezone.utc).isoformat()
          p.write_text(json.dumps(row,indent=2,sort_keys=True))
          h=pathlib.Path('status/history/cloud-forward-diagnostics-snapshots.jsonl')
          with h.open('a') as f:f.write(json.dumps(row,separators=(',',':'))+'\n')
          PY
      - name: Commit diagnostics snapshot
        run: |
          git config user.name "atlas-cloud-forward-diagnostics-monitor"
          git config user.email "atlas-cloud-forward-diagnostics-monitor@users.noreply.github.com"
          git add status/cloud-forward-diagnostics-latest.json status/history/cloud-forward-diagnostics-snapshots.jsonl 2>/dev/null || true
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore: update cloud forward diagnostics snapshot [skip ci]"
          git pull --rebase origin main
          git push