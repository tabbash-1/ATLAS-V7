name: ATLAS Challenger Forward Contract

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/atlas-challenger-shadow.yml'
      - '.github/workflows/atlas-challenger-forward-contract.yml'
      - 'test_challenger_workflow_contract.py'

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m py_compile test_challenger_workflow_contract.py
      - run: |
          python - <<'PY'
          import test_challenger_workflow_contract as t
          t.test_challenger_workflow_runs_forward_measurement_without_write_access()
          print('Challenger forward workflow contract: ok')
          PY
