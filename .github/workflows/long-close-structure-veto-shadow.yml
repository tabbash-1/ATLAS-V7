name: ATLAS Long Close Structure Veto Shadow

on:
  push:
    branches: [main]
    paths:
      - long_close_structure_veto_shadow.py
      - fourth_vote_demotion_shadow.py
      - qualified_false_confidence_audit.py
      - tests/test_long_close_structure_veto_shadow.py
      - .github/workflows/long-close-structure-veto-shadow.yml
      - status/history/production-snapshots.jsonl
  workflow_dispatch:

permissions:
  contents: write

jobs:
  shadow:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Syntax and regression test
        run: |
          python -m py_compile long_close_structure_veto_shadow.py tests/test_long_close_structure_veto_shadow.py
          PYTHONPATH=. python tests/test_long_close_structure_veto_shadow.py
      - name: Run isolated interaction replay
        run: python long_close_structure_veto_shadow.py
      - name: Persist report
        run: |
          if [ -n "$(git status --porcelain -- status/long-close-structure-veto-shadow.json)" ]; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add status/long-close-structure-veto-shadow.json
            git commit -m 'data: refresh long close structure veto shadow'
            git push
          else
            echo 'No report change to persist.'
          fi
