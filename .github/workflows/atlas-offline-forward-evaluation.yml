name: ATLAS Offline Forward Evaluation

on:
  push:
    branches: [main]
    paths:
      - 'canonical_decision_contract.py'
      - 'offline_forward_evaluation.py'
      - 'forward_robustness_guardrails.py'
      - 'status/history/production-snapshots.jsonl'
      - '.github/workflows/atlas-offline-forward-evaluation.yml'
  schedule:
    - cron: '15,35,55 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: atlas-offline-forward-evaluation
  cancel-in-progress: true

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build canonical offline forward evaluation and shadow guardrails
        run: |
          set -euo pipefail
          python3 -m py_compile canonical_decision_contract.py offline_forward_evaluation.py forward_robustness_guardrails.py
          python3 offline_forward_evaluation.py --history status/history/production-snapshots.jsonl --output status/offline-forward-evaluation-latest.json
          python3 forward_robustness_guardrails.py --input status/offline-forward-evaluation-latest.json --output status/forward-robustness-guardrails-latest.json
          python3 - <<'PY'
          import json
          x=json.load(open('status/offline-forward-evaluation-latest.json'))
          g=json.load(open('status/forward-robustness-guardrails-latest.json'))
          assert x['schema']=='ATLAS_OFFLINE_FORWARD_EVALUATION_V4_CANONICAL_TRUTH'
          assert x['research_only'] is True and x['live_execution'] is False
          assert x['can_override_production'] is False and x['production_threshold_changed'] is False
          assert x['decision_source_of_truth']=='FINAL_TRADE_GATE'
          assert x['evaluation_horizons_h']==[4,8,12]
          assert len(x['trade_ready_chronological_folds']) == 3
          assert g['schema']=='ATLAS_FORWARD_ROBUSTNESS_GUARDRAILS_V2_CANONICAL_TRUTH'
          assert g['research_only'] is True and g['shadow_only'] is True
          assert g['can_override_production'] is False and g['can_change_threshold'] is False
          assert g['decision_source_of_truth']=='FINAL_TRADE_GATE'
          print('TRADE_READY_4H',json.dumps(x['trade_ready']['4'],sort_keys=True))
          print('TRADE_READY_8H',json.dumps(x['trade_ready']['8'],sort_keys=True))
          print('TRADE_READY_12H',json.dumps(x['trade_ready']['12'],sort_keys=True))
          print('TRADE_READY_BY_DIRECTION',json.dumps(x['trade_ready_by_direction'],sort_keys=True))
          print('CHRONOLOGICAL_FOLDS',json.dumps(x['trade_ready_chronological_folds'],sort_keys=True))
          print('SHADOW_GUARDRAILS',json.dumps(g,sort_keys=True))
          print('SOURCE',json.dumps(x['source'],sort_keys=True))
          PY
      - name: Commit research reports only when data changed
        run: |
          git config user.name 'atlas-offline-research-bot'
          git config user.email 'atlas-offline-research-bot@users.noreply.github.com'
          git add status/offline-forward-evaluation-latest.json status/forward-robustness-guardrails-latest.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'chore: update canonical offline forward research [skip ci]'
          git pull --rebase origin main
          git push
