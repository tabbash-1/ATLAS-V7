name: ATLAS V6 12h Overlay Robustness
on:
  push:
    branches: [main]
    paths:
      - 'v6_12h_overlay_robustness.py'
      - 'v6_shadow_replay.py'
      - 'status/wait-outcomes.json'
      - '.github/workflows/v6-12h-overlay-robustness.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  evaluate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Evaluate frozen Candidate C as 12h-only overlay
        run: python v6_12h_overlay_robustness.py
      - name: Guard Production
        run: |
          python - <<'PY'
          import json
          p=json.load(open('status/v6-12h-overlay-robustness.json'))
          g=p['guardrails']
          assert g['research_only'] is True
          assert g['production_threshold_changed'] is False
          assert g['production_score_changed'] is False
          assert g['auto_promotion_enabled'] is False
          assert g['candidate_formula_changed'] is False
          print('guardrails: ok')
          PY
      - name: Commit report
        run: |
          if [ -z "$(git status --porcelain -- status/v6-12h-overlay-robustness.json)" ]; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add status/v6-12h-overlay-robustness.json
          git commit -m 'data: refresh V6 12h overlay robustness'
          git push
