name: ATLAS Evolution Scorecard

on:
  pull_request:
    branches: [main]
    paths:
      - 'evolution_scorecard.py'
      - 'tests/test_evolution_scorecard.py'
      - '.github/workflows/atlas-evolution-scorecard.yml'
  push:
    branches: [main]
    paths:
      - 'evolution_scorecard.py'
      - 'tests/test_evolution_scorecard.py'
      - 'status/paper-portfolio-10k-latest.json'
      - 'status/canonical-outcomes-latest.json'
      - 'status/analyst-forward-attribution-latest.json'
      - '.github/workflows/atlas-evolution-scorecard.yml'
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: atlas-evolution-scorecard-${{ github.ref }}
  cancel-in-progress: false

jobs:
  scorecard:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Regression tests
        run: |
          set -euo pipefail
          python -m py_compile evolution_scorecard.py tests/test_evolution_scorecard.py
          PYTHONPATH=. python tests/test_evolution_scorecard.py
      - name: Build scorecard
        run: |
          set -euo pipefail
          python evolution_scorecard.py
          jq -e '.schema == "ATLAS_EVOLUTION_SCORECARD_V1"' status/atlas-evolution-scorecard-latest.json >/dev/null
          jq -e '.decision_source_of_truth == "FINAL_TRADE_GATE"' status/atlas-evolution-scorecard-latest.json >/dev/null
          jq -e '.production_threshold_unchanged == 68' status/atlas-evolution-scorecard-latest.json >/dev/null
          jq -e '.paper_only == true and .live_execution == false' status/atlas-evolution-scorecard-latest.json >/dev/null
          jq -e '.integrity.unique_decision_ids == true' status/atlas-evolution-scorecard-latest.json >/dev/null
          jq -e '.integrity.historical_or_shadow_in_official_kpi == false' status/atlas-evolution-scorecard-latest.json >/dev/null
          jq -e '.integrity.direction_entries_sum == .canonical_forward_performance.entries' status/atlas-evolution-scorecard-latest.json >/dev/null
      - name: Commit scorecard evidence
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          git config user.name "atlas-evolution-scorecard"
          git config user.email "atlas-scorecard@users.noreply.github.com"
          git add status/atlas-evolution-scorecard-latest.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "evidence: update ATLAS evolution scorecard [skip ci]"
          git pull --rebase origin main
          git push
