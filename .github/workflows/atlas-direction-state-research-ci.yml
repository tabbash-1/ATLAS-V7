name: ATLAS Direction State Research CI
on:
  pull_request:
    paths:
      - 'supabase_early_transition_research.py'
      - 'supabase_early_transition_prospective.py'
      - 'market_breadth_exhaustion_research.py'
      - 'breadth_reversal_caution_research.py'
      - 'direction_state_machine_research.py'
      - 'tests/test_supabase_early_transition_research.py'
      - 'tests/test_supabase_early_transition_prospective.py'
      - 'tests/test_market_breadth_exhaustion_research.py'
      - 'tests/test_breadth_reversal_caution_research.py'
      - 'tests/test_direction_state_machine_research.py'
      - '.github/workflows/atlas-direction-state-research-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  research-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest
      - run: python -m pytest -q tests/test_supabase_early_transition_research.py tests/test_supabase_early_transition_prospective.py tests/test_market_breadth_exhaustion_research.py tests/test_breadth_reversal_caution_research.py tests/test_direction_state_machine_research.py
