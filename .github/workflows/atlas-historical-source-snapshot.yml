name: ATLAS Historical Source Integrity

on:
  push:
    branches: [main]
    paths:
      - 'status/historical-source-latest.json'
      - 'historical_source_runtime.py'
      - 'historical_microstructure_replay.py'
      - 'historical_replay_registry.py'
      - 'historical_evaluation_protocol.py'
      - '.github/workflows/atlas-historical-source-snapshot.yml'
  schedule:
    - cron: '27 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: atlas-historical-source-integrity
  cancel-in-progress: true

jobs:
  integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify frozen historical source and preregistration
        run: |
          set -euo pipefail
          p='status/historical-source-latest.json'
          test -s "$p"
          jq -e '
            .version == "ATLAS_HISTORICAL_SOURCE_AUDIT_V1_PRIOR_ONLY_CACHED" and
            .cached_only == true and
            .background_refresh_triggered == false and
            .research_only == true and
            .live_execution == false and
            .outcomes_read_by_request == false and
            .report.outcomes_read == false and
            .report.forward_return_fields_read == false and
            .report.future_smart_money_match_allowed == false and
            .report.backfill_performed == false and
            .replay_registry.status == "FROZEN_READY" and
            .replay_registry.registration_locked == true and
            .evaluation_protocol.status == "PREREGISTERED" and
            .evaluation_protocol.registration_locked == true and
            .evaluation_protocol.feature_dataset_sha256 == .replay_registry.feature_dataset_sha256 and
            (.evaluation_protocol.protocol_hash | type) == "string"
          ' "$p" >/dev/null
          python3 - <<'PY'
          import datetime,json,pathlib
          row=json.loads(pathlib.Path('status/historical-source-latest.json').read_text())
          raw=(row.get('report') or {}).get('generated_at') or row.get('_snapshot_captured_at')
          if not raw: raise SystemExit('missing historical source timestamp')
          t=datetime.datetime.fromisoformat(raw.replace('Z','+00:00'))
          age=(datetime.datetime.now(datetime.timezone.utc)-t).total_seconds()/3600
          print(f'HISTORICAL_SOURCE_OK age_hours={age:.2f} stale={age>6}')
          print('NOTE: this is a frozen discovery dataset; staleness is reported, never hidden by rewriting timestamps.')
          PY
