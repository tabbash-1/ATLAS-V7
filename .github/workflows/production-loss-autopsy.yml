name: ATLAS Production Loss Autopsy

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'production_loss_autopsy.py'
      - 'tests/test_production_loss_autopsy.py'
      - '.github/workflows/production-loss-autopsy.yml'
  push:
    branches: [main]
    paths:
      - 'production_loss_autopsy.py'
      - 'tests/test_production_loss_autopsy.py'
      - '.github/workflows/production-loss-autopsy.yml'
      - 'status/paper-portfolio-10k-latest.json'
      - 'status/production-validation-latest.json'
  schedule:
    - cron: '37 */3 * * *'

permissions:
  contents: write

jobs:
  autopsy:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Regression tests
        run: |
          python3 -m py_compile production_loss_autopsy.py tests/test_production_loss_autopsy.py
          PYTHONPATH=. python3 tests/test_production_loss_autopsy.py
      - name: Build canonical loss autopsy and cross-check independent V6 validation
        run: |
          python3 -m json.tool status/paper-portfolio-10k-latest.json >/dev/null
          python3 -m json.tool status/production-validation-latest.json >/dev/null
          python3 production_loss_autopsy.py \
            --input status/paper-portfolio-10k-latest.json \
            --validation status/production-validation-latest.json \
            --output status/production-loss-autopsy.json
          python3 - <<'PY'
          import json
          from production_loss_autopsy import SCHEMA, CURRENT_GEOMETRY_VERSION
          x=json.load(open('status/production-loss-autopsy.json'))
          v=json.load(open('status/production-validation-latest.json'))
          assert x['schema']==SCHEMA
          assert x['production_threshold']==68
          assert x['production_threshold_changed'] is False
          assert x['production_score_adjustment']==0
          assert x['production_stop_policy_changed'] is False
          assert x['research_recommendation']['change_production_stop_policy_now'] is False
          assert x['cohort_focus']['current_geometry_version']==CURRENT_GEOMETRY_VERSION
          assert CURRENT_GEOMETRY_VERSION=='ATLAS_GEOMETRY_V6_MIN_1_5_ATR_INVALIDATION'
          assert x['cohort_focus']['minimum_current_terminal_sample']==30
          assert x['cohort_focus']['current']['terminal']==v['current_geometry']['summary']['terminal']
          assert x['research_only'] is True
          print('CANONICAL_AUTOPSY_VERIFIED', x['cohort_focus']['current_terminal_progress'])
          PY
      - name: Commit research report only after main-branch validation
        if: github.event_name != 'pull_request'
        run: |
          if [ -z "$(git status --porcelain -- status/production-loss-autopsy.json)" ]; then exit 0; fi
          git config user.name 'atlas-autopsy-bot'
          git config user.email 'atlas-autopsy-bot@users.noreply.github.com'
          git add status/production-loss-autopsy.json
          git commit -m 'chore: update canonical V6 loss autopsy [skip ci] [skip render]'
          git pull --rebase origin main
          git push
