name: ATLAS Evidence Control Center

on:
  pull_request:
    branches: [main]
    paths:
      - 'evidence_control_center.py'
      - 'opportunity_replay_shadow.py'
      - 'opportunity_path_replay.py'
      - 'strategy_change_review_gate.py'
      - 'evidence-control-center.html'
      - 'cloud_web_only_final.py'
      - 'tests/test_evidence_control_center.py'
      - '.github/workflows/atlas-evidence-control-center.yml'
  push:
    branches: [main]
    paths:
      - 'evidence_control_center.py'
      - 'opportunity_replay_shadow.py'
      - 'cloud_web_only_final.py'
      - 'status/production-validation-latest.json'
      - '.github/workflows/atlas-evidence-control-center.yml'
  schedule:
    - cron: '32 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: atlas-evidence-control-center
  cancel-in-progress: false

jobs:
  control:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Regression
        run: |
          python -m py_compile evidence_control_center.py opportunity_replay_shadow.py opportunity_path_replay.py strategy_change_review_gate.py cloud_web_only_final.py
          PYTHONPATH=. python - <<'PY'
          import tests.test_evidence_control_center as t
          for name in sorted(x for x in dir(t) if x.startswith('test_')):
              getattr(t,name)(); print('PASS',name)
          PY
      - name: Validate live committed evidence aggregation
        run: |
          python evidence_control_center.py > /tmp/control.json
          python opportunity_replay_shadow.py
          python - <<'PY'
          import json
          p=json.load(open('/tmp/control.json'))
          r=json.load(open('status/opportunity-replay-shadow-latest.json'))
          assert p['schema']=='ATLAS_EVIDENCE_CONTROL_CENTER_V1'
          assert p['production_threshold']==68
          assert p['safety']['production_impact']=='NONE'
          assert p['safety']['can_override_production'] is False
          assert r['criteria_locked_before_evaluation'] is True
          assert r['interpretation']['automatic_strategy_change'] is False
          assert all(x['promotion_allowed'] is False for x in r['hypotheses'])
          print('CONTROL_CENTER_OK',p['headline'],p['sample_progress'])
          print('REPLAY_SHADOW_OK',r['eligible_prospective_rows'])
          PY
      - name: Upload replay evidence
        uses: actions/upload-artifact@v4
        with:
          name: atlas-opportunity-replay-${{ github.run_id }}
          path: status/opportunity-replay-shadow-latest.json
          retention-days: 30
      - name: Commit replay snapshot
        if: github.event_name != 'pull_request'
        run: |
          git add status/opportunity-replay-shadow-latest.json
          if git diff --cached --quiet; then echo 'replay unchanged'; exit 0; fi
          git config user.name 'atlas-evidence-control'
          git config user.email 'atlas-evidence@users.noreply.github.com'
          git commit -m 'validation: update opportunity replay shadow [skip render]'
          git pull --rebase origin main
          git push origin HEAD:main
