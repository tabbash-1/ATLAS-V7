name: ADP V8 Historical Backtest
on:
  push:
    branches:
      - research/adp-v8-historical-backtest
  workflow_dispatch:

permissions:
  contents: write

jobs:
  backtest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/adp-v8-historical-backtest
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Replay frozen V8 rule over prior 365 days
        run: python research/adp/v8_historical_backtest.py --days 365
      - name: Persist research result
        run: |
          set -euo pipefail
          git config user.name "atlas-research-bot"
          git config user.email "atlas-research-bot@users.noreply.github.com"
          git add status/adp-v8-historical-backtest.json
          git diff --cached --quiet && exit 0
          git commit -m "research: record ADP V8 historical backtest [skip ci] [skip render]"
          git pull --rebase origin research/adp-v8-historical-backtest
          git push origin HEAD:research/adp-v8-historical-backtest
