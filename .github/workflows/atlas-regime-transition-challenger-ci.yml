name: ATLAS Regime Transition Challenger CI
on:
  pull_request:
    paths:
      - 'regime_transition_challenger.py'
      - 'tests/test_regime_transition_challenger.py'
      - 'regime_transition_frozen_evidence.py'
      - 'production_decision_api.py'
      - 'tests/test_production_independent_regime_evidence.py'
      - 'tests/test_regime_transition_frozen_evidence.py'
      - '.github/workflows/atlas-regime-transition-challenger-ci.yml'
      - '.github/workflows/atlas-regime-transition-prospective-capture.yml'
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check pytest
      - run: python -m pytest -q tests/test_regime_transition_challenger.py tests/test_regime_transition_frozen_evidence.py tests/test_production_independent_regime_evidence.py tests/test_market_regime_engine.py tests/test_htf_sr_decision_v2.py
