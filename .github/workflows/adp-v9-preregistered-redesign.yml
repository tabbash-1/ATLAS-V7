name: ADP V9 Preregistered Redesign
on:
  push:
    branches: [research/adp-v8-historical-backtest]
    paths: [research/adp/v9_preregistered_redesign.py]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  evaluate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: research/adp-v8-historical-backtest, fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python research/adp/v9_preregistered_redesign.py --days 730 --end-ms 1790796000000
      - run: |
          git config user.name "atlas-research-bot"
          git config user.email "atlas-research-bot@users.noreply.github.com"
          git add status/adp-v9-dev-validation.json
          git diff --cached --quiet && exit 0
          git commit -m "research: record ADP V9 dev validation [skip ci] [skip render]"
          git pull --rebase origin research/adp-v8-historical-backtest
          git push origin HEAD:research/adp-v8-historical-backtest
