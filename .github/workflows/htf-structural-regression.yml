name: HTF Structural Regression

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependency
        run: python -m pip install --disable-pip-version-check pytest
      - name: Compile changed Python modules
        run: python -m py_compile htf_structural_thesis.py htf_price_action.py htf_price_action_overlay.py htf_scenario_engine.py render_boot_patch.py product_quality_gate_overlay.py production_trade_plan.py
      - name: HTF structural thesis logic
        run: PYTHONPATH=. pytest -q tests/test_htf_structural_thesis.py
      - name: HTF price-action logic
        run: PYTHONPATH=. pytest -q tests/test_htf_price_action.py
      - name: HTF conditional scenario engine
        run: PYTHONPATH=. pytest -q tests/test_htf_scenario_engine.py
      - name: Render boot integration contract
        run: PYTHONPATH=. pytest -q tests/test_htf_boot_integration_contract.py tests/test_htf_price_action_boot_contract.py
      - name: Core 4-12H horizon contract
        run: PYTHONPATH=. pytest -q tests/test_product_core_horizon_contract.py
      - name: Production trade plan regression
        run: PYTHONPATH=. pytest -q tests/test_production_trade_plan.py
      - name: Final product quality gate regression
        run: PYTHONPATH=. pytest -q tests/test_product_quality_gate_overlay.py
