name: ATLAS Reversal4H Forward Shadow
on:
  pull_request:
    branches: [main]
    paths:
      - 'research/reversal4h_forward_shadow.py'
      - 'tests/test_reversal4h_forward_shadow.py'
      - '.github/workflows/reversal4h-forward-shadow.yml'
  push:
    branches: [main]
    paths:
      - 'research/reversal4h_forward_shadow.py'
      - 'tests/test_reversal4h_forward_shadow.py'
      - '.github/workflows/reversal4h-forward-shadow.yml'
  workflow_dispatch:
  schedule:
    - cron: '17 */4 * * *'

permissions:
  contents: write

concurrency:
  group: reversal4h-forward-shadow
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependency
        run: python -m pip install pytest
      - name: Shadow regressions
        run: python -m pytest -q tests/test_reversal4h_forward_shadow.py
      - name: Research-only invariants
        run: |
          grep -Fq 'ATLAS_REVERSAL4H_FORWARD_SHADOW_V1' research/reversal4h_forward_shadow.py
          grep -Fq '"production_effect":"NONE"' <(python research/reversal4h_forward_shadow.py | tail -n 1) || true
          grep -Fq 'can_override_production":False' research/reversal4h_forward_shadow.py
          grep -Fq 'live_execution":False' research/reversal4h_forward_shadow.py

  forward-shadow:
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Capture and settle prospective evidence
        run: python research/reversal4h_forward_shadow.py
      - name: Contract check
        run: |
          jq -e '.schema=="ATLAS_REVERSAL4H_FORWARD_SHADOW_V1_LATEST" and .research_only==true and .shadow_only==true and .live_execution==false and .production_effect=="NONE" and .can_override_production==false and .can_override_final_gate==false and .can_change_threshold==false' status/reversal4h-forward-shadow-latest.json
      - name: Commit research evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "atlas-reversal4h-shadow"
          git config user.email "atlas-reversal4h-shadow@users.noreply.github.com"
          git add status/reversal4h-forward-ledger.json status/reversal4h-forward-shadow-latest.json
          if git diff --cached --quiet; then
            echo "No reversal4H forward evidence changes."
            exit 0
          fi
          git commit -m "research: update reversal4H forward shadow [skip ci] [skip render]"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep $((attempt * 2))
          done
          echo "reversal4H forward evidence push failed after retry/rebase loop" >&2
          exit 1
