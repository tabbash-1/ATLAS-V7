name: ATLAS Long Path Excursion Analysis

on:
  workflow_dispatch:
  push:
    paths:
      - 'long_path_excursion_analysis.py'
      - 'tests/test_long_path_excursion_analysis.py'
      - '.github/workflows/long-path-excursion-analysis.yml'
      - 'status/**'

permissions:
  contents: write

jobs:
  analyze:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Syntax and regression test
        run: |
          python -m py_compile long_path_excursion_analysis.py tests/test_long_path_excursion_analysis.py
          PYTHONPATH=. python tests/test_long_path_excursion_analysis.py
      - name: Run LONG path analysis
        run: python long_path_excursion_analysis.py
      - name: Persist report
        run: |
          if [ -n "$(git status --porcelain -- status/long-path-excursion-analysis.json)" ]; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add status/long-path-excursion-analysis.json
            git commit -m 'data: refresh long path excursion analysis'
            git push
          else
            echo 'No report change to persist.'
          fi
