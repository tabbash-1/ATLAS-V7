name: Debug Live HTF Payload

on:
  push:
    branches:
      - atlas/debug-live-htf-payload-20260913

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Verify live opportunity readiness ranking
        run: |
          set -euo pipefail
          out=/tmp/ranked.json
          ok=0
          url='https://atlas-v7.onrender.com/api/opportunities/ranked?symbols=BTCUSDT,ETHUSDT,SOLUSDT,BNBUSDT,XRPUSDT,DOGEUSDT,ZECUSDT'
          for attempt in $(seq 1 12); do
            code="$(curl -L --connect-timeout 20 --max-time 120 -sS -w '%{http_code}' -o "$out" "$url" || true)"
            if [[ "$code" =~ ^2 ]] && jq -e '
              .ok == true
              and .version == "ATLAS_OPPORTUNITY_READINESS_V1"
              and .decision_source_of_truth == "FINAL_TRADE_GATE"
              and .threshold_changed == false
              and .score_changed == false
              and .production_decision_changed == false
              and .readiness_score_is_probability == false
              and .live_execution == false
              and (.opportunities | length == 7)
              and (.opportunities | all(
                (.rank | type == "number")
                and (.checks | type == "object")
                and (.missing_conditions | type == "array")
                and (.trade_ready | type == "boolean")
                and (.readiness_score_is_probability == false)
                and (.can_override_production == false)
                and (.live_execution == false)
              ))
            ' "$out" >/dev/null 2>&1; then
              ok=1
              break
            fi
            echo "ranking probe retry ${attempt}/12, HTTP ${code:-none}"
            cat "$out" || true
            sleep 5
          done
          test "$ok" = 1
          echo '=== OPPORTUNITY_RANKING_LIVE_OK ==='
          jq '{version,decision_source_of_truth,threshold_changed,score_changed,production_decision_changed,readiness_score_is_probability,live_execution,opportunities:[.opportunities[]|{rank,symbol,actionable_decision,candidate_direction,product_direction,score,signal_threshold,production_signal_qualified,trade_ready,readiness_score,readiness_tier,next_required_condition,missing_conditions,htf_status,htf_reason,blockers}]}' "$out"
