name: ATLAS Staged Isolation CI

on:
  pull_request:
    paths:
      - 'atlas_decision_architecture.py'
      - 'tests/test_staged_decision_isolation.py'
      - 'tests/test_staged_decision_contract.py'
      - '.github/workflows/atlas-staged-isolation-ci.yml'
  workflow_dispatch:

jobs:
  isolation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install --upgrade pip pytest
      - name: Verify product contract and Production isolation
        run: python -m pytest -q tests/test_staged_decision_contract.py tests/test_staged_decision_isolation.py
