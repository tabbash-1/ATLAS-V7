name: Verify HTF Price Action Production

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  live-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify live Render HTF price-action contract
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, time, urllib.request

          base='https://atlas-v7.onrender.com/api/decision/current?symbol='
          symbols=['BTCUSDT','ETHUSDT']

          def fetch(sym):
              last=None
              for _ in range(6):
                  try:
                      req=urllib.request.Request(base+sym,headers={'User-Agent':'ATLAS-production-smoke/1.0'})
                      with urllib.request.urlopen(req,timeout=45) as r:
                          return json.loads(r.read().decode())
                  except Exception as e:
                      last=e; time.sleep(10)
              raise last

          for sym in symbols:
              row=fetch(sym)
              assert row.get('ok') is True, (sym,row)
              thesis=row.get('htf_thesis') or {}
              assert thesis.get('version')=='HTF_STRUCTURAL_THESIS_V1', (sym,thesis.get('version'))
              pa=row.get('htf_price_action') or {}
              assert pa.get('version')=='HTF_PRICE_ACTION_OVERLAY_V1', (sym,pa)
              assert pa.get('analysis_version')=='HTF_PRICE_ACTION_V1', (sym,pa)
              assert pa.get('can_override_canonical_decision') is False, (sym,pa)
              assert pa.get('can_change_score') is False, (sym,pa)
              assert pa.get('can_change_threshold') is False, (sym,pa)
              assert pa.get('live_execution') is False, (sym,pa)
              frames=pa.get('frames') or {}
              for tf in ('4h','12h'):
                  f=frames.get(tf) or {}
                  assert f.get('ok') is True, (sym,tf,f)
                  for key in ('scenario','break_of_structure','liquidity_sweep','retest_state','rejection_state','market_location','nearest_support_zone','nearest_resistance_zone'):
                      assert key in f, (sym,tf,key,f)
                  assert f.get('live_execution') is False, (sym,tf,f)
              combined=pa.get('combined') or {}
              assert combined.get('live_execution') is False, (sym,combined)
              assert row.get('htf_price_action_score_preserved') is True, (sym,row.get('htf_price_action_score_preserved'))
              assert row.get('htf_price_action_threshold_preserved') is True, (sym,row.get('htf_price_action_threshold_preserved'))
              assert (row.get('analyst_output') or {}).get('live_execution') is False, (sym,row.get('analyst_output'))
              decision=(row.get('analyst_output') or {}).get('decision') or row.get('canonical_product_decision') or row.get('actionable_decision')
              assert decision in ('LONG','SHORT','WAIT'), (sym,decision)
              print(sym, 'OK', decision, combined.get('status'))
          PY
