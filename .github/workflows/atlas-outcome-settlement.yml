name: ATLAS Outcome Settlement

on:
  push:
    branches: [main]
    paths:
      - 'trade_outcome_runtime.py'
      - 'trade_outcome_ledger.py'
      - 'execution_outcome_scope.py'
      - 'trade_path_settlement.py'
      - 'tests/test_trade_outcome_runtime.py'
      - 'tests/test_trade_outcome_ledger.py'
      - 'tests/test_trade_path_settlement.py'
      - '.github/workflows/atlas-outcome-settlement.yml'
  pull_request:
    branches: [main]
    paths:
      - 'trade_outcome_runtime.py'
      - 'trade_outcome_ledger.py'
      - 'execution_outcome_scope.py'
      - 'trade_path_settlement.py'
      - 'tests/test_trade_outcome_runtime.py'
      - 'tests/test_trade_outcome_ledger.py'
      - 'tests/test_trade_path_settlement.py'
      - '.github/workflows/atlas-outcome-settlement.yml'
  workflow_dispatch:

jobs:
  outcome-settlement:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Syntax
        run: python -m py_compile trade_outcome_runtime.py trade_outcome_ledger.py execution_outcome_scope.py trade_path_settlement.py tests/test_trade_outcome_runtime.py tests/test_trade_outcome_ledger.py tests/test_trade_path_settlement.py
      - name: Canonical outcome regressions
        run: |
          PYTHONPATH=. python tests/test_trade_outcome_ledger.py
          PYTHONPATH=. python tests/test_trade_outcome_runtime.py
      - name: Existing path regressions
        run: PYTHONPATH=. python tests/test_trade_path_settlement.py
      - name: Geometry cohort invariant
        run: |
          PYTHONPATH=. python - <<'PY'
          import trade_path_settlement as tps
          payload = {
              'symbol': 'BTCUSDT', 'entry': 100.0, 'direction': 'LONG',
              'rr_tp2': 2.0, 'support_distance_pct': 1.0,
              'resistance_distance_pct': 4.0,
          }
          geometry = tps.derive_geometry(payload)
          assert geometry['geometry_version'] == tps.GEOMETRY_VERSION
          assert geometry['frozen_at_observation'] is True
          print('GEOMETRY_VERSION', geometry['geometry_version'])
          PY
      - name: Canonical safety invariants
        run: |
          set -euo pipefail
          grep -q "default_scope': 'signals'" trade_outcome_runtime.py
          grep -q "default_horizon_h': DEFAULT_HORIZON" trade_outcome_runtime.py
          grep -q 'OFFICIAL_HORIZONS = (4, 8, 12)' trade_outcome_runtime.py
          grep -q 'FINAL_TRADE_GATE_CANONICAL_TRADE_READY_ONLY' trade_outcome_runtime.py
          grep -q "CANONICAL_SOURCE = 'FINAL_TRADE_GATE'" trade_outcome_ledger.py
          grep -q "HORIZONS = (4, 8, 12)" trade_outcome_ledger.py
          grep -q "legacy_backfill_allowed': False" trade_outcome_ledger.py
          grep -q "scope == 'legacy_score_signals'" trade_outcome_runtime.py
          if grep -q 'LEGACY_PRODUCTION_THRESHOLD' trade_outcome_ledger.py; then
            echo 'Legacy score fallback leaked into official ledger' >&2
            exit 1
          fi
          grep -q 'SETTLEMENT_INTERVAL_SECONDS = 900' trade_outcome_runtime.py
          grep -q '/api/outcomes/settlement-status' trade_outcome_runtime.py
          grep -q 'live_execution.*False' trade_outcome_runtime.py
          grep -q 'ATLAS_GEOMETRY_V3_STRUCTURAL_TP2_FROZEN_RR' trade_path_settlement.py
          echo CANONICAL_OUTCOME_CONTRACT_OK
