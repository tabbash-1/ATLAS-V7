name: ATLAS Final Production Gate

on:
  push:
    branches: [main]
    paths:
      - 'cloud_web_only.py'
      - 'product_quality_gate_overlay.py'
      - 'decision_intelligence.py'
      - 'production_trade_plan.py'
      - 'horizon_fit_overlay.py'
      - 'production_decision_api.py'
      - 'canonical_geometry_overlay.py'
      - 'tests/test_canonical_geometry_overlay.py'
      - 'verify_canonical_geometry_payload.py'
      - 'decision_engine_v7.py'
      - 'production-web-autoload.js'
      - 'atlas-unified-terminal.js'
      - 'atlas-product-shell.js'
      - 'render.yaml'
      - '.github/workflows/atlas-canonical-geometry-ci.yml'
      - '.github/workflows/atlas-final-production-gate.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: atlas-final-production-gate
  cancel-in-progress: true

jobs:
  verify-live-render:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      BASE_URL: https://atlas-v7.onrender.com
      EXPECTED_GATE: PRODUCT_QUALITY_GATE_V2_CANONICAL_ANALYST_OUTPUT
      EXPECTED_PROFILE: ATLAS_ANALYSIS_EVIDENCE_PROFILE_V1
      EXPECTED_DECISION_INTELLIGENCE: ATLAS_DECISION_INTELLIGENCE_V1_SHADOW
      EXPECTED_GEOMETRY: ATLAS_GEOMETRY_V5_ATR_STRUCTURE_PROVENANCE
      EXPECTED_CANONICAL_GEOMETRY: ATLAS_CANONICAL_GEOMETRY_TRUTH_V1
      EXPECTED_GEOMETRY_REASON_SCHEMA: ATLAS_GEOMETRY_REASON_CODES_V1
    steps:
      - uses: actions/checkout@v4
      - name: Wait for exact deployed runtime contract
        shell: bash
        run: |
          set -euo pipefail
          ok=0
          for attempt in $(seq 1 36); do
            code=$(curl -L --connect-timeout 15 --max-time 60 -sS -w '%{http_code}' -o /tmp/web-mode.json "$BASE_URL/api/web-mode?t=$(date +%s)" || true)
            if [[ "$code" =~ ^2 ]] && jq -e --arg v "$EXPECTED_GATE" --arg p "$EXPECTED_PROFILE" --arg di "$EXPECTED_DECISION_INTELLIGENCE" --arg cg "$EXPECTED_CANONICAL_GEOMETRY" --arg gr "$EXPECTED_GEOMETRY_REASON_SCHEMA" '.ok == true and .product_quality_gate.version == $v and .product_quality_gate.analysis_profile_version == $p and .product_quality_gate.decision_intelligence_version == $di and .product_quality_gate.decision_intelligence_shadow_only == true and .product_quality_gate.decision_intelligence_can_override == false and .product_quality_gate.canonical_contract == "analyst_output" and .product_quality_gate.product_horizon == "4-12H" and .product_quality_gate.analysis_only == true and .product_quality_gate.live_execution == false and .product_quality_gate.score_threshold_unchanged == true and .product_quality_gate.raw_production_qualification_preserved == true and .canonical_geometry.version == $cg and .canonical_geometry.reason_schema_version == $gr and .canonical_geometry.rr_source == "EXACT_ENTRY_STOP_TARGET" and .canonical_geometry.score_threshold_unchanged == true and .canonical_geometry.analysis_only == true and .canonical_geometry.live_execution == false' /tmp/web-mode.json >/dev/null 2>&1; then
              ok=1
              break
            fi
            echo "attempt=$attempt http=$code deployed_gate=$(jq -r '.product_quality_gate.version // "missing"' /tmp/web-mode.json 2>/dev/null || echo invalid) decision_intelligence=$(jq -r '.product_quality_gate.decision_intelligence_version // "missing"' /tmp/web-mode.json 2>/dev/null || echo invalid) canonical_geometry=$(jq -r '.canonical_geometry.version // "missing"' /tmp/web-mode.json 2>/dev/null || echo invalid)"
            sleep 10
          done
          test "$ok" = 1
          jq '{ok,canonical_geometry,product_quality_gate,research_execution_location,background_workers,cloud_forward_in_web_process}' /tmp/web-mode.json
      - name: Verify canonical analyst output for all supported assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/atlas-final-gate
          fetch_decision() {
            s="$1"; out="/tmp/atlas-final-gate/$s.json"; success=0
            for attempt in $(seq 1 8); do
              url="$BASE_URL/api/decision/current?symbol=$s&t=$(date +%s%N)"
              code=$(curl -L --connect-timeout 20 --max-time 90 -sS -w '%{http_code}' -o "$out.tmp" "$url" || true)
              if [[ "$code" =~ ^2 ]] && jq -e '.ok == true' "$out.tmp" >/dev/null 2>&1; then mv "$out.tmp" "$out"; success=1; break; fi
              echo "$s fetch attempt=$attempt http=$code body=$(head -c 280 "$out.tmp" 2>/dev/null | tr '\n' ' ' || true)"
              rm -f "$out.tmp"; sleep 6
            done
            [[ "$success" == 1 ]] || { echo "ERROR: $s did not return a valid Production decision after retries"; return 1; }
          }
          for s in BTCUSDT ETHUSDT SOLUSDT XRPUSDT BNBUSDT DOGEUSDT ZECUSDT HYPEUSDT; do
            fetch_decision "$s"
            jq -e --arg s "$s" --arg v "$EXPECTED_GATE" --arg p "$EXPECTED_PROFILE" --arg di "$EXPECTED_DECISION_INTELLIGENCE" --arg cg "$EXPECTED_CANONICAL_GEOMETRY" --arg gr "$EXPECTED_GEOMETRY_REASON_SCHEMA" '
              .ok == true and .symbol == $s and
              .canonical_product_contract == "analyst_output" and
              .quality_gate_version == $v and
              .analysis_profile_version == $p and
              .geometry_version == $cg and
              .geometry_reason_schema_version == $gr and
              .geometry_rr_source == "RECOMPUTED_FROM_EXACT_ENTRY_STOP_TARGET" and
              .geometry_gate.version == $cg and
              .geometry_gate.reason_schema_version == $gr and
              (.geometry_gate.blocker_codes | type) == "array" and
              .score_or_threshold_changed_by_geometry == false and
              .analyst_output.contract_version == $v and
              .analyst_output.analysis_profile_version == $p and
              .analyst_output.lane == "CORE_4_12H" and
              .analyst_output.horizon == "4-12H" and
              (.analyst_output.decision == "LONG" or .analyst_output.decision == "SHORT" or .analyst_output.decision == "WAIT") and
              .analyst_output.analysis_only == true and .analyst_output.live_execution == false and
              .analyst_output.geometry_readiness.reason_schema_version == $gr and
              .analyst_output.geometry_readiness.geometry_version == $cg and
              (.analyst_output.geometry_readiness.blocker_codes | type) == "array" and
              .analyst_output.geometry_readiness.ready == (.geometry_gate.qualified == true) and
              ((.geometry_gate.qualified == true and (.analyst_output.geometry_readiness.blocker_codes | length) == 0) or (.geometry_gate.qualified != true and (.analyst_output.geometry_readiness.blocker_codes | length) >= 1)) and
              .analyst_output.evidence_profile.version == $p and
              .analyst_output.evidence_profile.score_changed == false and
              .analyst_output.evidence_profile.threshold_changed == false and
              .analyst_output.evidence_profile.only_quality_gate_can_change_canonical_decision == true and
              .decision_intelligence.version == $di and
              .analyst_output.decision_intelligence.version == $di and
              .decision_intelligence.canonical_decision == .analyst_output.decision and
              .decision_intelligence.can_override_canonical_decision == false and
              .decision_intelligence.can_change_score == false and
              .decision_intelligence.can_change_threshold == false and
              .decision_intelligence.can_change_geometry == false and
              .decision_intelligence.analysis_only == true and .decision_intelligence.live_execution == false and
              .analysis_only == true and .live_execution == false and
              .production_threshold_changed_by_quality_gate == false and .production_score_preserved == true
            ' "/tmp/atlas-final-gate/$s.json" >/dev/null
            python verify_canonical_geometry_payload.py "/tmp/atlas-final-gate/$s.json"
            decision=$(jq -r '.analyst_output.decision' "/tmp/atlas-final-gate/$s.json")
            stage=$(jq -r '.decision_intelligence.stage' "/tmp/atlas-final-gate/$s.json")
            gate=$(jq -r '.analyst_output.setup_quality_gate.status' "/tmp/atlas-final-gate/$s.json")
            score=$(jq -r '.analyst_output.confidence' "/tmp/atlas-final-gate/$s.json")
            threshold=$(jq -r '.analyst_output.signal_threshold' "/tmp/atlas-final-gate/$s.json")
            raw_geom=$(jq -r '.geometry_gate.status' "/tmp/atlas-final-gate/$s.json")
            blocker=$(jq -r '.analyst_output.geometry_readiness.primary_blocker // "NONE"' "/tmp/atlas-final-gate/$s.json")
            echo "$s decision=$decision intelligence_stage=$stage gate=$gate raw_geometry=$raw_geom geometry_blocker=$blocker score=$score threshold=$threshold profile=$EXPECTED_PROFILE"
            if [[ "$decision" == "LONG" || "$decision" == "SHORT" ]]; then
              jq -e --arg g "$EXPECTED_GEOMETRY" '.analyst_output.analysis_ready == true and (.analyst_output.entry|numbers) and (.analyst_output.stop_loss|numbers) and (.analyst_output.take_profit|numbers) and (.analyst_output.risk_reward|numbers) and .analyst_output.geometry_provenance.geometry_version == $g and .analyst_output.geometry_provenance.score_or_threshold_changed == false' "/tmp/atlas-final-gate/$s.json" >/dev/null
            else
              jq -e '.analyst_output.analysis_ready == false and .analyst_output.entry == null and .analyst_output.stop_loss == null and .analyst_output.take_profit == null' "/tmp/atlas-final-gate/$s.json" >/dev/null
            fi
          done
      - name: Verify public product shell carries canonical authority code
        shell: bash
        run: |
          set -euo pipefail
          for f in production-web-autoload.js atlas-unified-terminal.js atlas-product-shell.js; do
            curl -L --retry 4 --retry-delay 4 --retry-all-errors --connect-timeout 20 --max-time 120 -fsS "$BASE_URL/$f?t=$(date +%s)" -o "/tmp/$f"
          done
          grep -q 'ATLAS_PRODUCTION_WEB_AUTOLOAD_V4_ANALYST_OUTPUT' /tmp/production-web-autoload.js
          grep -q "contract:'analyst_output'" /tmp/production-web-autoload.js
          grep -q 'ATLAS_UNIFIED_TERMINAL_V3_ANALYSIS_ONLY' /tmp/atlas-unified-terminal.js
          grep -q "canonicalContract:'analyst_output'" /tmp/atlas-unified-terminal.js
          grep -q 'Analysis only · no order routing' /tmp/atlas-unified-terminal.js
          grep -q 'ATLAS_PRODUCT_SHELL_V5_DECISION_INTELLIGENCE' /tmp/atlas-product-shell.js
          grep -q "canonicalContract:'analyst_output'" /tmp/atlas-product-shell.js
          grep -q "productHorizon:'4-12H'" /tmp/atlas-product-shell.js
          grep -q 'geometry_readiness' /tmp/atlas-product-shell.js
          grep -q 'Geometry blocker:' /tmp/atlas-product-shell.js
          grep -q 'geometryReasonCodes:true' /tmp/atlas-product-shell.js
          grep -q 'decisionIntelligenceShadowOnly:true' /tmp/atlas-product-shell.js
          ! grep -q "p.status==='ACTIONABLE'" /tmp/atlas-product-shell.js
          ! grep -q "execution_ready" /tmp/atlas-product-shell.js
      - name: Final safety assertions
        shell: bash
        run: |
          set -euo pipefail
          jq -e --arg gr "$EXPECTED_GEOMETRY_REASON_SCHEMA" --arg di "$EXPECTED_DECISION_INTELLIGENCE" '.product_quality_gate.score_threshold_unchanged == true and .product_quality_gate.raw_production_qualification_preserved == true and .product_quality_gate.research_warnings_never_auto_promote == true and .product_quality_gate.decision_intelligence_version == $di and .product_quality_gate.decision_intelligence_shadow_only == true and .product_quality_gate.decision_intelligence_can_override == false and .product_quality_gate.analysis_only == true and .product_quality_gate.live_execution == false and .canonical_geometry.reason_schema_version == $gr and .canonical_geometry.score_threshold_unchanged == true and .canonical_geometry.live_execution == false' /tmp/web-mode.json >/dev/null
          grep -q 'ATLAS_CANONICAL_GEOMETRY_TRUTH_V1' canonical_geometry_overlay.py
          grep -q 'ATLAS_GEOMETRY_REASON_CODES_V1' canonical_geometry_overlay.py
          grep -q 'ATLAS_DECISION_INTELLIGENCE_V1_SHADOW' decision_intelligence.py
          grep -q 'RECOMPUTED_FROM_EXACT_ENTRY_STOP_TARGET' canonical_geometry_overlay.py
          echo 'ATLAS FINAL PRODUCTION GATE: PASS'