name: ATLAS Final Production Gate

on:
  push:
    branches: [main]
    paths:
      - 'cloud_web_only.py'
      - 'product_quality_gate_overlay.py'
      - 'horizon_fit_overlay.py'
      - 'production_decision_api.py'
      - 'decision_engine_v7.py'
      - 'production-web-autoload.js'
      - 'atlas-unified-terminal.js'
      - 'render.yaml'
      - '.github/workflows/atlas-final-production-gate.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: atlas-final-production-gate
  cancel-in-progress: true

jobs:
  verify-live-render:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      BASE_URL: https://atlas-v7.onrender.com
      EXPECTED_GATE: PRODUCT_QUALITY_GATE_V2_CANONICAL_ANALYST_OUTPUT
    steps:
      - uses: actions/checkout@v4
      - name: Wait for exact deployed runtime contract
        shell: bash
        run: |
          set -euo pipefail
          ok=0
          for attempt in $(seq 1 36); do
            code=$(curl -L --connect-timeout 15 --max-time 60 -sS -w '%{http_code}' -o /tmp/web-mode.json "$BASE_URL/api/web-mode?t=$(date +%s)" || true)
            if [[ "$code" =~ ^2 ]] && jq -e --arg v "$EXPECTED_GATE" '.ok == true and .product_quality_gate.version == $v and .product_quality_gate.canonical_contract == "analyst_output" and .product_quality_gate.product_horizon == "4-12H" and .product_quality_gate.analysis_only == true and .product_quality_gate.live_execution == false' /tmp/web-mode.json >/dev/null 2>&1; then
              ok=1
              break
            fi
            echo "attempt=$attempt http=$code deployed_gate=$(jq -r '.product_quality_gate.version // "missing"' /tmp/web-mode.json 2>/dev/null || echo invalid)"
            sleep 10
          done
          test "$ok" = 1
          jq '{ok,product_quality_gate,research_execution_location,background_workers,cloud_forward_in_web_process}' /tmp/web-mode.json
      - name: Verify canonical analyst output for all supported assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/atlas-final-gate
          for s in BTCUSDT ETHUSDT SOLUSDT XRPUSDT BNBUSDT DOGEUSDT ZECUSDT HYPEUSDT; do
            url="$BASE_URL/api/decision/current?symbol=$s&t=$(date +%s)"
            code=$(curl -L --retry 4 --retry-delay 4 --retry-all-errors --connect-timeout 20 --max-time 120 -sS -w '%{http_code}' -o "/tmp/atlas-final-gate/$s.json" "$url" || true)
            [[ "$code" =~ ^2 ]]
            jq -e --arg s "$s" --arg v "$EXPECTED_GATE" '
              .ok == true and
              .symbol == $s and
              .canonical_product_contract == "analyst_output" and
              .quality_gate_version == $v and
              .analyst_output.contract_version == $v and
              .analyst_output.lane == "CORE_4_12H" and
              .analyst_output.horizon == "4-12H" and
              (.analyst_output.decision == "LONG" or .analyst_output.decision == "SHORT" or .analyst_output.decision == "WAIT") and
              .analyst_output.analysis_only == true and
              .analyst_output.live_execution == false and
              .analysis_only == true and
              .live_execution == false and
              .production_threshold_changed_by_quality_gate == false and
              .production_score_preserved == true
            ' "/tmp/atlas-final-gate/$s.json" >/dev/null
            decision=$(jq -r '.analyst_output.decision' "/tmp/atlas-final-gate/$s.json")
            gate=$(jq -r '.analyst_output.setup_quality_gate.status' "/tmp/atlas-final-gate/$s.json")
            score=$(jq -r '.analyst_output.confidence' "/tmp/atlas-final-gate/$s.json")
            threshold=$(jq -r '.analyst_output.signal_threshold' "/tmp/atlas-final-gate/$s.json")
            echo "$s decision=$decision gate=$gate score=$score threshold=$threshold"
            if [[ "$decision" == "LONG" || "$decision" == "SHORT" ]]; then
              jq -e '.analyst_output.analysis_ready == true and (.analyst_output.entry|numbers) and (.analyst_output.stop_loss|numbers) and (.analyst_output.take_profit|numbers) and (.analyst_output.risk_reward|numbers)' "/tmp/atlas-final-gate/$s.json" >/dev/null
            else
              jq -e '.analyst_output.analysis_ready == false and .analyst_output.entry == null and .analyst_output.stop_loss == null and .analyst_output.take_profit == null' "/tmp/atlas-final-gate/$s.json" >/dev/null
            fi
          done
      - name: Verify public product shell carries canonical authority code
        shell: bash
        run: |
          set -euo pipefail
          curl -L --retry 4 --retry-delay 4 --retry-all-errors --connect-timeout 20 --max-time 120 -fsS "$BASE_URL/production-web-autoload.js?t=$(date +%s)" -o /tmp/production-web-autoload.js
          curl -L --retry 4 --retry-delay 4 --retry-all-errors --connect-timeout 20 --max-time 120 -fsS "$BASE_URL/atlas-unified-terminal.js?t=$(date +%s)" -o /tmp/atlas-unified-terminal.js
          grep -q 'ATLAS_PRODUCTION_WEB_AUTOLOAD_V4_ANALYST_OUTPUT' /tmp/production-web-autoload.js
          grep -q "contract:'analyst_output'" /tmp/production-web-autoload.js
          grep -q 'ATLAS_UNIFIED_TERMINAL_V2_ANALYST_OUTPUT' /tmp/atlas-unified-terminal.js
          grep -q "canonicalContract:'analyst_output'" /tmp/atlas-unified-terminal.js
          grep -q "horizon:'4-12H'" /tmp/atlas-unified-terminal.js
      - name: Final safety assertions
        shell: bash
        run: |
          set -euo pipefail
          jq -e '.product_quality_gate.score_threshold_unchanged == true and .product_quality_gate.raw_production_qualification_preserved == true and .product_quality_gate.analysis_only == true and .product_quality_gate.live_execution == false' /tmp/web-mode.json >/dev/null
          echo 'ATLAS FINAL PRODUCTION GATE: PASS'
