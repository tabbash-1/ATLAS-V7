name: ATLAS Final Production Gate

on:
  push:
    branches: [main]
    paths:
      - 'canonical_decision_contract.py'
      - 'final_trade_ready_guard.py'
      - 'cloud_web_only_final.py'
      - 'cloud_web_only.py'
      - 'product_quality_gate_overlay.py'
      - 'decision_intelligence.py'
      - 'production_trade_plan.py'
      - 'production_decision_api.py'
      - 'canonical_geometry_overlay.py'
      - 'production-web-autoload.js'
      - 'atlas-unified-terminal.js'
      - 'atlas-product-shell.js'
      - 'render.yaml'
      - '.github/workflows/atlas-final-production-gate.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: atlas-final-production-gate
  cancel-in-progress: true

jobs:
  verify-live-render:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BASE_URL: https://atlas-v7.onrender.com
      EXPECTED_FINAL_GUARD: FINAL_TRADE_READY_GUARD_V4_STRUCTURE_CONFIRMATION
      EXPECTED_CANONICAL: ATLAS_CANONICAL_DECISION_TRUTH_V1
      EXPECTED_GEOMETRY: ATLAS_CANONICAL_GEOMETRY_TRUTH_V1
    steps:
      - uses: actions/checkout@v4

      - name: Static canonical authority assertions
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile canonical_decision_contract.py final_trade_ready_guard.py cloud_web_only_final.py
          node --check production-web-autoload.js
          node --check atlas-product-shell.js
          node --check atlas-unified-terminal.js

          # Production autoload publishes the canonical decision contract explicitly.
          grep -Fq "ATLAS_PRODUCTION_WEB_AUTOLOAD_V6_STRICT_FINAL_TRUTH" production-web-autoload.js
          grep -Fq "contract:'canonical_decision'" production-web-autoload.js
          grep -Fq "sourceOfTruth:'FINAL_TRADE_GATE'" production-web-autoload.js
          ! grep -Fq "contract:'analyst_output'" production-web-autoload.js

          # Product shell V7 validates canonical truth directly inside truth().
          grep -Fq "ATLAS_PRODUCT_SHELL_V7_BOUND_ANALYST_GEOMETRY" atlas-product-shell.js
          grep -Fq "c?.schema!=='ATLAS_CANONICAL_DECISION_TRUTH_V1'" atlas-product-shell.js
          grep -Fq "c?.source_of_truth!=='FINAL_TRADE_GATE'" atlas-product-shell.js
          grep -Fq "a?.geometry_bound_to_canonical_decision!==true" atlas-product-shell.js

          # Unified terminal still exposes its canonical authority metadata.
          grep -Fq "ATLAS_UNIFIED_TERMINAL_V5_STRICT_FINAL_GATE" atlas-unified-terminal.js
          grep -Fq "canonicalContract:'canonical_decision'" atlas-unified-terminal.js
          grep -Fq "sourceOfTruth:'FINAL_TRADE_GATE'" atlas-unified-terminal.js
          ! grep -Fq "canonicalContract:'analyst_output'" atlas-unified-terminal.js
          echo 'STATIC_CANONICAL_AUTHORITY_OK'

      - name: Wait for exact deployed final runtime
        shell: bash
        run: |
          set -euo pipefail
          ok=0
          for attempt in $(seq 1 48); do
            code=$(curl -L --connect-timeout 15 --max-time 60 -sS -w '%{http_code}' -o /tmp/runtime.json "$BASE_URL/api/runtime/status?t=$(date +%s)" || true)
            if [[ "$code" =~ ^2 ]] && jq -e --arg fg "$EXPECTED_FINAL_GUARD" '.ok == true and .runtime == "WEB_ONLY_FINAL" and .product_horizon == "4-12H" and .live_execution == false and .final_trade_ready_guard.version == $fg' /tmp/runtime.json >/dev/null 2>&1; then
              ok=1; break
            fi
            echo "attempt=$attempt http=$code runtime=$(jq -r '.runtime // "missing"' /tmp/runtime.json 2>/dev/null || echo invalid) final_guard=$(jq -r '.final_trade_ready_guard.version // "missing"' /tmp/runtime.json 2>/dev/null || echo invalid)"
            sleep 10
          done
          test "$ok" = 1
          echo 'FINAL_RUNTIME_OK'

      - name: Verify canonical final truth for all supported assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/atlas-final-gate
          fetch_decision() {
            s="$1"; out="/tmp/atlas-final-gate/$s.json"; success=0
            for attempt in $(seq 1 10); do
              code=$(curl -L --connect-timeout 20 --max-time 90 -sS -w '%{http_code}' -o "$out.tmp" "$BASE_URL/api/decision/current?symbol=$s&t=$(date +%s%N)" || true)
              if [[ "$code" =~ ^2 ]] && jq -e '.ok == true' "$out.tmp" >/dev/null 2>&1; then mv "$out.tmp" "$out"; success=1; break; fi
              echo "$s fetch attempt=$attempt http=$code"
              rm -f "$out.tmp"; sleep 6
            done
            [[ "$success" == 1 ]]
          }
          for s in BTCUSDT ETHUSDT SOLUSDT XRPUSDT BNBUSDT DOGEUSDT ZECUSDT HYPEUSDT; do
            fetch_decision "$s"
            jq -e --arg s "$s" --arg cv "$EXPECTED_CANONICAL" --arg fg "$EXPECTED_FINAL_GUARD" '
              .ok == true and .symbol == $s and
              .analysis_only == true and .live_execution == false and
              .final_trade_gate.version == $fg and
              .canonical_decision.schema == $cv and
              .canonical_decision.canonical_source_present == true and
              .canonical_decision.source_of_truth == "FINAL_TRADE_GATE" and
              .canonical_decision.product_horizon == "4-12H" and
              .canonical_decision.evaluation_horizons_h == [4,8,12] and
              (.canonical_decision.decision_id | type == "string" and length > 8) and
              (.canonical_decision.trade_ready | type) == "boolean" and
              (if .canonical_decision.trade_ready == true then
                 (.canonical_decision.decision == "LONG" or .canonical_decision.decision == "SHORT") and
                 .final_trade_gate.trade_ready == true and
                 .final_trade_gate.status == "TRADE_READY" and
                 .final_trade_gate.direction == .canonical_decision.decision and
                 .actionable_decision == .canonical_decision.decision and
                 .analysis_ready == true and .can_execute == true
               else
                 .canonical_decision.decision == "WAIT" and
                 .actionable_decision == "WAIT" and
                 .analysis_ready == false and .can_execute == false and
                 .trade_plan.analysis_ready == false and .trade_plan.can_execute == false
               end) and
              (.analyst_output.analysis_only == true) and (.analyst_output.live_execution == false)
            ' "/tmp/atlas-final-gate/$s.json" >/dev/null
            echo "$s canonical=$(jq -r '.canonical_decision.decision' "/tmp/atlas-final-gate/$s.json") trade_ready=$(jq -r '.canonical_decision.trade_ready' "/tmp/atlas-final-gate/$s.json") wait_reason=$(jq -r '.canonical_decision.wait_reason // "NONE"' "/tmp/atlas-final-gate/$s.json") id=$(jq -r '.canonical_decision.decision_id' "/tmp/atlas-final-gate/$s.json")"
          done
          echo 'ALL_ASSETS_CANONICAL_FINAL_TRUTH_OK'

      - name: Verify deployed UI uses Final Trade Gate authority
        shell: bash
        run: |
          set -euo pipefail
          for f in production-web-autoload.js atlas-unified-terminal.js atlas-product-shell.js; do
            curl -L --retry 6 --retry-delay 5 --retry-all-errors --connect-timeout 20 --max-time 120 -fsS "$BASE_URL/$f?t=$(date +%s%N)" -o "/tmp/$f"
          done
          grep -Fq 'ATLAS_PRODUCTION_WEB_AUTOLOAD_V6_STRICT_FINAL_TRUTH' /tmp/production-web-autoload.js
          grep -Fq "contract:'canonical_decision'" /tmp/production-web-autoload.js
          grep -Fq "sourceOfTruth:'FINAL_TRADE_GATE'" /tmp/production-web-autoload.js
          grep -Fq 'ATLAS_PRODUCT_SHELL_V7_BOUND_ANALYST_GEOMETRY' /tmp/atlas-product-shell.js
          grep -Fq "c?.schema!=='ATLAS_CANONICAL_DECISION_TRUTH_V1'" /tmp/atlas-product-shell.js
          grep -Fq "c?.source_of_truth!=='FINAL_TRADE_GATE'" /tmp/atlas-product-shell.js
          grep -Fq "a?.geometry_bound_to_canonical_decision!==true" /tmp/atlas-product-shell.js
          grep -Fq 'ATLAS_UNIFIED_TERMINAL_V5_STRICT_FINAL_GATE' /tmp/atlas-unified-terminal.js
          grep -Fq "canonicalContract:'canonical_decision'" /tmp/atlas-unified-terminal.js
          grep -Fq "sourceOfTruth:'FINAL_TRADE_GATE'" /tmp/atlas-unified-terminal.js
          ! grep -Fq "contract:'analyst_output'" /tmp/production-web-autoload.js
          ! grep -Fq "canonicalContract:'analyst_output'" /tmp/atlas-unified-terminal.js
          echo 'LIVE_UI_CANONICAL_FINAL_TRUTH_OK'

      - name: Final invariant
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'ATLAS_CANONICAL_DECISION_TRUTH_V1' canonical_decision_contract.py
          grep -Fq 'FINAL_TRADE_READY_GUARD_V4_STRUCTURE_CONFIRMATION' final_trade_ready_guard.py
          grep -Fq 'BREAKOUT_STRUCTURE_NOT_CONFIRMED' final_trade_ready_guard.py
          grep -Fq 'BREAKOUT_CONFIRMATION_EVIDENCE_MISSING' final_trade_ready_guard.py
          echo 'ATLAS FINAL PRODUCTION GATE: PASS · SOURCE_OF_TRUTH=FINAL_TRADE_GATE · STRUCTURE_CONFIRMATION=REQUIRED_FOR_BREAKOUT'
