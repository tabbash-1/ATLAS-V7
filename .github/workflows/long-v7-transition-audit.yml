name: ATLAS LONG V7 Transition Audit

on:
  push:
    branches: [main]
    paths:
      - 'long_v7_transition_audit.py'
      - 'tests/test_long_v7_transition_audit.py'
      - 'long_v7_raw_representation_audit.py'
      - 'long_v7_fixed_episode_split.py'
      - 'qualified_false_confidence_audit.py'
      - 'status/production-snapshots.jsonl'
      - '.github/workflows/long-v7-transition-audit.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Syntax and regression tests
        run: |
          python -m py_compile long_v7_transition_audit.py tests/test_long_v7_transition_audit.py
          PYTHONPATH=. python tests/test_long_v7_transition_audit.py
      - name: Run transition audit
        run: python long_v7_transition_audit.py
      - name: Persist report
        run: |
          if [ -n "$(git status --porcelain status/long-v7-transition-audit.json)" ]; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add status/long-v7-transition-audit.json
            git commit -m 'research: update LONG V7 transition audit report'
            git push
          fi
